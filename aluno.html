<head>

<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:#0b0c0e;color:#f4f5f2;font:500 16px/1.5 system-ui,-apple-system,sans-serif;text-align:center}
main{max-width:340px}
svg{width:64px;height:64px;display:block;margin:0 auto 18px}
h1{font-size:26px;letter-spacing:-.03em;line-height:1.15;margin:0 0 8px}
h1 b{color:#c8ff3d;font-weight:400}
p{margin:0;color:rgba(244,245,242,.7);font-size:15px}
a{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;margin-top:22px;border-radius:999px;background:#c8ff3d;color:#0b0c0e;font-weight:700;text-decoration:none}

</head>
<body>
<main>
<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="24" fill="#c8ff3d"/><path d="M24 82 L50 38 L76 82" fill="none" stroke="#0b0c0e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/><path d="M37 66 H63" stroke="#0b0c0e" stroke-width="9" stroke-linecap="round"/><circle cx="50" cy="18" r="8" fill="#0b0c0e"/></svg>
<h1>Agora somos anab<b>tech</b></h1>
<p>O seu app mudou de endereço. Seus registros vão junto. Abrindo…</p>
<a id="ir" href="https://anabtech.github.io/app/aluno.html">Abrir o meu app</a>
</main>
<script>
/* Ponte: a página do aluno saiu de mgcoach.github.io/mgconsultoria e foi para anabtech.github.io/app.
   Leva o link pessoal e o que estava guardado neste celular (código, registros na fila, histórico) no endereço (#),
   que não é enviado a nenhum servidor. A página nova guarda tudo e apaga o # da barra de endereço. */
(function () {
  var NOVO = 'https://anabtech.github.io/app/aluno.html';
  var t = '';
  try { t = new URLSearchParams(location.hash.slice(1)).get('t') || new URLSearchParams(location.search).get('t') || ''; } catch (e) {}
  var ls = {}, n = 0;
  try {
    if (!t) { try { t = JSON.parse(localStorage.getItem('mgal.t') || '""'); } catch (e) {} }
    for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (/^mgal\./.test(k) && k !== 'mgal.snap' && k !== 'mgal.nov') { ls[k] = localStorage.getItem(k); n++; } }
  } catch (e) {}
  var url = NOVO + '#' + (t ? 't=' + encodeURIComponent(t) : '');
  try {
    if (n) {
      var b = btoa(unescape(encodeURIComponent(JSON.stringify({ v: 1, ls: ls })))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      if (b.length < 1500000) url += (t ? '&' : '') + 'mig=' + b;
    }
  } catch (e) {}
  document.getElementById('ir').href = url;
  setTimeout(function () { location.replace(url); }, 500);
})();
</script>
</body>
</html>
