<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef0f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MG COACH">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>MG COACH · Minha página</title>
<style>
:root{--paper:#eef0f2;--card:#fff;--rule:#dce2e7;--rule-soft:#edf0f3;--ink:#0c1a26;--ink-2:#5a6b78;--ink-3:#8e9ca8;--accent:#ff5a00;--accent-soft:#fff0e8;--ok:#16a34a;--ok-soft:#dcfce7;--down:#c2410c}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;font-size:14px;min-height:100vh}
[hidden]{display:none!important}
button,input,textarea,select{font:inherit;color:inherit}
.tela{max-width:420px;margin:0 auto;padding:max(48px,env(safe-area-inset-top)) 22px 40px;text-align:center}
.tela .mk{font-size:15px;font-weight:700;letter-spacing:-.01em}.tela .mk b{color:var(--accent)}
.tela h1{font-size:27px;line-height:1.15;letter-spacing:-.02em;margin:34px 0 8px}
.tela p{color:var(--ink-2);font-size:15px}
.pin{display:flex;gap:10px;justify-content:center;margin:26px 0 10px}
.pin input{width:58px;height:66px;border:1.5px solid var(--rule);border-radius:14px;background:var(--card);text-align:center;font-size:28px;font-weight:600;outline:none}
.pin input:focus{border-color:var(--ink)}
.erro{color:var(--down);font-size:14px;min-height:22px;margin-top:6px}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;font-size:15px;cursor:pointer;width:100%}
.bt.ln{background:var(--card);color:var(--ink);border-color:var(--rule)}
.bt:disabled{opacity:.55}
.carregando{display:inline-block;width:22px;height:22px;border:2.5px solid var(--rule);border-top-color:var(--accent);border-radius:50%;animation:gira .8s linear infinite;margin-top:30px}
@keyframes gira{to{transform:rotate(360deg)}}
/* faixa de status */
.st{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%) translateY(calc(100% + 40px));visibility:hidden;background:var(--ink);color:#fff;padding:11px 17px;border-radius:999px;font-size:14px;font-weight:500;z-index:90;transition:transform .25s;max-width:calc(100vw - 32px);text-align:center;box-shadow:0 8px 24px rgba(12,26,38,.25)}
.st.on{transform:translateX(-50%) translateY(0);visibility:visible}
.fila{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:9px 12px;font-size:13px;margin:12px 0 0}
/* registro de cargas */
.lg{margin:12px 15px 0 42px;padding:12px 12px 10px;border-radius:12px;background:var(--paper)}
.lg-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}
.lg-h b{font-size:13px}
.lg-ult{font-size:12px;color:var(--ink-2);text-align:right}
.lg-r{display:grid;grid-template-columns:minmax(22px,auto) 1fr 16px 1fr;align-items:center;gap:6px;margin-bottom:6px}
.lg-n{font-size:12.5px;color:var(--ink-2);font-weight:600;text-align:center;white-space:nowrap}.lg-r.tec .lg-n{font-size:11.5px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:3px 6px;min-width:52px}
.lg-r input{width:100%;min-width:0;height:40px;border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:0 10px;font-size:16px;outline:none}
.lg-r input:focus{border-color:var(--ink)}
.lg-r .x{text-align:center;color:var(--ink-3)}
.lg-add{border:none;background:none;color:var(--accent);font-weight:600;font-size:13px;padding:4px 0;cursor:pointer}
.lg-nota{width:100%;min-height:42px;border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:9px 10px;font-size:15px;resize:vertical;margin-top:6px;outline:none}
.lg-fim{margin:14px 0 6px}
.lg-fim p{text-align:center;color:var(--ink-2);font-size:13px;margin-top:8px}
.lg-fim p.ok{color:var(--ok);font-weight:600}
.ex.feito{border-color:#86efac}
/* dia do registro e lembretes */
.dreg{display:none;align-items:center;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;margin:12px 0 0;font-size:14px}
#tb-t:checked~main .dreg,#tb-d:checked~main .dreg{display:flex}
.dreg label{font-weight:600}
.dreg select{flex:1;min-width:150px;height:40px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:0 10px;font-size:16px;font-weight:600}
.dreg.outro{background:#fff7ed;border:2px solid var(--accent)}
.dreg.outro .dr-msg{flex-basis:100%;font-size:13px;color:#9a3412}
.dreg .dr-hoje{border:none;background:none;color:var(--accent);font-weight:700;font-size:13px;cursor:pointer;padding:4px 0}
.lemb{background:var(--accent);color:#fff;border-radius:16px;padding:14px 16px;margin:12px 0 0}
.lemb h3{font-size:16px;margin-bottom:2px}.lemb p{font-size:14px;color:rgba(255,255,255,.92)}
.lemb .lb{display:flex;gap:8px;margin-top:10px}.lemb button{flex:1;min-height:40px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer;border:1px solid #fff;background:#fff;color:var(--accent)}
.lemb button.ln{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.lcal{background:var(--card);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;margin:0 0 16px}
.lcal h3{font-size:16px;margin-bottom:2px}.lcal p{color:var(--ink-2);font-size:13.5px}
.lcal .lh{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.lcal .lh a{flex:1 0 auto;min-width:64px;display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--paper);font-weight:600;color:var(--ink);text-decoration:none}
.lcal small{display:block;margin-top:8px;color:var(--ink-3);font-size:12px}
/* avisos do MG na tela inicial */
.mgc{border-radius:16px;padding:14px 16px;margin:12px 0 0;box-shadow:0 6px 18px -10px rgba(12,26,38,.35)}
.mgc h3{font-size:16px;margin-bottom:3px;display:flex;align-items:center;gap:8px}.mgc h3 i{font-style:normal;font-size:18px}
.mgc p{font-size:14px}.mgc .lb{display:flex;gap:8px;margin-top:10px}.mgc button{flex:1;min-height:42px;border-radius:999px;font-weight:700;font-size:14px;cursor:pointer}
.mgc.fb{background:#0c1a26;color:#fff}.mgc.fb p{color:rgba(255,255,255,.85)}.mgc.fb button{background:var(--accent);border:none;color:#fff}
.mgc.rs{background:#eef6ff;border:2px solid #1668a8}.mgc.rs h3{color:#1668a8}.mgc.rs small{display:block;color:var(--ink-2);font-size:12.5px;margin-bottom:6px}
.mgc .q{background:#fff;border-radius:10px;padding:8px 10px;font-size:13.5px;color:var(--ink-2);white-space:pre-wrap;margin-bottom:8px}
.mgc .r{font-size:15px;white-space:pre-wrap;color:var(--ink)}.mgc.rs button{background:#1668a8;border:none;color:#fff}
.rsl{margin-top:16px}.rsl h2{font-size:18px;margin-bottom:8px}.rsl .it{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.rsl small{display:block;color:var(--ink-3);font-size:12px;margin-bottom:4px}.rsl .q{font-size:13.5px;color:var(--ink-2);white-space:pre-wrap}.rsl .r{margin-top:6px;font-size:14.5px;white-space:pre-wrap;border-left:3px solid #1668a8;padding-left:9px}
.dnota{display:block;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 14px;margin:12px 0}
.dnota span{display:block;font-weight:600;font-size:14px;margin-bottom:6px}.dnota small{display:block;font-size:12px;color:var(--ink-3);margin-top:4px}
.dnota textarea{width:100%;min-height:60px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);padding:9px 10px;font-size:15px;resize:vertical;outline:none}
/* água e semana */
.agua{background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 15px;margin:0 0 12px}
.ag-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:14px}.ag-t b{font-size:18px}.ag-t span{color:var(--ink-2);font-size:13px}
.ag-b{height:10px;border-radius:999px;background:#e0f2fe;margin-top:8px;overflow:hidden}.ag-b i{display:block;height:100%;background:linear-gradient(90deg,#38bdf8,#0284c7);border-radius:999px;transition:width .3s}
.ag-bt{display:flex;gap:6px;margin-top:10px}.ag-bt button{flex:1;min-height:40px;border-radius:10px;border:1px solid #bae6fd;background:#f0f9ff;color:#0369a1;font-weight:700;font-size:13.5px;cursor:pointer}.ag-bt button.mn{flex:0 0 44px;background:var(--paper);border-color:var(--rule);color:var(--ink-2)}
.sem{background:var(--card);border:1px solid var(--rule);border-radius:14px;margin:0 0 12px;overflow:hidden}
.sem summary{list-style:none;cursor:pointer;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:14.5px}.sem summary::-webkit-details-marker{display:none}.sem summary::after{content:"▾";color:var(--ink-3)}.sem[open] summary::after{content:"▴"}
.sem-b{padding:0 15px 14px}.sem-g{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sem-g div{background:var(--paper);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column}.sem-g span{font-size:11.5px;color:var(--ink-2);font-weight:600}.sem-g b{font-size:16px}.sem-g small{font-size:11.5px;color:var(--ink-2)}
.sem-g .ok{background:#ecfdf3}.sem-g .md{background:#fef9c3}.sem-g .bx{background:#fee2e2}
.sem-d{display:flex;gap:4px;align-items:flex-end;height:70px;margin:12px 0 4px}.sem-d div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end}.sem-d i{display:block;width:100%;border-radius:5px 5px 2px 2px;background:var(--accent);min-height:2px}.sem-d i.vz{background:var(--rule)}.sem-d span{font-size:10.5px;color:var(--ink-3)}
.sem-n{font-size:12px;color:var(--ink-3);margin-top:8px;line-height:1.45}
/* comi outra coisa */
.oc-bt{display:block;width:calc(100% - 30px);margin:6px 15px 0;min-height:38px;border:1px dashed var(--rule);border-radius:10px;background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:600;cursor:pointer}
.ck.troca.on{background:#eef6ff!important;color:#1668a8!important;border-color:#93c5fd!important}
.ov{position:fixed;inset:0;z-index:80;background:rgba(12,26,38,.45);display:flex;align-items:flex-end;justify-content:center}
.ov-c{background:var(--paper,#f6f7f9);width:100%;max-width:560px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.ov-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;padding:16px 16px 10px;background:var(--card,#fff);border-bottom:1px solid var(--rule)}
.ov-h small{display:block;font-size:12px;color:var(--ink-3);font-weight:600}.ov-h h3{font-size:19px;letter-spacing:-.01em}
.ov-x{flex:none;width:38px;height:38px;border-radius:999px;border:none;background:var(--paper);font-size:20px;cursor:pointer;color:var(--ink-2)}
.ov-b{flex:1;overflow:auto;padding:12px 16px 16px;-webkit-overflow-scrolling:touch}
.ov-f{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--card,#fff);border-top:1px solid var(--rule)}
.ov-f button{flex:1;min-height:46px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer;border:1px solid var(--rule);background:var(--card,#fff);color:var(--ink)}
.ov-f .pri{background:var(--accent);border-color:var(--accent);color:#fff}.ov-f .pri:disabled{opacity:.45}
.oc-plan{font-size:12.5px;color:var(--ink-2);background:var(--card,#fff);border:1px solid var(--rule);border-radius:10px;padding:8px 10px}
.oc-gbt{display:flex;align-items:center;gap:8px;width:100%;margin-top:8px;padding:10px 12px;border-radius:12px;border:1px solid #fed7aa;background:#fff7ed;color:#9a3412;font-weight:600;font-size:13.5px;cursor:pointer;text-align:left}
.oc-its{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.oc-it{display:flex;align-items:center;gap:10px;background:var(--card,#fff);border:1px solid var(--rule);border-radius:12px;padding:9px 10px}
.oc-it div{flex:1;min-width:0}.oc-it b{display:block;font-size:14px}.oc-it span{font-size:12.5px;color:var(--ink-2)}
.oc-it em{font-style:normal;font-weight:700;font-size:13.5px;white-space:nowrap}.oc-it button{flex:none;width:32px;height:32px;border-radius:999px;border:none;background:var(--paper);color:var(--ink-2);font-size:16px;cursor:pointer}
.oc-tot{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}.oc-tot div{background:#0c1a26;color:#fff;border-radius:10px;padding:7px 8px;display:flex;flex-direction:column}.oc-tot span{font-size:11px;opacity:.75}.oc-tot b{font-size:15px}
.oc-vazio{font-size:13.5px;color:var(--ink-3);text-align:center;padding:14px 8px;border:1px dashed var(--rule);border-radius:12px;margin-top:12px}
.oc-busca{position:relative;margin-top:14px}.oc-busca input{width:100%;height:46px;border:1.5px solid var(--ink);border-radius:12px;background:var(--card,#fff);padding:0 12px 0 38px;font-size:16px;outline:none}
.oc-busca::before{content:"🔍";position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.6}
.oc-res{display:flex;flex-direction:column;margin-top:6px;background:var(--card,#fff);border-radius:12px;overflow:hidden}
.oc-res button{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:11px 12px;border:none;border-bottom:1px solid var(--rule);background:transparent;text-align:left;font-size:14px;cursor:pointer;color:var(--ink)}
.oc-res button small{color:var(--ink-3);font-size:12px;white-space:nowrap}
.oc-ed{background:var(--card,#fff);border:2px solid var(--accent);border-radius:14px;padding:12px;margin-top:10px}
.oc-ed h4{font-size:15px;margin-bottom:8px}.oc-q{display:flex;align-items:center;gap:8px}
.oc-q button{width:44px;height:44px;border-radius:12px;border:1px solid var(--rule);background:var(--paper);font-size:22px;font-weight:700;cursor:pointer;color:var(--ink)}
.oc-q input{width:80px;height:44px;text-align:center;font-size:18px;font-weight:700;border:1px solid var(--rule);border-radius:12px;background:var(--paper);outline:none}
.oc-un{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.oc-un button{padding:8px 11px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.oc-un button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.oc-calc{margin-top:10px;font-size:13.5px;color:var(--ink-2)}.oc-calc b{color:var(--ink)}
.oc-add{width:100%;min-height:44px;margin-top:10px;border:none;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.gu h4{font-size:15px;margin:14px 0 8px}.gu p{font-size:13.5px;color:var(--ink-2);line-height:1.5}
.gu-m{display:grid;grid-template-columns:1fr 1fr;gap:8px}.gu-m div{background:var(--card,#fff);border:1px solid var(--rule);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:3px}
.gu-m .ic{font-size:30px;line-height:1.1}.gu-m b{font-size:14px}.gu-m span{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.gu-c{display:flex;flex-direction:column;gap:6px}.gu-c div{display:flex;gap:10px;align-items:center;background:var(--card,#fff);border:1px solid var(--rule);border-radius:12px;padding:8px 10px;font-size:13.5px}
.gu-c i{font-style:normal;font-size:22px;flex:none;width:30px;text-align:center}.gu-c b{white-space:nowrap}
.gu-dica{background:#fff7ed;border-radius:12px;padding:10px 12px;font-size:13.5px;color:#9a3412;margin-top:12px;line-height:1.5}
/* pagamento */
.mgc.mpg{background:#fff;border:2px solid var(--accent)}.mgc.mpg h3{color:#c2410c}.mgc.mpg p{color:var(--ink-2)}.mgc.mpg button{background:var(--accent);border:none;color:#fff}
.mgc.pgok{background:#ecfdf3;border:2px solid #86efac}.mgc.pgok h3{color:#15803d}.mgc.pgok p{color:var(--ink-2)}
.pgs{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:16px;margin:0 0 16px}
.pgs h2{font-size:18px}.pgs .pg-v{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:6px;flex-wrap:wrap}.pgs .pg-v b{font-size:26px;letter-spacing:-.02em}
.pg-st{display:inline-block;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:#ecfdf3;color:#15803d}.pg-st.av{background:#fff7ed;color:#c2410c}.pg-st.vc{background:#fee2e2;color:#b91c1c}
.pg-tb{display:flex;gap:6px;margin:14px 0 10px;background:var(--paper);padding:4px;border-radius:12px}.pg-tb button{flex:1;min-height:40px;border:none;border-radius:9px;background:transparent;font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer}.pg-tb button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.pg-qr{display:flex;justify-content:center;padding:12px;background:#fff;border:1px solid var(--rule);border-radius:14px;min-height:60px}.pg-qr svg{width:200px;height:200px;display:block}
.pg-bt{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:10px;border-radius:999px;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;border:none}
.pg-bt.pri{background:var(--accent);color:#fff}.pg-bt.sec{background:var(--paper);color:var(--ink);border:1px solid var(--rule)}.pg-bt.ok{background:#0c1a26;color:#fff}
.pgs .note{font-size:13px;color:var(--ink-2);margin-top:8px;line-height:1.45}.pgs .pg-k{font-size:13px;color:var(--ink-3);margin-top:8px;word-break:break-all}
.pg-c b{font-size:24px}.pg-inf{margin-top:12px;padding:10px 12px;border-radius:12px;background:#ecfdf3;color:#15803d;font-weight:600;font-size:14px}
/* dieta */
.ck{display:flex;align-items:center;justify-content:center;gap:8px;margin:12px 15px 0;width:calc(100% - 30px);min-height:42px;border-radius:999px;border:1px dashed var(--rule);background:var(--card);font-weight:600;font-size:14px;color:var(--ink-2);cursor:pointer}
.ck.on{background:var(--ok-soft);border:1px solid #86efac;color:var(--ok)}
.dhoje{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);border:1px solid var(--rule);border-radius:14px;padding:12px 15px;margin:0 0 12px;font-size:14px}
.dhoje b{font-size:16px}
.barra{height:6px;border-radius:9px;background:var(--rule-soft);overflow:hidden;margin-top:6px}.barra i{display:block;height:100%;background:var(--ok);border-radius:9px}
/* feedback */
.fbf{display:flex;flex-direction:column;gap:14px}
.fbf label.c{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.fbf label.c span{font-weight:400;color:var(--ink-2);font-size:13px}
.fbf input[type=text],.fbf input[type=number],.fbf textarea{width:100%;border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:10px 11px;font-size:16px;outline:none}
.fbf textarea{min-height:78px;resize:vertical}
.esc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.esc button,.ch button{min-height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--card);font-weight:600;cursor:pointer}
.esc button.on,.ch button.on{background:var(--ink);border-color:var(--ink);color:#fff}

<script>

const API = 'https://script.google.com/macros/s/AKfycbySZvMkRRn4x4WagqeLlU2m8urelZt2q_vnlHVDwHLYGnLgj891lNzCCE-AArD_MRBYFA/exec';
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const LS = {
  get(k, d) { try { const v = localStorage.getItem('mgal.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mgal.' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('mgal.' + k); } catch (e) {} }
};
const hojeISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const kgTxt = v => String(v).replace('.', ',');
const dataBR = iso => { const [y, m, d] = String(iso).split('-'); return d ? `${d}/${m}` : iso; };
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const DIAS_JS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sab'];
/* dia do registro: hoje por padrão; o aluno pode voltar até 7 dias para registrar o que esqueceu */
let DIA_REG = '';
const isoMenos = n => { const d = new Date(); d.setDate(d.getDate() - n); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const dataReg = () => DIA_REG || hojeISO();
const dowISO = iso => new Date(iso + 'T12:00:00').getDay();
const DSEM = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
const nomeDiaReg = iso => iso === hojeISO() ? 'hoje' : iso === isoMenos(1) ? 'ontem' : `${DSEM[dowISO(iso)]}, ${dataBR(iso)}`;
const deDia = iso => iso === hojeISO() || iso === isoMenos(1) ? 'de ' + nomeDiaReg(iso) : 'de ' + dataBR(iso);
let _stT;
function aviso(t, ms = 2600) { const el = $('st'); el.textContent = t; el.classList.add('on'); clearTimeout(_stT); _stT = setTimeout(() => el.classList.remove('on'), ms); }

/* ---------- link e código ---------- */
function tokenDaUrl() { const h = new URLSearchParams(location.hash.slice(1)); return h.get('t') || new URLSearchParams(location.search).get('t') || ''; }
let T = tokenDaUrl();
if (T && T !== LS.get('t', '')) { ['pin', 'snap'].forEach(LS.del); LS.set('t', T); }
T = T || LS.get('t', '');
if (T && !tokenDaUrl()) { try { history.replaceState(null, '', location.pathname + '#t=' + T); } catch (e) {} }
let PIN = LS.get('pin', ''), SNAP = LS.get('snap', null);

async function buscar(pin) {
  const r = await fetch(`${API}?acao=aluno&t=${encodeURIComponent(T)}&p=${encodeURIComponent(pin)}`, { cache: 'no-store' });
  return r.json();
}

  $('app').innerHTML = `<div class="tela"><span class="mk">MG <b>COACH</b></span><h1>Link incompleto</h1><p>Abra de novo o link que seu coach mandou pelo WhatsApp.</p></div>`;
}
function telaInativa() {
  ['pin', 'snap'].forEach(LS.del);
  $('app').innerHTML = `<div class="tela"><span class="mk">MG <b>COACH</b></span><h1>Página indisponível</h1><p>Esta página não está ativa no momento. Fale com seu coach pelo WhatsApp.</p></div>`;

/* ---------- pagamento do plano: Pix (QR Code e copia e cola) e cartão (link do Mercado Pago) ---------- */
const brl = v => 'R$ ' + Number(v || 0).toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
const diasAte = iso => Math.round((new Date(iso + 'T12:00:00') - new Date(hojeISO() + 'T12:00:00')) / 864e5);
const pgInformado = () => { const P = SNAP.pag; return P && LS.get('pgInf.' + (P.venc || 'x'), null); };
function emv(id, v) { v = String(v); return id + String(v.length).padStart(2, '0') + v; }
function crc16(t) { let c = 0xFFFF; for (let i = 0; i < t.length; i++) { c ^= t.charCodeAt(i) << 8; for (let j = 0; j < 8; j++) c = c & 0x8000 ? ((c << 1) ^ 0x1021) & 0xFFFF : (c << 1) & 0xFFFF; } return c.toString(16).toUpperCase().padStart(4, '0'); }
const semAcento = t => String(t || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^A-Za-z0-9 .-]/g, '').toUpperCase().trim();
function pixCopiaCola(px, valor, txid) {
  const p = emv('00', '01') + emv('26', emv('00', 'br.gov.bcb.pix') + emv('01', px.chave)) + emv('52', '0000') + emv('53', '986') + (valor > 0 ? emv('54', valor.toFixed(2)) : '') +
    emv('58', 'BR') + emv('59', semAcento(px.nome).slice(0, 25) || 'MG COACH') + emv('60', semAcento(px.cidade).slice(0, 15) || 'SALVADOR') + emv('62', emv('05', String(txid || '').replace(/[^A-Za-z0-9]/g, '').slice(0, 25) || '***')) + '6304';
  return p + crc16(p);
}
function cardPag() {
  const P = SNAP.pag; if (!P || !P.venc) return '';
  const d = diasAte(P.venc), inf = pgInformado();
  if (d > 7) return ''; /* semana da renovação */

  const t = d < 0 ? `Seu plano venceu em ${dataBR(P.venc)}` : d === 0 ? 'Seu plano vence hoje' : d === 1 ? 'Seu plano vence amanhã' : `Semana de renovação: seu plano vence em ${d} dias`;
  return `<div class="mgc mpg" role="status"><h3><i>💳</i>${esc(t)}</h3><p>${d < 0 ? 'Faça o pagamento para retomar o acompanhamento' : `Faça o pagamento até ${dataBR(P.venc)} para seguir sem pausa no acompanhamento`}. É rápido: Pix ou cartão aqui mesmo no app.</p><div class="lb"><button type="button" id="mgPg">Pagar plano</button></div></div>`;
}
function irPagamento() { const tb = $('tb-f'); if (tb) { tb.checked = true; LS.set('aba', 'tb-f'); } const s = $('pagSec'); if (s) setTimeout(() => s.scrollIntoView({ behavior: 'smooth', block: 'start' }), 50); }
function blocoPag() {

    <div data-pp="pix"><div class="pg-qr" id="pgQr"><span style="font-size:13px;color:var(--ink-3)">Gerando QR Code…</span></div>
      <button class="pg-bt pri" type="button" id="pgCopia">Copiar Pix copia e cola</button>

    ${inf ? `<div class="pg-inf">✓ Você informou o pagamento por ${inf.forma === 'cartao' ? 'cartão' : 'Pix'} em ${dataBR(inf.data)}. Eu confirmo em breve.</div>`
      : P.aviso ? `<button class="pg-bt ok" type="button" id="pgJa">Já paguei</button><p class="note" style="text-align:center">Toque depois de pagar. Eu confiro e confirmo a renovação.</p>`

let _qrLib;
/* gerador de QR Code (qrcode-generator, MIT, Kazuhiko Arase) fica junto do app: qr.js */
function carregarQR() { if (window.qrcode) return Promise.resolve(); if (_qrLib) return _qrLib;
  _qrLib = new Promise((ok, erro) => { const sc = document.createElement('script'); sc.src = 'qr.js'; sc.onload = ok; sc.onerror = () => { _qrLib = null; erro(); }; document.head.appendChild(sc); }); return _qrLib; }

    .catch(() => { const q = $('pgQr'); if (q) q.innerHTML = '<span style="font-size:13px;color:var(--ink-3)">Sem internet para o QR Code. Use o copia e cola.</span>'; });
  $('pgCopia').onclick = async () => { try { await navigator.clipboard.writeText(code); } catch (e) { const t = document.createElement('textarea'); t.value = code; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); } catch (er) {} t.remove(); } $('pgCopia').textContent = 'Copiado! Agora cole no app do banco'; setTimeout(() => { const b = $('pgCopia'); if (b) b.textContent = 'Copiar Pix copia e cola'; }, 4000); };
  sec.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { sec.querySelectorAll('[data-pg]').forEach(x => { const on = x === b; x.classList.toggle('on', on); x.setAttribute('aria-selected', on); }); sec.querySelectorAll('[data-pp]').forEach(p => { p.hidden = p.dataset.pp !== b.dataset.pg; }); });
  const ja = $('pgJa'); if (ja) ja.onclick = () => {
    const aba = sec.querySelector('[data-pg].on'), forma = aba ? aba.dataset.pg : 'pix', valor = forma === 'cartao' && P.cartao ? P.cartao.valor : P.valor;
    if (!confirm(`Confirmar que você pagou ${brl(valor)} por ${forma === 'cartao' ? 'cartão' : 'Pix'}?`)) return;

    sec.outerHTML = blocoPag(); ligarPag(); cardsMG(); aviso('Pagamento informado. Obrigado!');
  };
}

}

/* qual opção de refeição e quais trocas estão escolhidas neste card */
function escolhaRef(art) {

  const box = o ? art.querySelector('.opbox-' + oi) : art, s = [];
  if (box) box.querySelectorAll('input.rd[name^="s-"]:checked').forEach(x => { const ti = +x.name.split('-').pop(); s[ti] = +x.id.split('-').pop(); });
  return { o: oi, s: [...s].map(v => v || 0) };
}
function aplicarEscolhas(e) {
  Object.entries(e.esc || {}).forEach(([t, M]) => { const arts = document.querySelectorAll('.plano-' + t + ' article.ref');
    Object.entries(M).forEach(([j, c]) => { const art = arts[+j]; if (!art || !c || !(e.feitas[t] || []).includes(+j)) return;
      const o = art.querySelector(`input.rd[name^="o-"][id$="-${c.o}"]`); if (o) o.checked = true;
      const box = o ? art.querySelector('.opbox-' + c.o) : art; if (!box) return;
      (c.s || []).forEach((si, ti) => { const r = [...box.querySelectorAll('input.rd[name^="s-"]')].find(x => x.name.endsWith('-' + ti) && x.id.endsWith('-' + si)); if (r) r.checked = true; }); }); });
}
function pintarDieta() {
  const D = SNAP.dieta || {}, d = dataReg(), e = LS.get('dieta.' + d, { feitas: {} }); aplicarEscolhas(e);
  const qd = d === hojeISO() ? 'hoje' : d === isoMenos(1) ? 'ontem' : 'em ' + dataBR(d), Qd = d === hojeISO() ? 'Hoje' : d === isoMenos(1) ? 'Ontem' : 'Em ' + nomeDiaReg(d);
  document.querySelectorAll('.ck').forEach(b => { const on = (e.feitas[b.dataset.t] || []).includes(+b.dataset.j), o = ((e.outra || {})[b.dataset.t] || {})[b.dataset.j];
    b.classList.toggle('on', on); b.classList.toggle('troca', !!(on && o)); b.textContent = on && o ? `✓ Comi outra coisa · ${Math.round(somaM(o.it)[0])} kcal` : on ? '✓ Refeição feita ' + qd : 'Marcar como feita ' + qd; });
  const meta = +D.agua || 0, ml = +e.agua || 0;
  document.querySelectorAll('.agua').forEach(el => { el.querySelector('.ag-v').textContent = (Math.round(ml / 100) / 10).toString().replace('.', ',') + ' L'; el.querySelector('.ag-q').textContent = qd;
    el.querySelector('.ag-m').textContent = meta ? `meta ${(Math.round(meta / 100) / 10).toString().replace('.', ',')} L${ml >= meta ? ' ✓' : ''}` : ''; el.querySelector('.ag-b i').style.width = (meta ? Math.min(100, ml / meta * 100) : Math.min(100, ml / 30)) + '%'; });
  document.querySelectorAll('.sem').forEach(el => { const op = el.open; el.innerHTML = resumoSemana(); el.open = op; });
  document.querySelectorAll('.oc-bt').forEach(b => { const o = ((e.outra || {})[b.dataset.t] || {})[b.dataset.j]; b.textContent = o ? 'Editar o que comi' : 'Comi outra coisa'; });
  document.querySelectorAll('.dnota').forEach(el => { el.querySelector('.dn-d').textContent = qd; const ta = el.querySelector('textarea'); if (document.activeElement !== ta) ta.value = e.nota || ''; });
  document.querySelectorAll('.dhoje').forEach(el => { const t = el.dataset.t, tot = ((D.refs || {})[t] || []).length, n = (e.feitas[t] || []).length;
    el.innerHTML = `<div style="flex:1"><div>${Qd} você fez <b>${n} de ${tot}</b> refeições</div><div class="barra"><i style="width:${tot ? Math.round(n / tot * 100) : 0}%"></i></div></div>`; });
}
function detDia(t, e) {
  const D = SNAP.dieta || {}, nomes = (D.refs || {})[t] || [], f = (e.feitas[t] || []).slice().sort((a, b) => a - b);
  return f.map(j => { const n = nomes[j] || ('Refeição ' + (j + 1)), R = ((D.det || {})[t] || [])[j], c = ((e.esc || {})[t] || {})[j] || { o: 0, s: [] };
    const ou = ((e.outra || {})[t] || {})[j];
    if (ou && ou.it && ou.it.length) return { n, troca: 1, it: ou.it.slice(0, 12).map(x => `${x.n}: ${fmtQ(x.q)} ${plurUn(x.q, x.un)}${x.un !== 'gramas' ? ` (${Math.round(x.g)} g)` : ''}`), m: somaM(ou.it).map(v => Math.round(v)) };
    if (!R) return { n }; const op = R.ops[c.o] || R.ops[0], m = op.base.slice(), esc = [];
    op.tr.forEach((alts, ti) => { const x = alts[(c.s || [])[ti] || 0] || alts[0]; x.m.forEach((v, i) => { m[i] += v; }); esc.push(x.n); });
    const o = { n, m, esc }; if (R.ops.length > 1) o.op = op.nome; return o; });
}
const tipoDoDia = d => { const D = SNAP.dieta || {}; return D.ciclo ? (D.ciclo[DIAS_JS[dowISO(d)]] || (D.tipos || ['unico'])[0]) : (D.tipos || ['unico'])[0]; };
function enviarDieta(t, hoje) {
  const D = SNAP.dieta || {}; hoje = hoje || dataReg(); t = t || tipoDoDia(hoje); const e = LS.get('dieta.' + hoje, { feitas: {} });
  const nomes = (D.refs || {})[t] || []; const f = (e.feitas[t] || []).slice().sort((a, b) => a - b);
  const det = detDia(t, e);
  enfileirar({ tipo: 'dieta', id: 'dieta-' + hoje, _v: Date.now(), data: hoje, plano: t, feitas: f.map(j => nomes[j] || ('Refeição ' + (j + 1))), total: nomes.length, det, refs: nomes, alvo: (D.alvo || {})[t] || null, nota: String(e.nota || '').trim().slice(0, 1000), agua: Math.max(0, Math.min(10000, Math.round(+e.agua || 0))) });
}

/* ---------- feedback semanal ---------- */
function montarFeedback(sec) {
  const ult = LS.get('ultFb', '') > (SNAP.ultFeedback || '') ? LS.get('ultFb', '') : (SNAP.ultFeedback || '');
  const escala = (k, a, b) => `<div class="esc" data-k="${k}">${[1, 2, 3, 4, 5].map(n => `<button type="button" data-v="${n}">${n}</button>`).join('')}</div><div class="esc-l"><span>${a}</span><span>${b}</span></div>`;
  sec.innerHTML = `<section class="head"><h1>Feedback da semana</h1><p class="foco">Conte como foi a sua semana. Leva 1 minuto e me ajuda a ajustar o seu protocolo.</p></section>
    ${ult ? `<p class="fb-ult">Último feedback enviado em ${esc(dataBR(ult))}.</p>` : ''}
    <form class="fbf block" id="fbf">
      <label class="c">Peso hoje (kg)<span>Em jejum, de preferência. Deixe em branco se não se pesou.</span><input type="text" inputmode="decimal" id="fPeso" placeholder="Ex.: 72,4"></label>
      <div class="c"><label class="c">Sono</label>${escala('sono', 'Muito ruim', 'Ótimo')}</div>
      <div class="c"><label class="c">Energia nos treinos</label>${escala('energia', 'Sem energia', 'Muita energia')}</div>
      <div class="c"><label class="c">Fome durante o dia</label>${escala('fome', 'Pouca fome', 'Muita fome')}</div>
      <div class="c"><label class="c">Quanto da dieta você seguiu?</label><div class="ch" data-k="dieta">${['Quase nada', 'Metade', 'Quase tudo', 'Tudo'].map(v => `<button type="button" data-v="${v}">${v}</button>`).join('')}</div></div>
      <label class="c">Quantos treinos você fez nesta semana?<input type="number" inputmode="numeric" id="fTreinos" min="0" max="14" placeholder="Ex.: 4"></label>
      <label class="c">Alguma dor ou desconforto?<span>Onde, em qual exercício e quando começou.</span><textarea id="fDores" placeholder="Se não teve, deixe em branco."></textarea></label>
      <label class="c">Comentário para o coach<textarea id="fCom" placeholder="Dificuldades, vitórias, dúvidas, mudanças na rotina…"></textarea></label>
      <button class="bt" type="submit">Enviar feedback</button><p class="erro" id="fe" style="text-align:center"></p>
    </form>`;
  const val = {};
  sec.querySelectorAll('.esc,.ch').forEach(g => g.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return; val[g.dataset.k] = b.dataset.v; g.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); }));
  $('fbf').onsubmit = e => {
    e.preventDefault();
    const reg = { tipo: 'feedback', id: novoId(), _v: Date.now(), data: hojeISO(), peso: $('fPeso').value.trim().replace(',', '.'), sono: val.sono || '', energia: val.energia || '', fome: val.fome || '', dieta: val.dieta || '', treinos: $('fTreinos').value.trim(), dores: $('fDores').value.trim(), comentario: $('fCom').value.trim() };
    if (!reg.peso && !reg.sono && !reg.energia && !reg.fome && !reg.dieta && !reg.treinos && !reg.dores && !reg.comentario) { $('fe').textContent = 'Preencha pelo menos uma resposta.'; return; }
    LS.set('ultFb', reg.data); cardsMG();
    enfileirar(reg).then(() => { if (fila().some(x => x.id === reg.id)) aviso('Feedback salvo. Vai para o seu coach quando tiver internet.', 4000); });
    sec.querySelector('#fbf').outerHTML = `<div class="block" style="text-align:center;padding:26px 18px"><h3 style="font-size:19px;margin-bottom:6px">Feedback enviado ✓</h3><p style="color:var(--ink-2)">Obrigado! Eu leio e, se precisar, ajusto o seu protocolo.</p></div>`;
    window.scrollTo(0, 0);

}

/* ---------- fotos de progresso ---------- */
const POS = [['frente', 'Frente'], ['lado', 'Lado'], ['costas', 'Costas'], ['outra', 'Outra']];
let FOTOS = {}, _fotoBusy = false;
function reduzirFoto(file) {
  return new Promise((ok, erro) => {
    const u = URL.createObjectURL(file), img = new Image();
    img.onerror = () => { URL.revokeObjectURL(u); erro(new Error('imagem')); };
    img.onload = () => {
      try {
        let lado = 1280, q = 0.82, d = '';
        for (let i = 0; i < 4; i++) {
          const k = Math.min(1, lado / Math.max(img.naturalWidth, img.naturalHeight));
          const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(img, 0, 0, c.width, c.height);
          d = c.toDataURL('image/jpeg', q);
          if (d.length < 900000) break;
          lado = Math.round(lado * 0.8); q -= 0.08;
        }
        URL.revokeObjectURL(u);
        if (!d.startsWith('data:image/jpeg;base64,/9j/')) return erro(new Error('formato'));
        ok({ url: d, b64: d.slice(23) });
      } catch (e) { URL.revokeObjectURL(u); erro(e); }
    };
    img.src = u;
  });
}
function ultFotos() {
  const L = (SNAP.fotos || []).map(f => f.data).concat(LS.get('fotosEnv', []).flatMap(x => Array(x.n).fill(x.data)));
  if (!L.length) return null; const d = L.sort().reverse()[0];
  const n = Math.max((SNAP.fotos || []).filter(f => f.data === d).length, LS.get('fotosEnv', []).filter(x => x.data === d).reduce((s, x) => s + x.n, 0));
  return { data: d, n };
}
function montarFotos(sec) {
  const ant = $('fts'); if (ant) ant.remove();
  const u = ultFotos();
  sec.insertAdjacentHTML('beforeend', `<section class="block fts" id="fts"><h3>Fotos de progresso</h3><p>É pelas fotos que a gente enxerga a mudança que a balança não mostra. Só o seu coach vê.</p>
    <div class="ft-g">${POS.map(([k, t]) => `<label class="ft-s${FOTOS[k] ? ' tem' : ''}${FOTOS[k] && FOTOS[k].ok ? ' ok' : ''}" data-pos="${k}"><input type="file" accept="image/*" aria-label="Foto: ${t}"><span class="ft-i">${FOTOS[k] ? `<img src="${FOTOS[k].url}" alt="">` : '+'}</span>${t}</label>`).join('')}</div>
    <ul class="ft-dica"><li>Mesmo lugar, mesma luz e mesma roupa de sempre.</li><li>Corpo inteiro, celular na altura do umbigo.</li><li>De manhã, em jejum, se der.</li></ul>
    <button class="bt" type="button" id="ftOk" disabled>Enviar fotos</button><p class="erro" id="ftE" style="text-align:center"></p>
    ${u ? `<p class="fb-ult" style="text-align:center;margin:4px 0 0">Últimas fotos enviadas em ${esc(dataBR(u.data))} (${u.n} ${u.n === 1 ? 'foto' : 'fotos'}).</p>` : ''}</section>`);
  const box = $('fts'), bt = $('ftOk');
  const pend = () => POS.map(p => p[0]).filter(k => FOTOS[k] && !FOTOS[k].ok);
  const pintar = () => { const n = pend().length; bt.disabled = !n || _fotoBusy; if (!_fotoBusy) bt.textContent = n ? `Enviar ${n} ${n === 1 ? 'foto' : 'fotos'}` : 'Enviar fotos'; };
  box.querySelectorAll('.ft-s input').forEach(inp => inp.addEventListener('change', async () => {
    const f = inp.files && inp.files[0], lab = inp.closest('.ft-s'), k = lab.dataset.pos; if (!f) return;
    $('ftE').textContent = '';
    try { const r = await reduzirFoto(f); FOTOS[k] = { id: novoId(), url: r.url, b64: r.b64 }; lab.className = 'ft-s tem'; lab.querySelector('.ft-i').innerHTML = `<img src="${r.url}" alt="">`; }
    catch (e) { $('ftE').textContent = 'Não consegui abrir essa foto. Tente outra, ou tire a foto de novo.'; }
    inp.value = ''; pintar();
  }));
  bt.onclick = async () => {
    const L = pend(); if (!L.length || _fotoBusy) return;
    if (!navigator.onLine) { $('ftE').textContent = 'Sem internet. Conecte e toque em Enviar de novo.'; return; }
    _fotoBusy = true; bt.disabled = true; $('ftE').textContent = ''; let ok = 0, erro = '';
    for (let i = 0; i < L.length; i++) {
      const k = L[i], ft = FOTOS[k], lab = box.querySelector(`.ft-s[data-pos="${k}"]`);
      bt.textContent = `Enviando ${i + 1} de ${L.length}…`; lab.classList.add('indo');
      let r = '';
      try { const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ acao: 'foto', t: T, p: PIN, foto: { id: ft.id, data: hojeISO(), pos: k, img: ft.b64 } }) }); r = (await res.text()).trim(); }
      catch (e) { r = 'rede'; }
      lab.classList.remove('indo');
      if (r === 'ok') { ft.ok = true; ft.b64 = ''; lab.classList.add('ok'); ok++; continue; }
      if (r === 'codigo' || r === 'link') { _fotoBusy = false; LS.del('pin'); PIN = ''; return r === 'link' ? telaInativa() : telaPin('O código mudou. Peça o código novo ao seu coach.'); }
      erro = r === 'limite' ? 'Você já mandou muitas fotos hoje. Tente de novo amanhã.' : r === 'rede' ? 'A internet caiu no meio do envio. Toque em Enviar para mandar as que faltam.' : 'Não deu para enviar agora. Toque em Enviar para tentar de novo.';
      break;
    }
    _fotoBusy = false;
    if (ok) { const env = LS.get('fotosEnv', []); env.push({ data: hojeISO(), n: ok }); LS.set('fotosEnv', env.slice(-30)); }
    if (erro) { $('ftE').textContent = erro; return pintar(); }
    FOTOS = {};
    box.innerHTML = `<div style="text-align:center;padding:12px 0"><h3 style="font-size:19px;margin-bottom:6px">${ok === 1 ? 'Foto enviada' : ok + ' fotos enviadas'} ✓</h3><p style="color:var(--ink-2)">Chegaram para o seu coach. Na próxima vez, repita o mesmo lugar e a mesma luz para a comparação ficar justa.</p><button class="bt ln" type="button" id="ftMais" style="margin-top:14px">Mandar outras fotos</button></div>`;
    $('ftMais').onclick = () => montarFotos(sec);
  };
  pintar();
}

/* ---------- atualizar o protocolo quando o coach mudar ---------- */
let _ultBusca = 0;
async function atualizarSnap() {
  if (!PIN || Date.now() - _ultBusca < 60000) return; _ultBusca = Date.now();
  try {
    const r = await buscar(PIN);
    if (r.ok) { const mudou = !SNAP || r.dados.pubEm !== SNAP.pubEm; SNAP = r.dados; LS.set('snap', SNAP); if (mudou && !_fotoBusy && !Object.keys(FOTOS).length && !document.activeElement.matches('input,textarea')) { const y = scrollY; const aba = LS.get('aba', ''); montar(); if (aba && $(aba)) $(aba).checked = true; scrollTo(0, y); } }
    else if (r.erro === 'link') telaInativa();
    else if (r.erro === 'codigo') { LS.del('pin'); PIN = ''; telaPin('O código mudou. Peça o código novo ao seu coach.'); }
  } catch (e) {}
}

/* ---------- início ---------- */
if (!T) telaSemLink();
else if (PIN && SNAP) { montar(); atualizarSnap(); enviarFila(); }
else if (PIN) { buscar(PIN).then(r => { if (r.ok) { SNAP = r.dados; LS.set('snap', SNAP); montar(); enviarFila(); } else if (r.erro === 'link') telaInativa(); else telaPin(); }).catch(() => telaPin('Sem internet. Conecte e tente de novo.')); }
else telaPin();
</script>
