function gerarProtocoloHTML(a, inc = { treino: true, dieta: true, protocolo: true }, inicio) {
  const nome = a.dados.nome || 'Aluno', pn = primeiroNome(nome); const hoje = todayISO();
  const css = [EXPORT_CSS, GUIA_CSS]; const parts = [];
  const tabs = [['t', 'Treino', inc.treino], ['d', 'Dieta', inc.dieta], ['p', 'Protocolo', inc.protocolo]].filter(t => t[2]);
  tabs.forEach(([k]) => css.push(`#tb-${k}:checked~main .pg-${k}{display:block}#tb-${k}:checked~.bar label[for=tb-${k}]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}`));
  /* treino */
  if (inc.treino) {
    const T = a.treino.dias; const prim = (DIAS.find(([k]) => T[k].ex.length) || DIAS[0])[0];
    DIAS.forEach(([k]) => css.push(`#d-${k}:checked~.week label[for=d-${k}]{background:var(--ink);border-color:var(--ink);border-style:solid}#d-${k}:checked~.week label[for=d-${k}] .d{color:var(--on-ink-day)}#d-${k}:checked~.week label[for=d-${k}] .s{color:var(--on-ink)}#d-${k}:checked~.sesss .s-${k}{display:block}`));
    let h = `<section class="pg pg-t"><p class="ola">Olá, <b>${esc(pn)}</b>. Seu protocolo de ${dataBR(hoje)}.</p>${DIAS.map(([k]) => `<input type="radio" class="rd" name="dia" id="d-${k}"${k === prim ? ' checked' : ''}>`).join('')}
      <div class="week">${DIAS.map(([k, ab]) => { const d = T[k]; return `<label for="d-${k}" class="day${d.ex.length ? '' : ' rest'}"><span class="d">${ab}</span><span class="s">${esc(d.ex.length ? (d.sigla || d.nome.slice(0, 4) || ab) : '—')}</span></label>`; }).join('')}</div><div class="sesss">`;
    DIAS.forEach(([k, ab, nomeDia]) => {
      const d = T[k]; const st = statsDia(d);
      if (!d.ex.length) { h += `<div class="sess s-${k}"><section class="head"><h1>Descanso</h1><p class="foco">${esc(nomeDia)} é dia sem treino de musculação. A recuperação também faz parte do protocolo.</p></section></div>`; return; }
      h += `<div class="sess s-${k}"><section class="head"><h1>${esc(d.nome || nomeDia)}</h1>${d.desc ? `<p class="foco">${esc(d.desc)}</p>` : ''}<div class="stats"><div class="stat"><span class="n">${st.ex}</span><span class="l">exercícios</span></div><div class="stat"><span class="n">${st.series}</span><span class="l">séries</span></div><div class="stat"><span class="n">~${st.min} min</span><span class="l">duração</span></div></div></section>`;
      d.ex.forEach((x, i) => {
        const e = exById(x.exId); const ims = exImgs(e, true);
        h += `<article class="ex"><div class="ex-top"><span class="ex-n">${i + 1}</span><div class="ex-main"><div class="ex-name">${esc(x.n)}</div><div class="ex-fmt"><span>${esc(fmtLabel(x))}</span></div></div></div>
          ${x.obs ? `<p class="ex-nota">${esc(x.obs)}</p>` : ''}<div class="ex-tb">${tabelaPresc(x, a.treino.usarRIR)}</div>
          ${ims.length || (e && (e.ins || []).length) ? `<details class="exec"><summary>Ver execução</summary><div class="exec-b">${ims.length ? `<div class="media">${ims.map(s => `<img src="${esc(s)}" alt="Execução de ${esc(x.n)}" loading="lazy">`).join('')}</div>` : ''}${e && (e.ins || []).length ? `<ol class="ins">${e.ins.map(s => `<li>${esc(s)}</li>`).join('')}</ol>` : ''}</div></details>` : '<div style="height:14px"></div>'}</article>`;
      });
      h += `</div>`;
    });
    parts.push(h + `</div></section>`);
  }
  /* dieta */
  if (inc.dieta) {
    const D = a.dieta; const tipos = D.ciclo.ativa ? ['alto', 'medio', 'baixo'] : ['unico'];
    let h = `<section class="pg pg-d">`;
    if (D.ciclo.ativa) {
      tipos.forEach((t, i) => { h += `<input type="radio" class="rd" name="pl" id="pl-${t}"${i === 0 ? ' checked' : ''}>`; css.push(`#pl-${t}:checked~.tipos label[for=pl-${t}]{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:600}#pl-${t}:checked~.plano-${t}{display:block}`); });
      h += `<div class="opts tipos">${TIPOS.map(([t, n]) => `<label class="opt" for="pl-${t}">${n}</label>`).join('')}</div>`;
      h += `<p class="ciclo">${DIAS.map(([k, ab]) => `${ab} ${{ alto: 'alto', medio: 'médio', baixo: 'baixo' }[D.ciclo.dias[k]]}`).join(' · ')}</p>`;
    }
    tipos.forEach(t => {
      const pl = planoDe(a, t); const M0 = metasDieta(a, t); const S = somaPlano(pl); const peso = num(a.dados.peso);
      const M = M0.ok && Math.abs(S.k - M0.kcal) / M0.kcal <= 0.06 ? M0 : { ok: S.k > 0, kcal: S.k, p: S.p, c: S.c, g: S.g };
      css.push(`.plano-${t}{display:${D.ciclo.ativa ? 'none' : 'block'}}`);
      h += `<div class="plano-${t}"><section class="alvo"><h1>${fk(M.kcal)} kcal</h1><p class="sub">${D.ciclo.ativa ? `Plano do ${TIPOS.find(x => x[0] === t)[1].toLowerCase()}. ` : ''}${pl.nota ? esc(pl.nota) : 'Meta de calorias do dia, dividida nas refeições abaixo.'}</p></section>
        ${M.ok ? `<div class="kpis"><div><span class="n">${fk(M.p)} g</span><span class="l">proteína</span><span class="s">${isFinite(peso) ? fmt(M.p / peso) + ' g por kg' : ''}</span></div><div><span class="n">${fk(M.c)} g</span><span class="l">carboidrato</span><span class="s">${isFinite(peso) ? fmt(M.c / peso) + ' g por kg' : ''}</span></div><div><span class="n">${fk(M.g)} g</span><span class="l">gordura</span><span class="s">${isFinite(peso) ? fmt(M.g / peso) + ' g por kg' : ''}</span></div></div>` : ''}
        <div class="hoje"><span class="hl">Seu dia</span><div class="hv">${fk(S.k)} kcal</div><div class="hm">P ${fk(S.p)} g · C ${fk(S.c)} g · G ${fk(S.g)} g</div></div>`;
      pl.refeicoes.forEach((r, ri) => {
        if (!r.ops.some(o => o.itens.length)) return;
        const id = `${t}-${ri}`;
        const opHTML = (o, oi) => {
          const S = somaItens(o.itens); let x = '';
          const fixos = o.itens.filter(it => !(it.subs || []).length), trocas = o.itens.filter(it => (it.subs || []).length);
          x += `<p class="ref-mac">P <b>${fmt(S.p, 0)} g</b> · C <b>${fmt(S.c, 0)} g</b> · G <b>${fmt(S.g, 0)} g</b>${r.ops.length > 1 ? ` · ${fk(S.k)} kcal` : ''}</p>`;
          if (fixos.length) x += `<div class="fixos">${fixos.map(it => `<div class="fx"><span>${esc(it.n)}</span><span class="fq">${esc(qtyTxt(it))}</span></div>`).join('')}</div>`;
          trocas.forEach((it, ti) => {
            const all = [it, ...it.subs]; const g = `s-${id}-${oi}-${ti}`;
            all.forEach((s, si) => css.push(`#${g}-${si}:checked~.opts label[for=${g}-${si}]{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:600}#${g}-${si}:checked~.d-${g}-${si}{display:block}`));

      for (const a of completar) { const x = achar(a); if (!temT(x) && temT(a)) x.treino = a.treino; if (!temD(x) && temD(a)) x.dieta = a.dieta; if (!x.avaliacoes.length) x.avaliacoes = a.avaliacoes; for (const f in a.dados) if (!x.dados[f] && a.dados[f]) x.dados[f] = a.dados[f]; x.atualizadoEm = Date.now(); await dbPut('alunos', x); }
      for (const m of R.modelos) { if (!MODELOS.some(x => norm(x.nome) === norm(m.nome))) { MODELOS.push(m); await dbPut('modelos', m); } }
      for (const r of R.receitas) { if (!BIB.some(x => x.id === r.id)) await salvarBib(indexFood(r)); }
      closeSheet(); UI.tab = 'alunos'; UI.alunoId = null; render(); toast(`${novos.length} ${novos.length === 1 ? 'aluno novo' : 'alunos novos'}${completar.length ? `, ${completar.length} completados` : ''}`);
    }; } });
}
async function restaurarProprio(pk) {
  const n = (pk.alunos || []).length;
  confirmar({ title: 'Restaurar backup?', text: `O backup de ${dataLonga(pk.exportadoEm || Date.now())} tem ${n} ${n === 1 ? 'aluno' : 'alunos'}. Alunos iguais ficam com a versão mais recente; nada é apagado.`, ok: 'Restaurar', onOk: async () => {
    for (const a of pk.alunos || []) { const ex = ALUNOS.find(x => x.id === a.id); if (!ex || (a.atualizadoEm || 0) > (ex.atualizadoEm || 0)) { garantirAluno(a); if (ex) ALUNOS[ALUNOS.indexOf(ex)] = a; else ALUNOS.push(a); await dbPut('alunos', a); } }
    for (const m of pk.modelos || []) { if (!MODELOS.some(x => x.id === m.id)) { MODELOS.push(m); await dbPut('modelos', m); } }
    for (const b of pk.biblioteca || []) { if (!BIB.some(x => x.id === b.id)) await salvarBib(b.tipo === 'ex' ? b : indexFood(b)); }
    for (const v of pk.versoes || []) await dbPut('versoes', v);
    if (pk.config) { CFG = Object.assign({}, pk.config, CFG); await saveCfg(); }
    render(); toast('Backup restaurado');
  } });
}

/* leitura direta dos apps antigos (mesmo endereço mgcoach.github.io) */
function abrirAntigo(nome) {
  return new Promise(res => {
    let req; try { req = indexedDB.open(nome); } catch (e) { return res(null); }
    req.onupgradeneeded = e => { e.target.transaction.abort(); };
    req.onsuccess = () => res(req.result); req.onerror = () => res(null); req.onblocked = () => res(null);
  });
}
function lerStore(db, st) { return new Promise(res => { if (!db || !db.objectStoreNames.contains(st)) return res([]); try { const r = db.transaction(st, 'readonly').objectStore(st).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); } catch (e) { res([]); } }); }
ACT.trazerAntigos = async () => {
  const T = await abrirAntigo('trainfuel_db'), N = await abrirAntigo('nutrifuel_db');
  const R = { alunos: [], modelos: [], receitas: [], train: 0, nutri: 0 };
  const al = await lerStore(T, 'alunos'), mo = await lerStore(T, 'modelos');
  const pc = await lerStore(N, 'pacientes'), av = await lerStore(N, 'avaliacoes'), rc = await lerStore(N, 'receitas');
  al.forEach(t => R.alunos.push(convTrainAluno(t))); mo.forEach(m => R.modelos.push({ id: uid(), nome: m.nome, treino: convTrainTreino(m.treino), criadoEm: Date.now(), atualizadoEm: Date.now() }));
  pc.forEach(p => R.alunos.push(convNutriPac(p, av.filter(v => v.pacienteId === p.id)))); rc.forEach(r => R.receitas.push(convNutriReceita(r)));
  R.train = al.length; R.nutri = pc.length;
  try { T && T.close(); N && N.close(); } catch (e) {}
  if (!R.alunos.length && !R.modelos.length && !R.receitas.length) {
    return openSheet({ title: 'Nada encontrado neste aparelho', body: `<p class="note" style="font-size:14px">Não encontrei alunos do TRAIN.FUEL nem pacientes do NUTRI.FUEL ${location.hostname.endsWith('github.io') ? 'neste celular' : 'aqui'}.</p><p class="note" style="font-size:14px">Isso acontece quando os apps antigos foram usados em outro aparelho ou navegador${location.hostname.endsWith('github.io') ? '' : ', ou quando este app não está aberto pelo endereço mgcoach.github.io'}. Nesse caso, exporte o backup completo em cada app antigo e importe o arquivo aqui.</p>`, foot: `<button class="btn btn-ink btn-full" type="button" data-act="importarArquivo">Importar arquivo de backup</button>` });
  }
  resumoImport(R, 'Dados encontrados nos apps antigos deste aparelho.');
};
ACT.importarArquivo = () => { closeSheet(); const f = $('fileIn'); f.value = ''; f.click(); };
$('fileIn').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  let pk = null; try { pk = JSON.parse(await file.text()); } catch (err) {}
  if (!pk) return toast('Esse arquivo não é um backup válido');
  const R = lerPacote(pk);
  if (R.proprio) return restaurarProprio(R.proprio);
  if (!R.alunos.length && !R.modelos.length) return toast('Não reconheci esse arquivo. Use um backup do TRAIN.FUEL, do NUTRI.FUEL ou deste app.');
  resumoImport(R, `Arquivo ${esc(file.name)}.`);
});
ACT.exportarBackup = async () => {
  const pk = { tipo: 'mgcoach_consultoria_backup', versao: VERSAO, exportadoEm: new Date().toISOString(), alunos: ALUNOS, modelos: MODELOS, biblioteca: BIB.map(b => { const c = { ...b }; delete c.w; delete c.nn; return c; }), versoes: await dbAll('versoes'), config: CFG };
  const ok = await compartilharArquivo(`mgcoach-backup-${todayISO()}.json`, JSON.stringify(pk), 'application/json', 'Backup MG COACH');
  if (ok) { CFG.ultimoBackup = Date.now(); await saveCfg(); render(); toast('Backup gerado'); }
};

/* ================= aba Backup ================= */
function renderBackup(v) {
  setBarAct('');
  const dias = CFG.ultimoBackup ? Math.floor((Date.now() - CFG.ultimoBackup) / 864e5) : null;
  v.innerHTML = `<section class="head"><h1>Backup</h1><p class="foco">Os dados ficam só neste aparelho. Exporte um backup toda semana.</p></section>
    ${dias == null || dias >= 7 ? `<div class="aviso">${dias == null ? 'Você ainda não exportou nenhum backup.' : `Último backup há ${dias} dias.`} Se o navegador limpar os dados do site, só o backup recupera os alunos.</div>` : ''}
    <div class="block"><h3>Backup deste app</h3><p>${ALUNOS.length} ${ALUNOS.length === 1 ? 'aluno' : 'alunos'}, ${MODELOS.length} ${MODELOS.length === 1 ? 'modelo' : 'modelos'}, ${BIB.length} itens seus.${CFG.ultimoBackup ? ' Último backup em ' + dataLonga(CFG.ultimoBackup) + '.' : ''}</p>
      <div class="btns" style="margin-top:12px"><button class="btn btn-ink" type="button" data-act="exportarBackup">Exportar backup</button><button class="btn btn-line" type="button" data-act="importarArquivo">Importar arquivo</button></div></div>
    <div class="block"><h3>Trazer do TRAIN.FUEL e do NUTRI.FUEL</h3><p>Os apps antigos ficam no mesmo endereço, mgcoach.github.io. Abrindo este app no mesmo celular e no mesmo navegador, ele encontra os alunos e os pacientes sozinho e une treino e dieta da mesma pessoa pelo nome.</p>
      <div class="btns" style="margin-top:12px"><button class="btn btn-ink" type="button" data-act="trazerAntigos">Procurar neste aparelho</button></div>
      <p class="note" style="margin-top:10px">Usou em outro aparelho? Exporte o backup completo em cada app antigo e use Importar arquivo.</p></div>
    <div class="block"><h3>Seu nome no protocolo</h3><label class="campo" style="margin:0">Aparece no rodapé do arquivo do aluno<input id="cfCoach" value="${esc(CFG.coach || 'Matheus Garrido')}"></label></div>
    <p class="ver">MG COACH Consultoria · versão ${VERSAO}</p>`;
  $('cfCoach').onchange = async () => { CFG.coach = $('cfCoach').value.trim() || 'Matheus Garrido'; await saveCfg(); toast('Nome salvo'); };
}

/* ================= início ================= */
async function iniciar() {
  try { const c = (await dbAll('config')).find(x => x.id === 'cfg'); CFG = c ? (delete c.id, c) : {}; } catch (e) { CFG = {}; }
  ALUNOS = (await dbAll('alunos')).map(garantirAluno);
  MODELOS = await dbAll('modelos');
  BIB = (await dbAll('biblioteca')).map(b => b.tipo === 'ex' ? b : indexFood(b));
  if (!CFG.iniciado) {
    CFG.iniciado = Date.now();
    if (!ALUNOS.length) { const ex = criarExemplo(); ALUNOS.push(ex); await dbPut('alunos', ex); UI.tab = 'alunos'; UI.alunoId = null; }
    await saveCfg();
  }
  if (UI.alunoId && !ALUNOS.some(a => a.id === UI.alunoId)) UI.alunoId = null;
  render();
}
iniciar();
