<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Consultoria">
<title>MG COACH Consultoria</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna única de até 560px, como o Organizer e o app de treino. Barra de vidro com a marca no topo, abas fixas embaixo,
   aluno aberto com sub-abas (Ficha, Treino, Dieta, Protocolo, Avaliação). Folhas que sobem de baixo para editar.
   Tema único e claro, do design system MG COACH (build mgcoach-ppl2x-v2.2.0). */
:root{
  color-scheme:light;
  --paper:#eef0f2; --card:#ffffff; --bar-glass:rgba(238,240,242,0.92);
  --rule:#dce2e7; --rule-soft:#edf0f3; --grid:#e6eaee;
  --ink:#0c1a26; --ink-hover:#17293a; --ink-2:#5a6b78; --ink-3:#8e9ca8; --spark:#9daab6;
  --on-ink:#ffffff; --on-ink-day:rgba(255,255,255,0.55); --on-ink-label:rgba(255,255,255,0.58); --on-ink-2:rgba(255,255,255,0.66);
  --accent:#ff5a00; --accent-soft:#fff0e8; --accent-line:#ffd0b4; --alert-text:#8a3200;
  --data:#1668a8; --data-track:#d8e5f1; --data-wash:rgba(22,104,168,0.09);
  --up:#157a4a; --up-soft:#e5f2ea; --down:#b8381f; --down-soft:#fbebe6; --down-line:#f1c9bf;
  --r-card:14px; --r-field:10px; --r-pill:999px;
  --shadow-focus:0 0 0 3px #fff0e8;
  --font-sans:'Archivo',system-ui,-apple-system,sans-serif;
  --tab-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-feature-settings:'tnum' 1;font-variant-numeric:tabular-nums;line-height:1.5;-webkit-font-smoothing:antialiased;font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--paper)}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--data)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* barra superior */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bar-glass);-webkit-backdrop-filter:saturate(1.6) blur(10px);backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--rule)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px}
.mark{font-size:13px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.mark b{color:var(--accent);font-weight:700}
.mark span{color:var(--ink-2);font-weight:500;margin-left:4px}
.save-st{font-size:11.5px;color:var(--ink-3);font-weight:500;white-space:nowrap}
.bar-r{display:flex;align-items:center;gap:10px;min-width:0}
.pill-btn{background:var(--ink);color:var(--on-ink);border-radius:var(--r-pill);padding:8px 15px;font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;transition:background .14s}
.pill-btn:hover{background:var(--ink-hover)}

/* abas de baixo */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar-glass);-webkit-backdrop-filter:saturate(1.6) blur(10px);backdrop-filter:saturate(1.6) blur(10px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tab{position:relative;font-size:12.5px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.tab::before{content:'';position:absolute;top:-1px;left:26%;right:26%;height:2px;border-radius:0 0 2px 2px;background:transparent}
.tab.on{color:var(--ink);font-weight:600}
.tab.on::before{background:var(--accent)}

main.wrap{padding-block:16px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom,0px))}
.head{padding:4px 0 18px}
.head h1{font-size:clamp(34px,10vw,46px);font-weight:700;letter-spacing:-.045em;line-height:.98;margin-bottom:10px;text-wrap:balance;overflow-wrap:anywhere}
.head .foco{font-size:15px;color:var(--ink-2);max-width:40ch;line-height:1.45}
.title{font-size:26px;font-weight:700;letter-spacing:-.035em;line-height:1.3;margin-bottom:4px}
.title-sub{font-size:14px;color:var(--ink-2);margin-bottom:16px}
.voltar{padding:0 0 10px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.voltar::before{content:'← '}
.voltar:hover{color:var(--ink)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:20px 0 8px}
.sec-h h3{font-size:15px;font-weight:600;letter-spacing:-.02em}
.sec-h span,.sec-h button{font-size:12.5px;color:var(--ink-2);font-weight:500}
.sec-h button{color:var(--data);text-decoration:underline;text-underline-offset:3px}

/* sub-abas do aluno */
.subnav{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:30;background:var(--bar-glass);-webkit-backdrop-filter:saturate(1.6) blur(10px);backdrop-filter:saturate(1.6) blur(10px);margin:0 -16px 14px;padding:0 16px;border-bottom:1px solid var(--rule);display:flex;gap:18px;overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.linkbtn{color:var(--ink-2);font-size:13.5px;font-weight:500;padding:11px 1px 9px;border-bottom:1.5px solid transparent;white-space:nowrap;transition:color .12s}
.linkbtn:hover{color:var(--ink)}
.linkbtn.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* cards e blocos */
.block{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);padding:16px 17px;margin-bottom:10px}
.block h3{font-size:15px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.block p{font-size:14px;color:var(--ink-2);line-height:1.55}
.block p+p{margin-top:8px}
.aviso{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r-card);padding:12px 14px;margin:0 0 12px;font-size:13.5px;color:var(--alert-text);line-height:1.5}
.aviso .btns{margin-top:10px}
.aviso .btn-line{border-color:var(--accent-line);color:var(--alert-text);flex:0 0 auto}
.hoje{background:var(--ink);color:var(--on-ink);border-radius:var(--r-card);padding:14px 16px 15px;margin-bottom:8px}
.hoje .hl{font-size:12.5px;color:var(--on-ink-label);font-weight:500;display:flex;justify-content:space-between;gap:10px}
.hoje .hv{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:1px}
.hoje .hm{font-size:13px;color:var(--on-ink-2);margin-top:5px}
.hoje .hm b{color:var(--on-ink);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);padding:12px 12px 11px;min-width:0}
.kpi.flat{background:var(--paper);border-color:transparent}
.kv{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv small{font-size:.62em;font-weight:600;color:var(--ink-2);margin-left:3px;letter-spacing:0}
.kl{display:block;font-size:12px;color:var(--ink-2);font-weight:500;margin-top:3px;line-height:1.3}
.ks{display:block;font-size:11.5px;color:var(--ink-2);opacity:.85;margin-top:1px}
.up{color:var(--up)} .down{color:var(--down)}
.empty{background:var(--card);border:1px dashed var(--rule);border-radius:var(--r-card);padding:20px 17px;text-align:center;color:var(--ink-2);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btns{justify-content:center;margin-top:12px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-field);padding:11px 15px;font-size:14.5px;font-weight:600;letter-spacing:-.01em;border:1px solid transparent;transition:background .14s,border-color .12s,color .12s}
.btn-ink{background:var(--ink);color:var(--on-ink)}
.btn-ink:hover{background:var(--ink-hover)}
.btn-ink.ok{background:var(--accent);color:var(--ink)}
.btn-line{background:var(--card);border-color:var(--rule);color:var(--ink-2);font-weight:500;font-size:13.5px}
.btn-line:hover{border-color:var(--ink-3);color:var(--ink)}
.btn-danger{background:var(--card);border-color:var(--down-line);color:var(--down);font-weight:500;font-size:13.5px}
.btn-danger:hover{background:var(--down-soft)}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:var(--r-pill)}
.btn-full{width:100%}
.btn:disabled{opacity:.35;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}
.link{color:var(--data);font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.link.del{color:var(--down)}

/* chips */
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.opts.scroll::-webkit-scrollbar{display:none}
.opt{flex:none;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-pill);padding:7px 13px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background .12s,color .12s,border-color .12s}
.opt.card{background:var(--card)}
.opt:hover{border-color:var(--ink-3)}
.opt.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:600}
.opt.add{border-style:dashed;background:transparent}
.opt.sm{padding:5px 11px;font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--ink-2);background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-pill);padding:0 7px;white-space:nowrap;vertical-align:1px;letter-spacing:0}
.tag.acc{color:var(--alert-text);background:var(--accent-soft);border-color:var(--accent-line)}
.tag.dat{color:var(--data);background:var(--card);border-color:var(--data-track)}
.tag.up{color:var(--up);background:var(--up-soft);border-color:transparent}

/* formulários */
.form{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.form .full{grid-column:1/-1}
.campo{display:block;font-size:12.5px;color:var(--ink-2);font-weight:500;margin-bottom:10px;min-width:0}
.campo input,.campo select,.campo textarea{display:block;width:100%;margin-top:4px;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-field);padding:9px 11px;-webkit-appearance:none;appearance:none}
.campo select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.campo textarea{min-height:84px;resize:vertical;line-height:1.5;font-size:15px}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--accent);background-color:var(--card)}
.campo .hint{display:block;font-size:11.5px;color:var(--ink-2);margin-top:3px;font-weight:400}
.campo.inline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.campo.inline input{width:96px;margin-top:0;text-align:right}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);padding:9px 0;border-bottom:1px solid var(--rule-soft);cursor:pointer}
.chk:last-child{border-bottom:none}
.chk input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.chk span{flex:1;min-width:0}
.chk small{display:block;color:var(--ink-2);font-size:12.5px}
.busca{width:100%;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:var(--r-field);padding:11px 12px;-webkit-appearance:none;appearance:none}
.busca.paper{background:var(--paper)}
.busca:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:var(--shadow-focus)}
.busca::-webkit-search-cancel-button{-webkit-appearance:none}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;background:var(--rule);border-radius:99px;transition:background .14s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(12,26,38,.25);transition:transform .14s}
.switch input:checked+i{background:var(--ink)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.row-sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row-sw h3{margin:0}

/* lista de alunos */
.lst{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 15px;border-bottom:1px solid var(--rule-soft);transition:background .12s}
.li:last-child{border-bottom:none}
.li:hover{background:var(--paper)}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--paper);border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:-.02em}
.li-m{flex:1;min-width:0}
.li-t{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.3;overflow-wrap:anywhere}
.li-s{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.li-r{flex:none;text-align:right;font-size:12.5px;color:var(--ink-2)}
.li-r b{display:block;font-size:15px;color:var(--ink);font-weight:700;letter-spacing:-.02em}
.thumb{flex:none;width:48px;height:48px;border-radius:9px;background:var(--paper);border:1px solid var(--rule-soft);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:11px;font-weight:700}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}

/* semana e sessão */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:2px 0 16px}
.day{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-field);padding:8px 2px 9px;text-align:center;color:var(--ink-2);transition:border-color .12s,background .12s;min-width:0}
.day .d{font-size:10.5px;font-weight:500;color:var(--ink-3);display:block}
.day .s{font-size:13px;font-weight:700;letter-spacing:-.02em;color:var(--ink);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.day.on{background:var(--ink);border-color:var(--ink)}
.day.on .d{color:var(--on-ink-day)}
.day.on .s{color:var(--on-ink)}
.day.rest{background:transparent;border-style:dashed}
.day.rest .s{color:var(--ink-3);font-weight:500}
.day.rest.on{background:var(--ink);border-style:solid}
.day.rest.on .s{color:var(--on-ink)}
.stats{display:flex;gap:22px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.stat .n{font-size:19px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--ink-2);font-weight:500}
.sess-head{display:grid;grid-template-columns:96px 1fr;gap:0 10px}

/* exercício */
.ex{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);margin-bottom:9px;overflow:hidden}
.ex-top{display:flex;gap:11px;padding:14px 15px 0;align-items:flex-start}
.ex-n{font-size:12px;font-weight:600;color:var(--ink-3);flex:0 0 auto;width:16px;padding-top:3px}
.ex-main{flex:1;min-width:0}
.ex-name{font-size:17px;font-weight:600;letter-spacing:-.025em;line-height:1.2;overflow-wrap:anywhere}
.ex-meta{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.ex-nota{font-size:13px;color:var(--ink-2);line-height:1.48;padding:8px 15px 0 42px}
.ex-presc{padding:10px 15px 0 42px}
.ex-acts{display:flex;align-items:center;gap:6px;padding:10px 15px 12px 42px;flex-wrap:wrap}
.icon-btn{width:32px;height:32px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink-2);font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:var(--ink-3);color:var(--ink)}
.icon-btn:disabled{opacity:.35}
.ex-acts .grow{flex:1}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th,.dt td{text-align:left;padding:7px 6px 7px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.dt thead th{font-size:11.5px;font-weight:500;color:var(--ink-2);padding-top:0}
.dt tbody th{font-weight:600}
.dt tr.aq th,.dt tr.aq td{color:var(--ink-2)}
.dt tr:last-child th,.dt tr:last-child td{border-bottom:none}
.dt td:last-child,.dt th:last-child{padding-right:0;text-align:right}

/* barras de volume */
.mb{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.mb span{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb .tr{height:8px;background:var(--data-track);border-radius:4px;overflow:hidden;position:relative}
.mb .tr i{position:absolute;inset:0 auto 0 0;background:var(--data);border-radius:0 4px 4px 0}
.mb b{text-align:right;font-weight:600}

/* refeições */
.ref{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);margin-bottom:10px;overflow:hidden}
.ref-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:15px 16px 0}
.ref-nome{font-size:17px;font-weight:600;letter-spacing:-.025em;overflow-wrap:anywhere}
.ref-quando{font-size:12.5px;color:var(--ink-2);margin-top:2px;font-weight:500}
.ref-k{font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.ref-k span{font-size:12px;color:var(--ink-2);font-weight:500;margin-left:2px}
.ref-nota{font-size:13px;color:var(--ink-2);line-height:1.48;padding:7px 16px 0}
.ref-mac{font-size:12.5px;color:var(--ink-2);padding:6px 16px 0}
.ref-mac b{color:var(--ink);font-weight:600}
.ref-ops{padding:10px 16px 0}
.fixos{padding:8px 16px 4px}
.fx{display:grid;grid-template-columns:1fr auto;gap:1px 12px;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--rule-soft);font-size:14px}
.fx:last-child{border-bottom:none}
.fx .a{min-width:0;overflow-wrap:anywhere;line-height:1.35}
.fx .b{text-align:right;white-space:nowrap;color:var(--ink-2)}
.fx .c{font-size:12px;color:var(--ink-2)}
.fx .d{font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap}
.fx .subs{grid-column:1/-1;font-size:12.5px;color:var(--data);font-weight:500}
.ref-acts{display:flex;gap:8px;padding:6px 16px 14px;flex-wrap:wrap}
.vazio{font-size:13px;color:var(--ink-2);padding:8px 16px 4px}

/* resultados de busca */
.res-l{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);overflow:hidden;margin-top:10px}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-bottom:1px solid var(--rule-soft);padding:10px 14px;transition:background .12s}
.res:last-child{border-bottom:none}
.res:hover{background:var(--paper)}

linado com Halteres","en":"Decline Dumbbell Press","pm":["chest"],"sm":["shoulders","triceps"],"eq":"dumbbell","lv":"intermediate","ins":["Banco em declínio (~15-30°), prenda os pés.","Halteres na altura da parte baixa do peito.","Empurre verticalmente até estender os braços."],"gif":null,"img":"Decline_Dumbbell_Bench_Press"},{"id":"Pushups","n":"Flexão de Braço","en":"Push-ups","pm":["chest"],"sm":["shoulders","triceps"],"eq":"body only","lv":"beginner","ins":["Apoie as mãos no chão um pouco mais abertas que os ombros.","Mantenha o corpo reto da cabeça aos calcanhares.","Desça até o peito quase tocar o chão.","Empurre de volta sem travar os cotovelos."],"gif":null,"img":"Pushups"},{"id":"Dumbbell_Flyes","n":"Crucifixo Reto com Halteres","en":"Dumbbell Flyes","pm":["chest"],"sm":["shoulders"],"eq":"dumbbell","lv":"intermediate","ins":["Deite no banco com halteres acima do peito, palmas frente a frente.","Abra os braços lateralmente com leve flexão dos cotovelos.","Sinta o alongamento e retorne pelo mesmo caminho.","Imagine abraçar uma árvore grande."],"gif":null,"img":"Dumbbell_Flyes"},{"id":"Cable_Crossover","n":"Crossover na Polia","en":"Cable Crossover","pm":["chest"],"sm":["shoulders"],"eq":"cable","lv":"intermediate","ins":["Polias na altura mais alta. Pegue uma alça em cada mão.","Dê um passo à frente, ligeiro avanço do tronco.","Cruze as mãos à frente do corpo na linha do umbigo.","Retorne controladamente sentindo o alongamento."],"gif":null,"img":"Cable_Crossover"},{"id":"Bench_Dips","n":"Mergulho no Banco","en":"Bench Dips","pm":["triceps"],"sm":["chest","shoulders"],"eq":"body only","lv":"beginner","ins":["Mãos apoiadas no banco, pés no chão.","Desça flexionando os cotovelos a 90°.","Empurre de volta para cima."],"gif":null,"img":"Bench_Dips"},{"id":"Dips_-_Chest_Version","n":"Paralelas para Peito","en":"Chest Dips","pm":["chest"],"sm":["triceps","shoulders"],"eq":"body only","lv":"intermediate","ins":["Suspenso nas paralelas, incline o tronco à frente.","Desça flexionando os cotovelos, levando o peito para baixo.","Empurre de volta sentindo o peito."],"gif":null,"img":"Dips_-_Chest_Version"},{"id":"Pullups","n":"Barra Fixa (Pull-up)","en":"Pull-ups","pm":["lats"],"sm":["biceps","middle back"],"eq":"body only","lv":"intermediate","ins":["Pegue a barra com pegada pronada, mãos um pouco mais abertas que os ombros.","Puxe o corpo até o queixo passar a barra.","Desça controladamente sem balançar.","Foco em puxar com as costas, não com os braços."],"gif":null,"img":"Pullups"},{"id":"Chin-Ups","n":"Chin-up (Pegada Supinada)","en":"Chin-ups","pm":["biceps"],"sm":["lats","middle back"],"eq":"body only","lv":"intermediate","ins":["Pegada supinada (palmas voltadas para você), na largura dos ombros.","Puxe até o queixo passar a barra.","Desça controladamente."],"gif":"exercicio-012.gif","img":null},{"id":"Wide-Grip_Lat_Pulldown","n":"Puxada Aberta (Pulldown)","en":"Wide-Grip Lat Pulldown","pm":["lats"],"sm":["biceps","middle back"],"eq":"cable","lv":"beginner","ins":["Sente-se na máquina, pegada pronada bem aberta.","Puxe a barra até a parte alta do peito.","Mantenha o tronco ligeiramente inclinado para trás.","Foco em puxar com os dorsais."],"gif":null,"img":"Wide-Grip_Lat_Pulldown"},{"id":"Close-Grip_Front_Lat_Pulldown","n":"Puxada Fechada","en":"Close-Grip Lat Pulldown","pm":["lats"],"sm":["biceps","middle back"],"eq":"cable","lv":"beginner","ins":["Use o triângulo de pegada neutra ou pegada supinada.","Puxe até a barra/cabo tocar o peito superior.","Mantenha o tronco firme."],"gif":null,"img":"Close-Grip_Front_Lat_Pulldown"},{"id":"Bent_Over_Barbell_Row","n":"Remada Curvada com Barra","en":"Bent Over Barbell Row","pm":["middle back"],"sm":["biceps","lats"],"eq":"barbell","lv":"intermediate","ins":["Tronco inclinado a ~45°, joelhos levemente flexionados.","Barra na frente, pegada pronada na largura dos ombros.","Puxe a barra em direção ao abdômen.","Mantenha as costas neutras durante todo o movimento."],"gif":null,"img":"Bent_Over_Barbell_Row"},{"id":"Bent_Over_Two-Dumbbell_Row","n":"Remada Curvada com Halteres","en":"Two-Dumbbell Row","pm":["middle back"],"sm":["biceps","lats"],"eq":"dumbbell","lv":"beginner","ins":["Tronco inclinado, halteres pendurados.","Puxe os halteres até a altura do tronco.","Aproxime as escápulas no topo do movimento."],"gif":null,"img":"Bent_Over_Two-Dumbbell_Row"},{"id":"One-Arm_Dumbbell_Row","n":"Remada Unilateral (Serrote)","en":"One-Arm Dumbbell Row","pm":["middle back"],"sm":["biceps","lats"],"eq":"dumbbell","lv":"beginner","ins":["Apoie um joelho e a mão no banco. A outra perna firme no chão.","Halter na mão livre, braço estendido.","Puxe o halter até a altura da costela.","Desça controladamente sem girar o tronco."],"gif":null,"img":"One-Arm_Dumbbell_Row"},{"id":"Seated_Cable_Rows","n":"Remada Sentada na Polia","en":"Seated Cable Row","pm":["middle back"],"sm":["biceps","lats"],"eq":"cable","lv":"beginner","ins":["Sente-se com pés apoiados, joelhos levemente flexionados.","Tronco ereto, pegue o triângulo.","Puxe em direção ao abdômen aproximando as escápulas.","Retorne controladamente sem arredondar as costas."],"gif":null,"img":"Seated_Cable_Rows"},{"id":"T-Bar_Row_with_Handle","n":"Remada T-Bar","en":"T-Bar Row","pm":["middle back"],"sm":["biceps","lats"],"eq":"other","lv":"intermediate","ins":["Posicione-se sobre a barra, tronco a ~45°.","Pegada neutra ou pronada.","Puxe em direção ao tronco mantendo cotovelos próximos.","Desça com controle."],"gif":null,"img":"T-Bar_Row_with_Handle"},{"id":"Barbell_Deadlift","n":"Levantamento Terra","en":"Deadlift","pm":["hamstrings"],"sm":["lower back","glutes","quadriceps","traps"],"eq":"barbell","lv":"intermediate","ins":["Pés na largura do quadril, barra próxima às canelas.","Pegada pronada ou alternada na largura dos ombros.","Inicie o movimento empurrando o chão com as pernas.","Mantenha as costas neutras durante toda a subida.","Quadril e joelhos estendem juntos."],"gif":null,"img":"Barbell_Deadlift"},{"id": "middle back"],"eq":"dumbbell","lv":"intermediate","ins":["Sente na ponta do banco, tronco bem inclinado à frente.","Halteres ao lado dos pés, palmas voltadas para o corpo.","Eleve os halteres lateralmente até altura dos ombros.","Aperte deltoides posteriores e volte controlado."],"gif":null,"img":"Seated_Bent-Over_Rear_Delt_Raise"},{"id":"Cable_Reverse_Flyes","n":"Crucifixo Inverso na Polia","en":"Cable Reverse Fly","pm":["shoulders"],"sm":["middle back"],"eq":"cable","lv":"intermediate","ins":["Polias altas cruzadas, segure cada lado com a mão oposta.","Braços estendidos à frente.","Abra os braços lateralmente apertando deltoides posteriores.","Volte controlado mantendo tensão."],"gif":null,"img":"Reverse_Flyes"},{"id":"Lateral_Raise_-_With_Bands","n":"Elevação Lateral com Faixa","en":"Banded Lateral Raise","pm":["shoulders"],"sm":[],"eq":"bands","lv":"beginner","ins":["Pise na faixa, segure as pontas com cada mão.","Eleve os braços lateralmente até a altura dos ombros.","Cotovelos levemente flexionados.","Desça controlado mantendo tensão."],"gif":null,"img":"Lateral_Raise_-_With_Bands"},{"id":"Drag_Curl","n":"Rosca Drag Curl","en":"Drag Curl","pm":["biceps"],"sm":["forearms"],"eq":"barbell","lv":"intermediate","ins":["Em pé com barra, cotovelos puxando para trás durante a subida.","A barra 'arrasta' próxima ao corpo (não vai à frente).","Foco maior na cabeça longa do bíceps.","Desça controlado."],"gif":null,"img":"Drag_Curl"},{"id":"Concentration_Curl","n":"Rosca Concentrada na Polia","en":"Cable Concentration Curl","pm":["biceps"],"sm":[],"eq":"cable","lv":"intermediate","ins":["Sente em banco baixo ao lado da polia, cotovelo apoiado na coxa.","Pegada supinada na pegada simples da polia.","Flexione cotovelo trazendo ao ombro.","Aperte o bíceps no topo."],"gif":null,"img":"Concentration_Curls"},{"id":"Close-Grip_EZ_Bar_Curl","n":"Supino Fechado para Tríceps","en":"Close-Grip Bench Press","pm":["triceps"],"sm":["chest","shoulders"],"eq":"barbell","lv":"intermediate","ins":["Deite no banco com pegada fechada na barra (largura dos ombros).","Desça a barra ao peito médio mantendo cotovelos rente ao tronco.","Empurre verticalmente focando no tríceps.","Não abra os cotovelos durante o movimento."],"gif":null,"img":"Close-Grip_EZ_Bar_Curl"},{"id":"Two-Arm_Dumbbell_Tricep_Extension","n":"Tríceps Francês com Halter (em pé)","en":"Standing Overhead Triceps Extension","pm":["triceps"],"sm":[],"eq":"dumbbell","lv":"beginner","ins":["Em pé segurando um halter com as duas mãos, atrás da cabeça.","Cotovelos apontando para o teto, fixos.","Estenda os cotovelos elevando o halter.","Desça controlado mantendo cotovelos fixos."],"gif":null,"img":"Standing_Dumbbell_Triceps_Extension"},{"id":"Triceps_Pushdown_-_V-Bar_Attachment","n":"Tríceps na Polia com Pegada V","en":"V-Bar Triceps Pushdown","pm":["triceps"],"sm":[],"eq":"cable","lv":"beginner","ins":["Polia alta com barra V (triângulo).","Cotovelos rente ao corpo, pegada neutra.","Empurre a barra para baixo até estender.","Volte controlado."],"gif":null,"img":"Triceps_Pushdown_-_V-Bar_Attachment"},{"id":"Reverse_Grip_Triceps_Pushdown","n":"Tríceps Pulley Pegada Supinada","en":"Reverse-Grip Pushdown","pm":["triceps"],"sm":[],"eq":"cable","lv":"intermediate","ins":["Polia alta com barra reta, pegada supinada (palmas para cima).","Cotovelos rente ao corpo.","Empurre a barra para baixo até estender.","Foco maior na cabeça lateral do tríceps."],"gif":null,"img":"Reverse_Grip_Triceps_Pushdown"},{"id":"Roman_Chair_Situp","n":"Abdominal Romano (Cadeira)","en":"Roman Chair Sit-Up","pm":["abdominals"],"sm":["lower back"],"eq":"machine","lv":"intermediate","ins":["Sente na cadeira romana com pés presos.","Tronco inicialmente reto, mãos cruzadas no peito.","Desça o tronco para trás controlado e suba.","CUIDADO com lombar — não force amplitude."],"gif":null,"img":"Sit-Up"},{"id":"Cable_Russian_Twists","n":"Russian Twist na Polia","en":"Cable Russian Twist","pm":["abdominals"],"sm":[],"eq":"cable","lv":"intermediate","ins":["Polia na altura do peito, fique de lado para a máquina.","Segure a pegada com as duas mãos, braços estendidos.","Gire o tronco para o lado oposto à máquina.","Foco em obliquos, controle total."],"gif":null,"img":"Cable_Russian_Twists"},{"id":"Hyperextensions_-_With_No_Hyperextension_","n":"Extensão Lombar (Cadeira Romana)","en":"Hyperextension / Back Extension","pm":["lower back"],"sm":["glutes","hamstrings"],"eq":"machine","lv":"beginner","ins":["Posicione-se na cadeira romana 45° (ou banco hiper).","Quadril apoiado no pad, pés presos.","Desça o tronco controlado mantendo coluna neutra.","Suba até linha do corpo (não hiperestenda)."],"gif":"exercicio-011.gif","img":null},{"id":"Reverse_Crunch","n":"Abdominal Reverso","en":"Reverse Crunch","pm":["abdominals"],"sm":[],"eq":"body only","lv":"intermediate","ins":["Deite com mãos ao lado do corpo, joelhos a 90°.","Eleve quadril trazendo joelhos em direção ao peito.","Aperte abdômen inferior no topo.","Desça controlado."],"gif":null,"img":"Reverse_Crunch"},{"id":"Side_Plank","n":"Prancha Lateral","en":"Side Plank","pm":["abdominals"],"sm":["shoulders","glutes"],"eq":"body only","lv":"intermediate","ins":["Apoie um antebraço e a lateral do pé no chão.","Corpo formando linha reta diagonal, quadril alinhado.","Aperte oblíquos durante todo o tempo.","Mantenha 30-60s e troque o lado."],"gif":null,"img":"Push_Up_to_Side_Plank"},{"id":"Dead_Bug","n":"Dead Bug (Inseto Morto)","en":"Dead Bug","pm":["abdominals"],"sm":[],"eq":"body only","lv":"beginner","ins":["Deite de costas com braços estendidos para o teto, joelhos a 90°.","Estenda braço direito atrás da cabeça e perna esquerda à frente.","Volte e alterne (braço esquerdo + perna direita).","Lombar SEMPRE colada no chão."],"gif":null,"img":"Dead_Bug"},{"id":"Bird_Dog","n":"Bird Dog (Cão de Caça)","en":"Bird Dog","pm":["lower back"],"sm":["abdominals","glutes"],"eq":"body only","lv":"beginner","ins":["4 apoios (joelhos e mãos no chão).","Estenda braço direito à frente e perna esquerda atrás simultaneamente.","Mantenha corpo alinhado, 2-3s.","Volte e alterne (braço esquerdo + perna direita)."],"gif":"exercicio-027.gif","img":null},{"id":"Iso-Lateral_Row","n":"Remada Hammer Iso-Lateral","en":"Iso-Lateral Row Machine","pm":["middle back"],"sm":["lats","biceps"],"eq":"machine","lv":"intermediate","ins":["Sente na máquina com peito apoiado no pad.","Pegada independente em cada braço.","Puxe alternadamente ou simultâneo.","Foco em corrigir assimetrias entre os lados."],"gif":null,"img":"Leverage_Iso_Row"},{"id":"Cable_Row_Standing_Two_Arm","n":"Remada Baixa em Pé na Polia","en":"Standing Cable Row","pm":["middle back"],"sm":["lats","biceps"],"eq":"cable","lv":"intermediate","ins":["Em pé na polia baixa com triângulo, costas eretas.","Tronco levemente inclinado à frente.","Puxe o triângulo até o abdômen.","Aperte escápulas no fim do movimento."],"gif":null,"img":null},{"id":"Single-Arm_Cable_Row","n":"Remada Unilateral na Polia","en":"Single-Arm Cable Row","pm":["middle back"],"sm":["lats","biceps"],"eq":"cable","lv":"intermediate","ins":["Polia baixa com pegada única, sente.","Puxe um braço de cada vez até a costela.","Permite maior amplitude que com duas mãos.","Foco em isolar cada lado."],"gif":null,"img":"Seated_One-arm_Cable_Pulley_Rows"},{"id":"Wrist_Roller_Reverse","n":"Rosca de Punho Inversa","en":"Reverse Wrist Curl","pm":["forearms"],"sm":[],"eq":"dumbbell","lv":"beginner","ins":["Sente com antebraços apoiados nas coxas, palmas para BAIXO.","Halteres na mão, deixe punho cair para baixo.","Eleve o punho contraindo extensores.","Repita controladamente."],"gif":null,"img":"Wrist_Roller"},{"id":"Farmers_Walk","n":"Caminhada do Fazendeiro (Farmer's Walk)","en":"Farmer's Walk","pm":["forearms"],"sm":["traps","abdominals"],"eq":"dumbbell","lv":"intermediate","ins":["Halteres pesados ao lado do corpo, postura ereta.","Caminhe em linha reta passos curtos e firmes.","Trapézio ativo, abdômen contraído.","Excelente para grip strength e core."],"gif":null,"img":"Farmers_Walk"},{"id":"Kettlebell_Swing","n":"Swing com Kettlebell","en":"Kettlebell Swing","pm":["glutes"],"sm":["hamstrings","shoulders","abdominals"],"eq":"kettlebells","lv":"intermediate","ins":["Kettlebell entre as pernas, pés na largura dos ombros.","Empurre quadril para trás e balance kb entre as pernas.","Empurre quadril à frente lançando kb à altura do peito.","O movimento vem do QUADRIL, não dos braços."],"gif":null,"img":"One-Arm_Kettlebell_Swings"},{"id":"Battle_Ropes","n":"Battle Rope (Cordas)","en":"Battle Ropes","pm":["shoulders"],"sm":["abdominals","forearms"],"eq":"other","lv":"intermediate","ins":["Em pé com uma ponta da corda em cada mão.","Pés na largura dos ombros, joelhos semi-flexionados.","Faça ondas alternadas ou simultâneas com os braços.","Mantenha intensidade alta por 20-30s."],"gif":null,"img":"Battling_Ropes"},{"id":"Plyo_Box_Jump","n":"Skipping (Joelhos Altos)","en":"High Knees","pm":["quadriceps"],"sm":["calves","abdominals"],"eq":"body only","lv":"beginner","ins":["Em pé, corra no lugar elevando joelhos até altura do quadril.","Braços alternam como na corrida.","Mantenha ritmo intenso por 20-30s.","Excelente aquecimento ou intervalo HIIT."],"gif":null,"img":null},{"id":"World_Greatest_Stretch","n":"Maior Alongamento do Mundo","en":"World's Greatest Stretch","pm":["hamstrings"],"sm":["glutes","shoulders"],"eq":"body only","lv":"beginner","ins":["Avanço (lunge) com perna direita à frente.","Mão esquerda no chão ao lado do pé direito.","Mão direita estendida para o teto, gire o tronco.","Volte e troque o lado — alongamento global."],"gif":null,"img":"Worlds_Greatest_Stretch"},{"id":"Childs_Pose","n":"Postura da Criança","en":"Child's Pose","pm":["lower back"],"sm":["lats"],"eq":"body only","lv":"beginner","ins":["Ajoelhe no chão, sente nos calcanhares.","Estenda os braços à frente, testa no chão.","Relaxe a coluna sentindo o alongamento.","Mantenha 30-60s respirando profundamente."],"gif":null,"img":"Childs_Pose"},{"id":"Reverse_Hack_Squat","n":"Agachamento Hack Reverso","en":"Reverse Hack Squat","pm":["quadriceps","glutes"],"sm":["hamstrings"],"eq":"machine","lv":"intermediate","ins":["Posicione-se na máquina de hack squat com o peito apoiado no encosto (de frente pra máquina, ao contrário do hack tradicional).","Apoie os ombros sob as almofadas, pés na plataforma com afastamento confortável.","Solte as travas de segurança e desça flexionando joelhos e quadris.","Desça até coxas paralelas (ou um pouco abaixo se mobilidade permitir).","Empurre a plataforma com força pelos calcanhares para subir, mantendo controle.","Estende joelhos e quadris sem hiperextensão na subida."],"gif":"exercicio-009.gif","img":null},{"id":"Machine_Shoulder_Press_Neutral_Grip","n":"Desenvolvimento na Máquina (Pegada Neutra)","en":"Machine Shoulder Press (Neutral Grip)","pm":["shoulders"],"sm":["triceps","chest"],"eq":"machine","lv":"beginner","ins":["Sente na máquina de desenvolvimento com pegada neutra (palmas voltadas uma para a outra).","Ajuste o banco para que as pegadas fiquem na altura dos ombros.","Mantenha as costas firmes no encosto e core contraído.","Empurre as pegadas para cima até quase estender os cotovelos.","Não trave os cotovelos no topo.","Desça controladamente até as pegadas alinharem com os ombros."],"gif":"exercicio-015.gif","img":null},{"id":"Hammer_Strength_Bench_Press","n":"Supino Hammer","en":"Hammer Strength Bench Press","pm":["chest"],"sm":["triceps","shoulders"],"eq":"machine","lv":"beginner","ins":["Sente na máquina Hammer Strength com peito apoiado no banco.","Ajuste o banco para que as pegadas fiquem na altura média do peito.","Pegue as alças com pegada pronada e core contraído.","Empurre as alças à frente até quase estender os cotovelos.","Não trave os cotovelos no topo.","Retorne controladamente até a posição inicial."],"gif":"exercicio-023.gif","img":null},{"id":"Standing_Dumbbell_Triceps_Extension","n":"Tríceps Francês com Halter em Pé","en":"Standing Overhead Dumbbell Triceps Extension","pm":["triceps"],"sm":[],"eq":"dumbbell","lv":"beginner","ins":["Em pé, segure um halter com as duas mãos sobre a cabeça.","Pés afastados na largura dos ombros, core contraído.","Mantenha os cotovelos próximos da cabeça e apontados para cima.","Flexione os cotovelos para baixar o halter atrás da cabeça.","Estenda os cotovelos para retornar à posição inicial sem travá-los.","Mantenha os ombros estáveis e cotovelos fixos durante todo o movimento."],"gif":"exercicio-026.gif","img":null},{"id":"Bayesian_Curl","n":"Rosca Bayesian (Polia)","en":"Bayesian Curl","pm":["biceps"],"sm":["forearms"],"eq":"cable","lv":"intermediate","ins":["Polia baixa atrás do corpo, pegada supinada, dê um passo à frente.","Cotovelo levemente para trás, atrás da linha do quadril.","Flexione o cotovelo trazendo o pulso ao ombro.","O posicionamento da polia por trás maximiza o alongamento do bíceps.","Desça controlado sem deixar o cotovelo cair para frente.","Faça todas as reps e troque o braço."],"gif":"exercicio-034.gif","img":null},{"id":"Bicep_Curl_Machine","n":"Rosca Bíceps na Máquina","en":"Machine Bicep Curl","pm":["biceps"],"sm":["forearms"],"eq":"machine","lv":"beginner","ins":["Sente na máquina com os braços apoiados no pad, cotovelos alinhados com o eixo.","Ajuste o assento para que os cotovelos fiquem na borda do pad.","Pegada supinada nas pegadas da máquina.","Flexione os cotovelos trazendo as pegadas até os ombros.","Aperte o bíceps no topo e desça controlado.","Não force a amplitude além do que a máquina permite."],"gif":"exercicio-035.gif","img":null},{"id":"Puxada_Articulada_Supinada","n":"Puxada Articulada Supinada","en":"Articulated Supinated Pulldown","pm":["lats","biceps"],"sm":["rhomboids","rear_deltoids","teres_major"],"eq":"cable","lv":"intermediate","ins":["Sente-se na máquina de puxada com os joelhos bem presos sob o suporte.","Pegue a barra ou puxador com pegada supinada (palmas voltadas para você), na largura dos ombros.","Parta com os braços totalmente estendidos acima da cabeça.","Puxe o puxador em direção ao peito, trazendo os cotovelos para baixo e para trás.","No final do movimento, aperte as escápulas e contraia o latíssimo.","Suba o puxador de forma controlada, voltando à posição inicial sem soltar a tensão."],"gif":"exercicio-036.gif","img":null},{"id":"Good_Morning","n":"Bom Dia (Good Morning)","en":"Good Morning","pm":["hamstrings"],"sm":["glutes","lower back"],"eq":"barbell","lv":"intermediate","ins":["Posicione a barra sobre o trapézio (como num agachamento), pés na largura dos ombros.","Mantenha a coluna neutra e o core firmemente contraído durante todo o movimento.","Com leve flexão de joelhos, faça uma dobradiça de quadril empurrando o glúteo para trás.","Desça o tronco até sentir alongamento dos posteriores (paralelo ao solo é o limite seguro).","Suba estendendo o quadril, contraindo glúteo e posterior.","Não arredonde a coluna em nenhuma fase. Comece com carga LEVE — exercício técnico."],"gif":"exercicio-038.gif","img":null},{"id":"Stiff_Pernas_Retas_Dumbbell","n":"Stiff com Halteres (pernas retas)","en":"Stiff-Legged Deadlift with Dumbbells","pm":["hamstrings"],"sm":["glutes","lower back"],"eq":"dumbbell","lv":"intermediate","ins":["Em pé, um halter em cada mão na frente das coxas, pegada pronada.","Pés afastados na largura do quadril, joelhos TRAVADOS (pernas retas — diferente do RDL).","Faça dobradiça de quadril empurrando o glúteo para trás, mantendo as pernas retas.","Desça os halteres rente às pernas até sentir alongamento intenso dos posteriores.","Suba estendendo o quadril, contraindo glúteo e posterior no topo.","Coluna neutra durante todo o movimento. Exige mobilidade — comece com carga baixa."],"gif":"exercicio-039.gif","img":null},{"id":"Articulated_Row_Neutral_Grip","n":"Remada Articulada Pegada Neutra","en":"Articulated Row (Neutral Grip)","pm":["middle back"],"sm":["lats","biceps","rear_deltoids"],"eq":"machine","lv":"beginner","ins":["Sente na máquina de remada articulada com o peito apoiado no encosto.","Pegue as pegadas neutras (palmas voltadas uma para a outra).","Ajuste o assento para que as pegadas fiquem na altura do meio do peito.","Puxe as pegadas em direção ao tronco, trazendo os cotovelos para trás e juntando as escápulas.","Aperte o meio das costas no final do movimento.","Retorne controladamente até quase estender os braços, mantendo tensão."],"gif":"exercicio-040.gif","img":null},{"id":"Articulated_Row_Pronated_Grip","n":"Remada Articulada Pegada Pronada","en":"Articulated Row (Pronated Grip)","pm":["middle back"],"sm":["rear_deltoids","biceps","lats"],"eq":"machine","lv":"beginner","ins":["Sente na máquina de remada articulada com o peito apoiado no encosto.","Pegue as pegadas com pegada pronada (palmas para baixo) — recruta mais deltoide posterior.","Ajuste o assento para que as pegadas fiquem na altura do meio do peito.","Puxe as pegadas em direção ao tronco, cotovelos abrindo para fora (alto).","Aperte escápulas e posterior do ombro no final.","Retorne controladamente, sem deixar os ombros caírem à frente."],"gif":"exercicio-041.gif","img":null},{"id":"Standing_Cable_Glute_Kickback","n":"Extensão de Glúteo na Polia em Pé","en":"Standing Cable Glute Kickback","pm":["glutes"],"sm":["hamstrings"],"eq":"cable","lv":"beginner","ins":["Polia baixa, fixe a caneleira no tornozelo da perna que vai trabalhar.","Em pé de frente para a polia, segure no aparelho para estabilidade.","Tronco levemente inclinado à frente, core firme.","Estenda o quadril levando a perna para trás, sem arquear a lombar.","Aperte o glúteo no topo do movimento.","Retorne controladamente sem deixar o peso bater no batente. Faça todas as reps e troque."],"gif":"exercicio-042.gif","img":null},{"id":"Cable_Glute_Kickback_Bench","n":"Extensão de Glúteo na Polia com Banco","en":"Cable Glute Kickback on Bench","pm":["glutes"],"sm":["hamstrings"],"eq":"cable","lv":"intermediate","ins":["Polia baixa, caneleira no tornozelo.","Posicione um banco inclinado entre você e a polia. Deite com o tronco apoiado no banco, quadril fora da borda.","Joelho da perna parada apoiado no banco; mãos seguram para estabilizar.","Quadril em flexão na posição inicial (perna abaixada, sob tensão).","Estenda o quadril contraindo o glúteo, levando a perna para cima e para trás.","Pausa breve no topo e desça controlado. Maior amplitude e alongamento do que a versão em pé."],"gif":"exercicio-043.gif","img":null},{"id":"Glute_Kickback_Machine","n":"Extensão de Glúteo na Máquina","en":"Glute Kickback Machine","pm":["glutes"],"sm":["hamstrings"],"eq":"machine","lv":"beginner","ins":["Posicione-se na máquina de glúteo em pé, apoiando o tronco no encosto.","Coloque o pé da perna que vai trabalhar sobre a plataforma/pedal da máquina.","Mãos firmes nas pegadas, core contraído, lombar neutra.","Empurre a plataforma para trás estendendo o quadril, sem hiperextensão lombar.","Aperte o glúteo no final do movimento.","Retorne controladamente sem deixar o peso bater. Faça todas as reps e troque de perna."],"gif":"exercicio-044.gif","img":null},{"id":"Dumbbell_Static_Lunge","n":"Afundo Estático com Halteres","en":"Dumbbell Static Lunge","pm":["quadriceps"],"sm":["glutes","hamstrings"],"eq":"dumbbell","lv":"beginner","ins":["Em pé, um halter em cada mão ao lado do corpo, pegada neutra.","Dê um passo grande à frente posicionando os pés (não caminha — fica parado nessa posição).","Pé da frente totalmente apoiado, pé de trás na ponta. Tronco ereto, core firme.","Desça flexionando os joelhos até o joelho de trás quase tocar o solo (≈90° em ambos).","Suba empurrando pelo calcanhar da perna da frente, voltando à posição inicial estática.","Faça todas as reps de uma perna antes de trocar. Joelho da frente alinhado com o pé."],"gif":"exercicio-046.gif","img":null},{"id":"Chest_Supported_Lateral_Raise","n":"Elevação Lateral com Peito Apoiado","en":"Chest Supported Lateral Raise","pm":["shoulders"],"sm":[],"eq":"dumbbell","lv":"beginner","ins":["Ajuste um banco inclinado a cerca de 30°.","Deite com o peito apoiado no banco, halteres em cada mão, braços pendendo para baixo.","Pegada neutra, leve flexão de cotovelos mantida durante todo o movimento.","Eleve os halteres lateralmente até a altura dos ombros, cotovelos liderando o movimento.","Sem balançar o corpo — o apoio no banco elimina o impulso (isso é o diferencial).","Desça controladamente, sentindo o deltoide médio trabalhar em toda amplitude."],"gif":"exercicio-047.gif","img":null},{"id":"Lying_Single_Arm_Lateral_Raise","n":"Elevação Lateral Unilateral no Banco","en":"Lying Single-Arm Lateral Raise","pm":["shoulders"],"sm":[],"eq":"dumbbell","lv":"intermediate","ins":["Deite de lado em um banco reto, segurando um halter com o braço de cima.","Braço estendido relaxado à frente do corpo, palma voltada para baixo.","Eleve o halter lateralmente em arco, mantendo leve flexão do cotovelo.","Pare na posição vertical (90° em relação ao solo) — pico de tensão no deltoide médio.","Desça controladamente em ≈3 segundos, mantendo tensão.","Faça todas as reps de um braço antes de trocar de lado."],"gif":"exercicio-048.gif","img":null},{"id":"Cable_Lying_Triceps_Extension","n":"Tríceps Testa na Polia","en":"Cable Lying Triceps Extension","pm":["triceps"],"sm":[],"eq":"cable","lv":"intermediate","ins":["Polia baixa com barra ou corda, banco posicionado de costas pro aparelho.","Deite no banco (ou em pé inclinado para frente, conforme variação), segure a pegada acima da cabeça.","Cotovelos apontando para cima, alinhados, próximos da cabeça — posição inicial com tensão constante.","Estenda os cotovelos até quase o travamento, sem mover os ombros.","A polia mantém tensão constante em toda amplitude (diferencial vs barra livre).","Retorne controladamente sentindo alongamento do tríceps na fase excêntrica."],"gif":"exercicio-049.gif","img":null},{"id":"mg_remada_cavalinho","n":"Remada Cavalinho (T-Bar)","nameEn":"T-Bar Row","pm":["middle back"],"sm":["lats","biceps"],"eq":"barbell","ins":["P const DBN = 'mgcoach_consultoria', DBV = 1, STORES = ['alunos', 'versoes', 'modelos', 'biblioteca', 'config'];

    let req; try { req = indexedDB.open(DBN, DBV); } catch (e) { return rej(e); }
    req.onupgradeneeded = e => { const d = e.target.result; STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
    req.onsuccess = () => { _db = req.result; res(_db); };

    req.onblocked = () => rej(new Error('blocked'));

}

async function dbOp(st, mode, fn) {

}

function buscarEx(q, m) {
  const qt = words(q).filter(t => !FSTOP.has(t));
  const pool = BIB.filter(b => b.tipo === 'ex').concat(EXS);
  const out = [];
  for (const e of pool) {
    if (m === '_vid') { if (!videosDe(e).length) continue; } else if (m && !(e.pm || []).includes(m)) continue;
    if (!qt.length) { out.push([0, e]); continue; }
    const w = e.w || (e.w = words(e.n + ' ' + (e.en || '')));
    let ok = true, sc = 0;
    for (const t of qt) { const i = w.findIndex(x => x.startsWith(t)); if (i < 0) { ok = false; break; } sc += (w[i] === t ? 6 : 3) - i * 0.5; }
    if (!ok) continue;
    if (w[0] && w[0].startsWith(qt[0])) sc += 8;
    if (e.tipo === 'ex') sc += 20;
    if (VIDS[e.id]) sc += 2;
    out.push([sc, e]);
  }
  out.sort((x, y) => y[0] - x[0] || x[1].n.localeCompare(y[1].n));
  return out.map(x => x[1]);
}

function bibFoods() { return BIB.filter(b => b.tipo === 'food' || b.tipo === 'rec').map(b => b.w ? b : indexFood(b)); }
function buscarAlimento(q) {
  const qt = words(q).filter(t => !FSTOP.has(t)); if (!qt.length) return [];
  const out = [];
  for (const f of bibFoods().concat(FOODS)) {
    let ok = true, sc = 0, first = 99;
    for (const t of qt) {
      let hit = -1; const alts = FSYN[t] || [t];
      for (let i = 0; i < f.w.length && hit < 0; i++) for (const al of alts) { if (f.w[i].startsWith(al)) { hit = i; break; } }
      if (hit < 0 && t.length >= 4 && f.nn.includes(t)) hit = 20;
      if (hit < 0) { ok = false; break; }

    if (!ok) continue;
    if (f.w[0] && f.w[0].startsWith(qt[0])) sc += 14;
    sc -= first * 2 + f.w.length * 0.8;
    if (f.s === 'U' || f.s === 'O' || f.s === 'R') sc += 40; else if (f.s === 'N') sc += 10; else if (f.s === 'M') sc += 6; else if (f.s === 'T') sc += 3;
    if (/\b(cozid|grelhad|assad)/.test(f.nn)) sc += 2;
    for (const w of FMODS) if (f.w.includes(w) && !qt.some(t => w.startsWith(t))) sc -= 5;
    out.push([sc, f]);
  }
  out.sort((x, y) => y[0] - x[0]);
  return out.slice(0, 40).map(x => x[1]);

function blocoHTML(txt) {
  const out = []; let ul = null, rows = null;
  const flush = () => { if (ul) { out.push(`<ul class="pl">${ul.join('')}</ul>`); ul = null; } if (rows) { out.push(`<div class="kvs">${rows.join('')}</div>`); rows = null; } };
  String(txt || '').split('\n').forEach(l => {
    const s = l.trim(); if (!s) { flush(); return; }
    if (/^[-•]\s+/.test(s)) { if (rows) flush(); (ul = ul || []).push(`<li>${esc(s.replace(/^[-•]\s+/, ''))}</li>`); return; }
    if (s.includes('::')) { if (ul) flush(); const [k, v] = s.split('::'); (rows = rows || []).push(`<div class="kvr"><span>${esc(k.trim())}</span><b>${esc((v || '').trim())}</b></div>`); return; }
    flush(); out.push(`<p>${esc(s)}</p>`);
  });
  flush(); return out.join('');
}

function linhaSVG(s, un) {
  const W = 320, H = 150, pl = 34, pr = 40, pt = 12, pb = 24;
  const ys = s.map(x => x.y); let mn = Math.min(...ys), mx = Math.max(...ys); if (mx - mn < 1) { mn -= 1; mx += 1; } const pad = (mx - mn) * 0.15; mn -= pad; mx += pad;
  const X = i => pl + (s.length === 1 ? 0 : i / (s.length - 1)) * (W - pl - pr), Y = v => pt + (1 - (v - mn) / (mx - mn)) * (H - pt - pb);
  const ticks = [mn + (mx - mn) * 0.15, (mn + mx) / 2, mx - (mx - mn) * 0.15];
  const path = s.map((p, i) => `${i ? 'L' : 'M'}${X(i).toFixed(1)},${Y(p.y).toFixed(1)}`).join('');
  const area = path + `L${X(s.length - 1).toFixed(1)},${H - pb}L${X(0).toFixed(1)},${H - pb}Z`;
  const L = s[s.length - 1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Evolução">
    ${ticks.map(t => `<line x1="${pl}" x2="${W - pr}" y1="${Y(t).toFixed(1)}" y2="${Y(t).toFixed(1)}" stroke="#e6eaee" stroke-width="1"/><text x="${pl - 6}" y="${(Y(t) + 4).toFixed(1)}" text-anchor="end" font-size="11" fill="#5a6b78">${fmt(t)}</text>`).join('')}

    ${s.map((p, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4" fill="#1668a8" stroke="#fff" stroke-width="2"/>`).join('')}
    <text x="${(X(s.length - 1) + 7).toFixed(1)}" y="${(Y(L.y) + 4).toFixed(1)}" font-size="12" font-weight="700" fill="#0c1a26">${fmt(L.y)}</text>
    <text x="${pl}" y="${H - 6}" font-size="11" fill="#5a6b78">${dataBR(s[0].d)}</text><text x="${W - pr}" y="${H - 6}" font-size="11" fill="#5a6b78" text-anchor="end">${dataBR(L.d)}</text>
    <text x="${W - 2}" y="${pt + 2}" font-size="11" fill="#5a6b78" text-anchor="end">${un}</text></svg>`;
}

function previaAluno(a, inicio) { const h = gerarProtocoloHTML(a, { treino: true, dieta: true, protocolo: true }, inicio); openSheet({ title: 'Como o aluno vê', tall: true, nopad: true, body: `<iframe class="frame" title="Prévia do protocolo"></iframe>`, onMount: () => { document.querySelector('.frame').srcdoc = h; } }); }

/* ---------- enviar ---------- */
/* ---------- imagens dentro do arquivo do aluno ----------
   O visualizador do WhatsApp e do app Arquivos não busca imagens na internet, então o protocolo leva
   cada imagem de execução dentro do próprio arquivo. As fotos são reduzidas; os GIFs vão como estão. */
const IMG_OK = new Map(), IMG_JOB = new Map();
function blobParaDataURL(b) { return new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(b); }); }
async function reduzirFoto(b) {
  try {
    const bmp = await createImageBitmap(b);
    const w = Math.min(460, bmp.width), h = Math.round(bmp.height * w / bmp.width);
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(bmp, 0, 0, w, h);
    const d = c.toDataURL('image/jpeg', 0.74); if (d.length > 100) return d;
  } catch (e) {}
  return blobParaDataURL(b);
}
function embutirImagem(url) {
  if (IMG_OK.has(url)) return Promise.resolve(IMG_OK.get(url));
  if (IMG_JOB.has(url)) return IMG_JOB.get(url);
  const job = (async () => {
    const r = await fetch(url, { mode: 'cors' }); if (!r.ok) throw new Error('http ' + r.status);
    const b = await r.blob();
    const d = /gif/i.test(b.type) || /\.gif(\?|$)/i.test(url) ? await blobParaDataURL(b) : await reduzirFoto(b);
    IMG_OK.set(url, d); return d;
  })().catch(() => null).finally(() => IMG_JOB.delete(url));
  IMG_JOB.set(url, job); return job;
}
function imagensDoTreino(a) {
  const L = new Set();
  DIAS.forEach(([k]) => (a.treino.dias[k].ex || []).forEach(x => { const e = exById(x.exId), vs = videosDe(e); (vs.length ? vs.map(v => VID_ABS + v.v + '.jpg') : exImgs(e, true)).forEach(u => L.add(u)); }));
  return [...L];
}
async function prepararImagens(a, aoAvancar) {
  const L = imagensDoTreino(a); let feitas = 0, falhas = 0, i = 0;
  const trabalhador = async () => { while (i < L.length) { const u = L[i++]; const d = await embutirImagem(u); if (!d) falhas++; feitas++; aoAvancar && aoAvancar(feitas, L.length); } };
  await Promise.race([Promise.all(Array.from({ length: Math.min(6, L.length) }, trabalhador)), new Promise(ok => setTimeout(ok, 25000))]);
  return { total: L.length, faltam: L.filter(u => !IMG_OK.has(u)).length };
}
ACT.enviar = () => {
  const a = cur(); garantirAluno(a);

/* ================= sincronização entre aparelhos (repositório privado no GitHub) ================= */
const SYNC_STORES = ['alunos', 'modelos', 'biblioteca', 'versoes'];
const SYNC_KEY = 'mgcons.sync', DEL_KEY = 'mgcons.sync.del';
let SYNC = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY) || 'null'); } catch (e) { return null; } })();
let SYNC_DEL = (() => { try { return JSON.parse(localStorage.getItem(DEL_KEY) || '[]'); } catch (e) { return []; } })();
let _syncBusy = false, _syncAgain = false, _syncT = null, _syncSilenced = false, SYNC_ERR = '';
function saveSync() { try { if (SYNC) localStorage.setItem(SYNC_KEY, JSON.stringify(SYNC)); else localStorage.removeItem(SYNC_KEY); localStorage.setItem(DEL_KEY, JSON.stringify(SYNC_DEL)); } catch (e) {} }
const syncAtivo = () => !!(SYNC && SYNC.on && SYNC.token && SYNC.repo);

/* grava localmente marcando para sincronizar */
const _dbPutLocal = dbPut, _dbDelLocal = dbDel;
dbPut = async function (st, obj) {
  if (!_syncSilenced) {
    if (st === 'biblioteca' || st === 'config') obj.atualizadoEm = Date.now();
    else if ((st === 'alunos' || st === 'modelos') && !obj.atualizadoEm) obj.atualizadoEm = Date.now();
  }
  await _dbPutLocal(st, obj);
  if (!_syncSilenced && (SYNC_STORES.includes(st) || st === 'config')) agendarSync(4000);
};
dbDel = async function (st, id) {
  await _dbDelLocal(st, id);
  if (!_syncSilenced && SYNC_STORES.includes(st) && syncAtivo()) { const p = `${st}/${id}.json`; if (!SYNC_DEL.includes(p)) SYNC_DEL.push(p); saveSync(); agendarSync(2000); }
};
function agendarSync(ms = 4000) { if (!syncAtivo()) return; clearTimeout(_syncT); _syncT = setTimeout(() => sincronizar(), ms); }

/* ---------- GitHub ---------- */
function b64enc(str) { const by = new TextEncoder().encode(str); let s = ''; for (let i = 0; i < by.length; i += 0x8000) s += String.fromCharCode.apply(null, by.subarray(i, i + 0x8000)); return btoa(s); }
function b64dec(b) { const bin = atob(String(b).replace(/\s/g, '')); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return new TextDecoder().decode(u); }
async function gh(path, { method = 'GET', body, cfg = SYNC } = {}) {
  const r = await fetch(`https://api.github.com/repos/${cfg.repo}${path}`, { method, cache: 'no-store', headers: { Authorization: `Bearer ${cfg.token}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  let data = null; try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const err = new Error((data && data.message) || ('HTTP ' + r.status)); err.status = r.status; throw err; }
  return data;
}
async function ghArvore() {
  try {
    const t = await gh(`/git/trees/${encodeURIComponent(SYNC.branch || 'main')}?recursive=1`);
    const m = new Map(); (t.tree || []).forEach(e => { if (e.type === 'blob' && /\.json$/.test(e.path)) m.set(e.path, e.sha); });
    return m;
  } catch (e) { if (e.status === 409 || e.status === 404) return new Map(); throw e; }
}
async function ghLer(sha) { const b = await gh(`/git/blobs/${sha}`); return JSON.parse(b64dec(b.content)); }
async function ghGravar(path, obj, sha) {
  const r = await gh(`/contents/${path}`, { method: 'PUT', body: { message: `Atualiza ${path}`, content: b64enc(JSON.stringify(obj)), branch: SYNC.branch || 'main', ...(sha ? { sha } : {}) } });
  return r.content.sha;
}
async function ghApagar(path, sha) { await gh(`/contents/${path}`, { method: 'DELETE', body: { message: `Remove ${path}`, sha, branch: SYNC.branch || 'main' } }); }

/* ---------- registros locais ---------- */
const tsDe = (st, o) => !o ? 0 : st === 'versoes' ? (o.criadoEm || 0) : (o.atualizadoEm || o.criadoEm || 0);
function limpo(st, o) { const c = { ...o }; delete c.w; delete c.nn; delete c._wrap; return c; }
async function locais() {
  const out = new Map();
  for (const st of SYNC_STORES) for (const o of await dbAll(st)) { if (st === 'alunos' && o.exemplo) continue; out.set(`${st}/${o.id}.json`, { st, o }); }
  const c = (await dbAll('config')).find(x => x.id === 'cfg');
  if (c) { const x = { ...c }; ['ultimoBackup', 'iniciado'].forEach(k => delete x[k]); out.set('config.json', { st: 'config', o: x }); }
  return out;
}
async function gravarLocal(path, obj) {
  _syncSilenced = true;
  try {
    if (path === 'config.json') { const atual = (await dbAll('config')).find(x => x.id === 'cfg') || { id: 'cfg' }; await _dbPutLocal('config', { ...atual, ...obj, id: 'cfg', ultimoBackup: atual.ultimoBackup, iniciado: atual.iniciado }); }
    else { const [st] = path.split('/'); if (SYNC_STORES.includes(st)) await _dbPutLocal(st, obj); }
  } finally { _syncSilenced = false; }
}
async function apagarLocal(path) { const [st, f] = path.split('/'); if (SYNC_STORES.includes(st) && f) await _dbDelLocal(st, f.replace(/\.json$/, '')); }
async function recarregarCaches() {
  const c = (await dbAll('config')).find(x => x.id === 'cfg'); if (c) { CFG = { ...c }; delete CFG.id; }
  ALUNOS = (await dbAll('alunos')).map(garantirAluno);
  MODELOS = await dbAll('modelos');
  BIB = (await dbAll('biblioteca')).map(b => b.tipo === 'ex' ? b : indexFood(b));
  if (UI.alunoId && !ALUNOS.some(a => a.id === UI.alunoId)) UI.alunoId = null;
  if (UI.modeloId && !MODELOS.some(m => m.id === UI.modeloId)) UI.modeloId = null;
}
function syncStatus(t) { const el = $('saveSt'); if (el && !_dirty.size) el.textContent = t; }

/* ---------- ciclo de sincronização ---------- */
async function sincronizar({ manual = false } = {}) {
  if (!syncAtivo()) return false;
  if (_syncBusy) { _syncAgain = true; return false; }
  if (_dirty.size) await flush();
  if (!navigator.onLine) { SYNC_ERR = 'Sem internet. Sincroniza quando voltar.'; syncStatus('Sem internet'); return false; }
  _syncBusy = true; syncStatus('Sincronizando…');
  let mudou = false;
  try {
    for (let tentativa = 0; tentativa < 2; tentativa++) {
      const remoto = await ghArvore(); const L = await locais();
      SYNC.shas = SYNC.shas || {}; SYNC.synced = SYNC.synced || {};
      /* 1. traz o que mudou na nuvem */
      for (const [path, sha] of remoto) {
        if (SYNC.shas[path] === sha) continue;
        if (SYNC_DEL.includes(path)) continue;
        const rec = await ghLer(sha); const st = path === 'config.json' ? 'config' : path.split('/')[0];
        const loc = L.get(path); const lt = tsDe(st, loc && loc.o), rt = tsDe(st, rec);
        const localSujo = loc && lt > (SYNC.synced[path] || 0);
        if (!loc || !localSujo || rt >= lt) { await gravarLocal(path, rec); mudou = true; SYNC.synced[path] = rt; L.set(path, { st, o: rec }); }
        SYNC.shas[path] = sha;
      }
      /* 2. o que foi apagado em outro aparelho */
      for (const path of Object.keys(SYNC.shas)) {
        if (remoto.has(path)) continue;
        const loc = L.get(path);
        if (loc && tsDe(loc.st, loc.o) > (SYNC.synced[path] || 0)) { delete SYNC.shas[path]; continue; }
        if (loc) { _syncSilenced = true; try { await apagarLocal(path); } finally { _syncSilenced = false; } mudou = true; L.delete(path); }
        delete SYNC.shas[path]; delete SYNC.synced[path];
      }
      /* 3. o que foi apagado aqui */
      for (const path of [...SYNC_DEL]) { if (remoto.has(path)) { try { await ghApagar(path, remoto.get(path)); } catch (e) { if (e.status !== 404) throw e; } } delete SYNC.shas[path]; delete SYNC.synced[path]; SYNC_DEL = SYNC_DEL.filter(p => p !== path); }
      /* 4. envia o que mudou aqui */
      let conflito = false;
      for (const [path, { st, o }] of L) {
        if (SYNC.shas[path] && tsDe(st, o) <= (SYNC.synced[path] || 0)) continue;
        try { SYNC.shas[path] = await ghGravar(path, limpo(st, o), SYNC.shas[path]); SYNC.synced[path] = tsDe(st, o); }
        catch (e) { if (e.status === 409 || e.status === 422) { conflito = true; break; } throw e; }
      }
      saveSync();
      if (!conflito) break;
    }
    SYNC.last = Date.now(); SYNC_ERR = ''; saveSync();
    syncStatus('Sincronizado'); setTimeout(() => { if ($('saveSt').textContent === 'Sincronizado') $('saveSt').textContent = ''; }, 1800);
    if (mudou) { await recarregarCaches(); if (!SHEET && !(document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName))) render(); }
    if (manual) toast(mudou ? 'Sincronizado. Dados atualizados com a nuvem.' : 'Sincronizado. Tudo em dia.');
    if (UI.tab === 'backup' && !SHEET) render();
    return true;
  } catch (e) {
    SYNC_ERR = e.status === 401 ? 'O token foi recusado. Gere um novo e conecte de novo.' : e.status === 403 ? 'O token não tem permissão de escrita nesse repositório.' : e.status === 404 ? 'Repositório não encontrado. Confira o nome e a permissão do token.' : 'Não deu para sincronizar agora. Tento de novo em instantes.';
    syncStatus('Sem sincronizar'); if (manual) toast(SYNC_ERR);
    if (UI.tab === 'backup' && !SHEET) render();
    return false;
  } finally {
    _syncBusy = false;
    if (_syncAgain) { _syncAgain = false; agendarSync(1500); }
  }
}

  const codigo = gravar(limpar({ tipo: 'mgcoach_anamnese_v2', id: 'teste' + Date.now().toString(36), enviadaEm: new Date().toISOString(),
    respostas: { q_nome: 'Teste Anamnese', q_sexo: 'Masculino', q_idade: '30', q_peso: '80', q_altura: '178', q_objetivo: 'Hipertrofia', q_diasSemana: '4', q_nivelExp: 'Intermediário (6m a 2 anos)' },
    secoes: [{ t: 'Teste', itens: [['Isto é um teste', 'Pode excluir este aluno no app.']] }] }));
  Logger.log(codigo === 201 ? 'Deu certo. Em até 1 minuto o aluno "Teste Anamnese" aparece no app.' : 'O GitHub respondeu ' + codigo + '. Confira a chave na linha 2.');
}
`;
}
function blocoAnamnese() {
  if (IN_CLAUDE) return '';
  if (!syncAtivo()) return `<div class="block"><h3>Anamnese direto no app</h3><p>Conecte este aparelho na sincronização para receber as anamneses no app.</p></div>`;
  let ult = 0; try { ult = +localStorage.getItem('mgcons.anamnese.ultima') || 0; } catch (e) {}
  const recebidas = ALUNOS.reduce((s, a) => s + (a.anamneses || []).length, 0);
  return `<div class="block"><h3>Anamnese direto no app</h3><p>Quando a pessoa responde a anamnese, além do e-mail, ela vira aluno aqui com a ficha preenchida. ${recebidas ? `${recebidas} ${recebidas === 1 ? 'anamnese recebida' : 'anamneses recebidas'}${ult ? ', a última neste aparelho em ' + dataLonga(ult) : ''}.` : 'Configure uma vez só, no computador:'}</p>
    <ol class="ins" style="margin-top:10px;color:var(--ink)">
      <li>Toque em <b>Copiar código</b>. Ele já vem com a sua chave do GitHub.</li>
      <li>Abra o <b>Google Apps Script</b> com o mesmo Gmail que recebe as anamneses. Apague o que estiver no editor, cole o código e salve.</li>
      <li>No alto, escolha a função <b>testar</b> e toque em <b>Executar</b>. Autorize a sua conta: em "Avançado", toque em "Acessar". Em até 1 minuto aparece o aluno <b>Teste Anamnese</b> aqui.</li>
      <li>Toque em <b>Implantar → Nova implantação</b>, tipo <b>App da Web</b>. Executar como: <b>Eu</b>. Quem pode acessar: <b>Qualquer pessoa</b>. Copie o endereço que termina em <b>/exec</b>: ele vai uma vez só para a anamnese.</li>
    </ol>
    <div class="btns" style="margin-top:12px"><button class="btn btn-ink" type="button" data-act="copiarAppsScript">Copiar código</button><a class="btn btn-line" href="https://script.google.com/home/projects/create" target="_blank" rel="noopener">Abrir o Apps Script</a></div>
    <p class="note" style="margin-top:10px">Se a pessoa já for sua aluna (mesmo WhatsApp ou mesmo nome), a anamnese entra na ficha dela e atualiza peso, altura e idade, sem criar outro aluno.</p></div>`;
}
ACT.copiarAppsScript = async () => {
  const c = codigoAppsScript(SYNC.repo, SYNC.token);
  try { await navigator.clipboard.writeText(c); toast('Código copiado. Agora cole no Apps Script.'); }
  catch (e) { openSheet({ title: 'Copie o código', tall: true, body: `<p class="note">Selecione tudo e copie.</p><textarea id="asCode" readonly style="width:100%;min-height:60vh;font:12px ui-monospace,monospace;background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px">${esc(c)}</textarea>`, onMount: () => { const t = $('asCode'); t.focus(); t.select(); } }); }
};

/* liga a sincronização na tela de Backup e no início */
const _renderBackup0 = renderBackup;
renderBackup = function (v) {
  _renderBackup0(v);
  const h = v.querySelector('.head'); if (h) { h.querySelector('h1').textContent = 'Backup e sincronização'; h.querySelector('.foco').textContent = syncAtivo() ? 'Este aparelho sincroniza com a nuvem. O backup fica como cópia extra.' : 'Sem sincronizar, os dados ficam só neste aparelho. Exporte um backup toda semana.'; }
  const av = v.querySelector('.aviso'); if (av && syncAtivo()) av.remove();
  h.insertAdjacentHTML('afterend', blocoSync());
  const sb = h.nextElementSibling; if (sb) { sb.insertAdjacentHTML('afterend', blocoVis()); sb.insertAdjacentHTML('afterend', blocoAnamnese()); }
};
const _iniciar0 = iniciar;
iniciar = async function () { await _iniciar0(); if (syncAtivo()) sincronizar(); };
iniciar();

if('serviceWorker' in navigator && location.protocol==='https:' && !IN_CLAUDE){ window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{})); }

</script>
