<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef0f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Consultoria">
<title>MG COACH Consultoria</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna única de até 560px, como o Organizer e o app de treino. Barra de vidro com a marca no topo, abas fixas embaixo,
   aluno aberto com sub-abas (Ficha, Treino, Dieta, Protocolo, Avaliação). Folhas que sobem de baixo para editar.
   Tema único e claro, do design system MG COACH (build mgcoach-ppl2x-v2.2.0). */
:root{
  color-scheme:light;
  --paper:#eef0f2; --card:#ffffff; --bar-glass:rgba(238,240,242,0.92);
  --rule:#dce2e7; --rule-soft:#edf0f3; --grid:#e6eaee;
  --ink:#0c1a26; --ink-hover:#17293a; --ink-2:#5a6b78; --ink-3:#8e9ca8; --spark:#9daab6;
  --on-ink:#ffffff; --on-ink-day:rgba(255,255,255,0.55); --on-ink-label:rgba(255,255,255,0.58); --on-ink-2:rgba(255,255,255,0.66);
  --accent:#ff5a00; --accent-soft:#fff0e8; --accent-line:#ffd0b4; --alert-text:#8a3200;
  --data:#1668a8; --data-track:#d8e5f1; --data-wash:rgba(22,104,168,0.09);
  --up:#157a4a; --up-soft:#e5f2ea; --down:#b8381f; --down-soft:#fbebe6; --down-line:#f1c9bf;
  --r-card:14px; --r-field:10px; --r-pill:999px;
  --shadow-focus:0 0 0 3px #fff0e8;
  --font-sans:'Archivo',system-ui,-apple-system,sans-serif;
  --tab-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-sans);font-feature-settings:'tnum' 1;font-variant-numeric:tabular-nums;line-height:1.5;-webkit-font-smoothing:antialiased;font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:41;background:var(--paper)}
button,input,select,textarea{font-family:inherit;color:inherit;font-size:inherit}
button{cursor:pointer;background:none;border:none}
a{color:var(--data)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* barra superior */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bar-glass);-webkit-backdrop-filter:saturate(1.6) blur(10px);backdrop-filter:saturate(1.6) blur(10px);border-bottom:1px solid var(--rule)}
.bar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:52px}
.mark{font-size:13px;font-weight:700;letter-spacing:-.01em;white-space:nowrap}
.mark b{color:var(--accent);font-weight:700}
.mark span{color:var(--ink-2);font-weight:500;margin-left:4px}
.save-st{font-size:11.5px;color:var(--ink-3);font-weight:500;white-space:nowrap}
.bar-r{display:flex;align-items:center;gap:10px;min-width:0}
.pill-btn{background:var(--ink);color:var(--on-ink);border-radius:var(--r-pill);padding:8px 15px;font-size:13px;font-weight:600;letter-spacing:-.01em;white-space:nowrap;transition:background .14s}
.pill-btn:hover{background:var(--ink-hover)}

/* abas de baixo */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bar-glass);-webkit-backdrop-filter:saturate(1.6) blur(10px);backdrop-filter:saturate(1.6) blur(10px);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tab{position:relative;font-size:12.5px;font-weight:500;color:var(--ink-2);display:flex;align-items:center;justify-content:center}
.tab::before{content:'';position:absolute;top:-1px;left:26%;right:26%;height:2px;border-radius:0 0 2px 2px;background:transparent}
.tab.on{color:var(--ink);font-weight:600}
.tab.on::before{background:var(--accent)}

main.wrap{padding-block:16px calc(var(--tab-h) + 40px + env(safe-area-inset-bottom,0px))}
.head{padding:4px 0 18px}
.head h1{font-size:clamp(34px,10vw,46px);font-weight:700;letter-spacing:-.045em;line-height:.98;margin-bottom:10px;text-wrap:balance;overflow-wrap:anywhere}
.head .foco{font-size:15px;color:var(--ink-2);max-width:40ch;line-height:1.45}
.title{font-size:26px;font-weight:700;letter-spacing:-.035em;line-height:1.3;margin-bottom:4px}
.title-sub{font-size:14px;color:var(--ink-2);margin-bottom:16px}
.voltar{padding:0 0 10px;font-size:13.5px;font-weight:500;color:var(--ink-2)}
.voltar::before{content:'← '}
.voltar:hover{color:var(--ink)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:20px 0 8px}
.sec-h h3{font-size:15px;font-weight:600;letter-spacing:-.02em}
.sec-h span,.sec-h button{font-size:12.5px;color:var(--ink-2);font-weight:500}
.sec-h button{color:var(--data);text-decoration:underline;text-underline-offset:3px}

/* sub-abas do aluno */
.subnav{position:sticky;top:calc(52px + env(safe-area-inset-top,0px));z-index:30;background:var(--bar-glass);-webkit-backdrop-filter:saturate(1.6) blur(10px);backdrop-filter:saturate(1.6) blur(10px);margin:0 -16px 14px;padding:0 16px;border-bottom:1px solid var(--rule);display:flex;gap:18px;overflow-x:auto;scrollbar-width:none}
.subnav::-webkit-scrollbar{display:none}
.linkbtn{color:var(--ink-2);font-size:13.5px;font-weight:500;padding:11px 1px 9px;border-bottom:1.5px solid transparent;white-space:nowrap;transition:color .12s}
.linkbtn:hover{color:var(--ink)}
.linkbtn.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}

/* cards e blocos */
.block{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);padding:16px 17px;margin-bottom:10px}
.block h3{font-size:15px;font-weight:600;letter-spacing:-.02em;margin-bottom:8px}
.block p{font-size:14px;color:var(--ink-2);line-height:1.55}
.block p+p{margin-top:8px}
.aviso{background:var(--accent-soft);border:1px solid var(--accent-line);border-radius:var(--r-card);padding:12px 14px;margin:0 0 12px;font-size:13.5px;color:var(--alert-text);line-height:1.5}
.aviso .btns{margin-top:10px}
.aviso .btn-line{border-color:var(--accent-line);color:var(--alert-text);flex:0 0 auto}
.hoje{background:var(--ink);color:var(--on-ink);border-radius:var(--r-card);padding:14px 16px 15px;margin-bottom:8px}
.hoje .hl{font-size:12.5px;color:var(--on-ink-label);font-weight:500;display:flex;justify-content:space-between;gap:10px}
.hoje .hv{font-size:26px;font-weight:700;letter-spacing:-.03em;line-height:1.15;margin-top:1px}
.hoje .hm{font-size:13px;color:var(--on-ink-2);margin-top:5px}
.hoje .hm b{color:var(--on-ink);font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpi{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);padding:12px 12px 11px;min-width:0}
.kpi.flat{background:var(--paper);border-color:transparent}
.kv{display:block;font-size:22px;font-weight:700;letter-spacing:-.03em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kv small{font-size:.62em;font-weight:600;color:var(--ink-2);margin-left:3px;letter-spacing:0}
.kl{display:block;font-size:12px;color:var(--ink-2);font-weight:500;margin-top:3px;line-height:1.3}
.ks{display:block;font-size:11.5px;color:var(--ink-2);opacity:.85;margin-top:1px}
.up{color:var(--up)} .down{color:var(--down)}
.empty{background:var(--card);border:1px dashed var(--rule);border-radius:var(--r-card);padding:20px 17px;text-align:center;color:var(--ink-2);font-size:14px;line-height:1.5}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.empty .btns{justify-content:center;margin-top:12px}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:var(--r-field);padding:11px 15px;font-size:14.5px;font-weight:600;letter-spacing:-.01em;border:1px solid transparent;transition:background .14s,border-color .12s,color .12s}
.btn-ink{background:var(--ink);color:var(--on-ink)}
.btn-ink:hover{background:var(--ink-hover)}
.btn-ink.ok{background:var(--accent);color:var(--ink)}
.btn-line{background:var(--card);border-color:var(--rule);color:var(--ink-2);font-weight:500;font-size:13.5px}
.btn-line:hover{border-color:var(--ink-3);color:var(--ink)}
.btn-danger{background:var(--card);border-color:var(--down-line);color:var(--down);font-weight:500;font-size:13.5px}
.btn-danger:hover{background:var(--down-soft)}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:var(--r-pill)}
.btn-full{width:100%}
.btn:disabled{opacity:.35;cursor:default}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1 1 auto}
.link{color:var(--data);font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px;padding:4px 0}
.link.del{color:var(--down)}

/* chips */
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
.opts.scroll::-webkit-scrollbar{display:none}
.opt{flex:none;background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-pill);padding:7px 13px;font-size:13px;font-weight:500;color:var(--ink-2);white-space:nowrap;transition:background .12s,color .12s,border-color .12s}
.opt.card{background:var(--card)}
.opt:hover{border-color:var(--ink-3)}
.opt.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink);font-weight:600}
.opt.add{border-style:dashed;background:transparent}
.opt.sm{padding:5px 11px;font-size:12px}
.tag{display:inline-block;font-size:11px;font-weight:600;color:var(--ink-2);background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-pill);padding:0 7px;white-space:nowrap;vertical-align:1px;letter-spacing:0}
.tag.acc{color:var(--alert-text);background:var(--accent-soft);border-color:var(--accent-line)}
.tag.dat{color:var(--data);background:var(--card);border-color:var(--data-track)}
.tag.up{color:var(--up);background:var(--up-soft);border-color:transparent}

/* formulários */
.form{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.form .full{grid-column:1/-1}
.campo{display:block;font-size:12.5px;color:var(--ink-2);font-weight:500;margin-bottom:10px;min-width:0}
.campo input,.campo select,.campo textarea{display:block;width:100%;margin-top:4px;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:var(--r-field);padding:9px 11px;-webkit-appearance:none;appearance:none}
.campo select{background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 16px) 55%,calc(100% - 11px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:28px}
.campo textarea{min-height:84px;resize:vertical;line-height:1.5;font-size:15px}
.campo input:focus,.campo select:focus,.campo textarea:focus{outline:none;border-color:var(--accent);background-color:var(--card)}
.campo .hint{display:block;font-size:11.5px;color:var(--ink-2);margin-top:3px;font-weight:400}
.campo.inline{display:flex;align-items:center;justify-content:space-between;gap:10px}
.campo.inline input{width:96px;margin-top:0;text-align:right}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink);padding:9px 0;border-bottom:1px solid var(--rule-soft);cursor:pointer}
.chk:last-child{border-bottom:none}
.chk input{width:20px;height:20px;accent-color:var(--ink);flex:none}
.chk span{flex:1;min-width:0}
.chk small{display:block;color:var(--ink-2);font-size:12.5px}
.busca{width:100%;font-size:16px;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:var(--r-field);padding:11px 12px;-webkit-appearance:none;appearance:none}
.busca.paper{background:var(--paper)}
.busca:focus{outline:none;border-color:var(--accent);background:var(--card);box-shadow:var(--shadow-focus)}
.busca::-webkit-search-cancel-button{-webkit-appearance:none}
.switch{position:relative;width:44px;height:26px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch i{position:absolute;inset:0;background:var(--rule);border-radius:99px;transition:background .14s;pointer-events:none}
.switch i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(12,26,38,.25);transition:transform .14s}
.switch input:checked+i{background:var(--ink)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}
.row-sw{display:flex;align-items:center;justify-content:space-between;gap:12px}
.row-sw h3{margin:0}

/* lista de alunos */
.lst{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 15px;border-bottom:1px solid var(--rule-soft);transition:background .12s}
.li:last-child{border-bottom:none}
.li:hover{background:var(--paper)}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--paper);border:1px solid var(--rule);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:-.02em}
.li-m{flex:1;min-width:0}
.li-t{display:block;font-size:15px;font-weight:600;letter-spacing:-.015em;line-height:1.3;overflow-wrap:anywhere}
.li-s{display:block;font-size:12.5px;color:var(--ink-2);margin-top:1px}
.li-r{flex:none;text-align:right;font-size:12.5px;color:var(--ink-2)}
.li-r b{display:block;font-size:15px;color:var(--ink);font-weight:700;letter-spacing:-.02em}
.thumb{flex:none;width:48px;height:48px;border-radius:9px;background:var(--paper);border:1px solid var(--rule-soft);overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:11px;font-weight:700}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}

/* semana e sessão */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:2px 0 16px}
.day{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-field);padding:8px 2px 9px;text-align:center;color:var(--ink-2);transition:border-color .12s,background .12s;min-width:0}
.day .d{font-size:10.5px;font-weight:500;color:var(--ink-3);display:block}
.day .s{font-size:13px;font-weight:700;letter-spacing:-.02em;color:var(--ink);display:block;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.day.on{background:var(--ink);border-color:var(--ink)}
.day.on .d{color:var(--on-ink-day)}
.day.on .s{color:var(--on-ink)}
.day.rest{background:transparent;border-style:dashed}
.day.rest .s{color:var(--ink-3);font-weight:500}
.day.rest.on{background:var(--ink);border-style:solid}
.day.rest.on .s{color:var(--on-ink)}
.stats{display:flex;gap:22px;margin-top:14px;padding-top:12px;border-top:1px solid var(--rule)}
.stat .n{font-size:19px;font-weight:700;letter-spacing:-.02em;display:block;line-height:1.1}
.stat .l{font-size:11.5px;color:var(--ink-2);font-weight:500}
.sess-head{display:grid;grid-template-columns:96px 1fr;gap:0 10px}

/* exercício */
.ex{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);margin-bottom:9px;overflow:hidden}
.ex-top{display:flex;gap:11px;padding:14px 15px 0;align-items:flex-start}
.ex-n{font-size:12px;font-weight:600;color:var(--ink-3);flex:0 0 auto;width:16px;padding-top:3px}
.ex-main{flex:1;min-width:0}
.ex-name{font-size:17px;font-weight:600;letter-spacing:-.025em;line-height:1.2;overflow-wrap:anywhere}
.ex-meta{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.ex-nota{font-size:13px;color:var(--ink-2);line-height:1.48;padding:8px 15px 0 42px}
.ex-presc{padding:10px 15px 0 42px}
.ex-acts{display:flex;align-items:center;gap:6px;padding:10px 15px 12px 42px;flex-wrap:wrap}
.icon-btn{width:32px;height:32px;border:1px solid var(--rule);border-radius:8px;background:var(--card);color:var(--ink-2);font-size:15px;line-height:1;display:inline-flex;align-items:center;justify-content:center}
.icon-btn:hover{border-color:var(--ink-3);color:var(--ink)}
.icon-btn:disabled{opacity:.35}
.ex-acts .grow{flex:1}
table.dt{width:100%;border-collapse:collapse;font-size:13px}
.dt th,.dt td{text-align:left;padding:7px 6px 7px 0;border-bottom:1px solid var(--rule-soft);vertical-align:top}
.dt thead th{font-size:11.5px;font-weight:500;color:var(--ink-2);padding-top:0}
.dt tbody th{font-weight:600}
.dt tr.aq th,.dt tr.aq td{color:var(--ink-2)}
.dt tr:last-child th,.dt tr:last-child td{border-bottom:none}
.dt td:last-child,.dt th:last-child{padding-right:0;text-align:right}

/* barras de volume */
.mb{display:grid;grid-template-columns:96px 1fr 34px;gap:8px;align-items:center;padding:4px 0;font-size:13px}
.mb span{color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb .tr{height:8px;background:var(--data-track);border-radius:4px;overflow:hidden;position:relative}
.mb .tr i{position:absolute;inset:0 auto 0 0;background:var(--data);border-radius:0 4px 4px 0}
.mb b{text-align:right;font-weight:600}

/* refeições */
.ref{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);margin-bottom:10px;overflow:hidden}
.ref-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:15px 16px 0}
.ref-nome{font-size:17px;font-weight:600;letter-spacing:-.025em;overflow-wrap:anywhere}
.ref-quando{font-size:12.5px;color:var(--ink-2);margin-top:2px;font-weight:500}
.ref-k{font-size:17px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
.ref-k span{font-size:12px;color:var(--ink-2);font-weight:500;margin-left:2px}
.ref-nota{font-size:13px;color:var(--ink-2);line-height:1.48;padding:7px 16px 0}
.ref-mac{font-size:12.5px;color:var(--ink-2);padding:6px 16px 0}
.ref-mac b{color:var(--ink);font-weight:600}
.ref-ops{padding:10px 16px 0}
.fixos{padding:8px 16px 4px}
.fx{display:grid;grid-template-columns:1fr auto;gap:1px 12px;width:100%;text-align:left;padding:8px 0;border-bottom:1px solid var(--rule-soft);font-size:14px}
.fx:last-child{border-bottom:none}
.fx .a{min-width:0;overflow-wrap:anywhere;line-height:1.35}
.fx .b{text-align:right;white-space:nowrap;color:var(--ink-2)}
.fx .c{font-size:12px;color:var(--ink-2)}
.fx .d{font-size:12px;color:var(--ink-2);text-align:right;white-space:nowrap}
.fx .subs{grid-column:1/-1;font-size:12.5px;color:var(--data);font-weight:500}
.ref-acts{display:flex;gap:8px;padding:6px 16px 14px;flex-wrap:wrap}
.vazio{font-size:13px;color:var(--ink-2);padding:8px 16px 4px}

/* resultados de busca */
.res-l{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-card);overflow:hidden;margin-top:10px}
.res{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-bottom:1px solid var(--rule-soft);padding:10px 14px;transition:background .12s}
.res:last-child{border-bottom:none}
.res:hover{background:var(--paper)}
.res .nm{flex:1;min-width:0;font-size:14px;font-weight:600;letter-spacing:-.01em;line-height:1.3;overflow-wrap:anywhere}

 Pegue a barra com pegada um pouco mais aberta que os ombros.","Retire a barra do suporte e desça lentamente até tocar a parte média do peito.","Empurre a barra para cima até estender os braços, sem travar os cotovelos.","Mantenha as escápulas retraídas durante todo o movimento."],"gif":null,"img":"Barbell_Bench_Press_-_Medium_Grip"},{"id":"Dumbbell_Bench_Press","n":"Supino Reto com Halteres","en":"Dumbbell Bench Press","pm":["chest"],"sm":["shoulders","triceps"],"eq":"dumbbell","lv":"beginner","ins":["Deite no banco segurando um halter em cada mão na altura do peito.","Empurre os halteres para cima de forma controlada até quase tocarem.","Desça lentamente até a altura do peito.","Mantenha os punhos firmes e cotovelos a ~45° do tronco."],"gif":null,"img":"Dumbbell_Bench_Press"},{"id":"Incline_Dumbbell_Press","n":"Supino Inclinado com Halteres","en":"Incline Dumbbell Press","pm":["chest"],"sm":["shoulders","triceps"],"eq":"dumbbell","lv":"intermediate","ins":["Ajuste o banco em ~30-45°. Sente segurando os halteres na coxa.","Deite-se levando os halteres para a altura do peito.","Empurre para cima de forma controlada.","Foco no peito superior — não jogue os halteres."],"gif":null,"img":"Incline_Dumbbell_Press"},{"id":"Barbell_Incline_Bench_Press_Medium-Grip","n":"Supino Inclinado com Barra","en":"Barbell Incline Bench Press","pm":["chest"],"sm":["shoulders","triceps"],"eq":"barbell","lv":"intermediate","ins":["Ajuste o banco em 30-45°.","Desça a barra controladamente até a parte alta do peito.","Empurre verticalmente.","Mantenha os pés firmes no chão."],"gif":"exercicio-024.gif","img":null},{"id":"Decline_Dumbbell_Bench_Press","n":"Supino Declinado com Halteres","en":"Decline Dumbbell Press","pm":["chest"],"sm":["shoulders","triceps"],"eq":"dumbbell","lv":"intermediate","ins":["Banco em declínio (~15-30°), prenda os pés.","Halteres na altura da parte baixa do peito.","Empurre verticalmente até estender os braços."],"gif":null,"img":"Decline_Dumbbell_Bench_Press"},{"id":"Pushups","n":"Flexão de Braço","en":"Push-ups","pm":["chest"],"sm":["shoulders","triceps"],"eq":"body only","lv":"beginner","ins":["Apoie as mãos no chão um pouco mais abertas que os ombros.","Mantenha o corpo reto da cabeça aos calcanhares.","Desça até o peito quase tocar o chão.","Empurre de volta sem travar os cotovelos."],"gif":null,"img":"Pushups"},{"id":"Dumbbell_Flyes","n":"Crucifixo Reto com Halteres","en":"Dumbbell Flyes","pm":["chest"],"sm":["shoulders"],"eq":"dumbbell","lv":"intermediate","ins":["Deite no banco com halteres acima do peito, palmas frente a frente.","Abra os braços lateralmente com leve flexão dos cotovelos.","Sinta o alongamento e retorne pelo mesmo caminho.","Imagine abraçar uma árvore grande."],"gif":null,"img":"Dumbbell_Flyes"},{"id":"Cable_Crossover","n":"Crossover na Polia","en":"Cable Crossover","pm":["chest"],"sm":["shoulders"],"eq":"cable","lv":"intermediate","ins":["Polias na altura mais alta. Pegue uma alça em cada mão.","Dê um passo à frente, ligeiro avanço do tronco.","Cruze as mãos à frente do corpo na linha do umbigo.","Retorne controladamente sentindo o alongamento."],"gif":null,"img":"Cable_Crossover"},{"id":"Bench_Dips","n":"Mergulho no Banco","en":"Bench Dips","pm":["triceps"],"sm":["chest","shoulders"],"eq":"body only","lv":"beginner","ins":["Mãos apoiadas no banco, pés no chão.","Desça flexionando os cotovelos a 90°.","Empurre de volta para cima."],"gif":null,"img":"Bench_Dips"},{"id":"Dips_-_Chest_Version","n":"Paralelas para Peito","en":"Chest Dips","pm":["chest"],"sm":["triceps","shoulders"],"eq":"body only","lv":"intermediate","ins":["Suspenso nas paralelas, incline o tronco à frente.","Desça flexionando os cotovelos, levando o peito para baixo.","Empurre de volta sentindo o peito."],"gif":null,"img":"Dips_-_Chest_Version"},{"id":"Pullups","n":"Barra Fixa (Pull-up)","en":"Pull-ups","pm":["lats"],"sm":["biceps","middle back"],"eq":"body only","lv":"intermediate","ins":["Pegue a barra com pegada pronada, mãos um po eps que a versão pronada."],"gif":"exercicio-030.gif","img":null},{"id":"Standing_Cable_Pullover","n":"Pullover na Polia em Pé","en":"Standing Cable Pullover","pm":["lats"],"sm":[],"eq":"cable","lv":"intermediate","ins":["Polia alta, barra reta. Em pé de frente para a polia.","Braços estendidos à frente, leve flexão.","Puxe a barra em arco até as coxas.","Excelente isolamento dos dorsais."],"gif":null,"img":"Straight-Arm_Pulldown"},{"id":"Inverted_Row_with_Underhand_Grip","n":"Remada Invertida (Inverted Row)","en":"Inverted Row","pm":["middle back"],"sm":["biceps","lats"],"eq":"body only","lv":"beginner","ins":["Barra na altura do quadril, deite-se sob ela.","Pegada na largura dos ombros.","Puxe o peito em direção à barra.","Mantenha o corpo reto."],"gif":null,"img":"Inverted_Row"},{"id":"Rack_Pulls","n":"Rack Pull (Terra Parcial)","en":"Rack Pull","pm":["middle back"],"sm":["lower back","traps","glutes","hamstrings"],"eq":"barbell","lv":"intermediate","ins":["Barra apoiada no rack na altura dos joelhos.","Puxe em pé estendendo quadril e joelhos.","Aperte escápulas no topo.","Permite cargas maiores que o terra completo."],"gif":null,"img":"Rack_Pulls"},{"id":"Seated_Barbell_Military_Press","n":"Desenvolvimento Sentado com Barra","en":"Seated Barbell Press","pm":["shoulders"],"sm":["triceps"],"eq":"barbell","lv":"intermediate","ins":["Sentado no banco com encosto.","Barra na altura dos ombros, pegada um pouco mais aberta que ombros.","Empurre verticalmente.","Mantenha core firme."],"gif":null,"img":"Seated_Barbell_Military_Press"},{"id":"Smith_Machine_Overhead_Shoulder_Press","n":"Desenvolvimento Smith","en":"Smith Shoulder Press","pm":["shoulders"],"sm":["triceps"],"eq":"machine","lv":"beginner","ins":["Banco sob a Smith, costas firmes no encosto.","Empurre verticalmente — movimento guiado."],"gif":null,"img":"Smith_Machine_Overhead_Shoulder_Press"},{"id":"Reverse_Flyes","n":"Crucifixo Inverso (Voador Inverso)","en":"Reverse Flyes","pm":["shoulders"],"sm":["middle back"],"eq":"dumbbell","lv":"beginner","ins":["Tronco inclinado ou em máquina pec-deck invertida.","Abra os braços lateralmente.","Aperte escápulas no topo."],"gif":null,"img":"Reverse_Flyes"},{"id":"Cable_Lateral_Raise","n":"Elevação Lateral na Polia","en":"Cable Lateral Raise","pm":["shoulders"],"sm":[],"eq":"cable","lv":"intermediate","ins":["Polia baixa, em pé de lado.","Eleve lateralmente até a altura do ombro.","Tensão constante — diferencial vs halteres."],"gif":"exercicio-037.gif","img":null},{"id":"Push_Press","n":"Push Press","en":"Push Press","pm":["shoulders"],"sm":["triceps","quadriceps"],"eq":"barbell","lv":"intermediate","ins":["Barra na altura dos ombros.","Use leve impulso das pernas para iniciar o movimento.","Empurre verticalmente.","Permite cargas maiores que o militar puro."],"gif":null,"img":"Push_Press"},{"id":"EZ-Bar_Curl","n":"Rosca com Barra W","en":"EZ-Bar Curl","pm":["biceps"],"sm":["forearms"],"eq":"e-z curl bar","lv":"beginner","ins":["Barra W com pegada supinada nas curvas internas.","Mais conforto para os punhos vs barra reta.","Cotovelos fixos ao tronco."],"gif":null,"img":"EZ-Bar_Curl"},{"id":"Spider_Curl","n":"Rosca Spider","en":"Spider Curl","pm":["biceps"],"sm":[],"eq":"dumbbell","lv":"intermediate","ins":["Tronco apoiado em banco inclinado (peito no encosto).","Braços pendurados.","Flexione mantendo cotovelos fixos.","Excelente isolamento — sem possibilidade de trapaça."],"gif":"exercicio-031.gif","img":null},{"id":"Cable_Hammer_Curls_-_Rope_Attachment","n":"Rosca Martelo na Polia (Corda)","en":"Cable Hammer Curl Rope","pm":["biceps"],"sm":["forearms"],"eq":"cable","lv":"beginner","ins":["Polia baixa com corda.","Pegada neutra.","Tensão constante durante o movimento."],"gif":null,"img":"Cable_Hammer_Curls_-_Rope_Attachment"},{"id":"Standing_Biceps_Cable_Curl","n":"Rosca em Pé na Polia","en":"Standing Cable Curl","pm":["biceps"],"sm":[],"eq":"cable","lv":"beginner","ins":["Polia baixa, barra reta.","Em pé, cotovelos fixos.","Tensã -Down_Wrist_Curl"},{"id":"Reverse_Barbell_Curl","n":"Rosca Inversa","en":"Reverse Curl","pm":["biceps"],"sm":["forearms"],"eq":"barbell","lv":"intermediate","ins":["Pegada pronada na barra (palmas para baixo).","Flexione os cotovelos.","Foco no braquiorradial e antebraço."],"gif":null,"img":"Reverse_Barbell_Curl"},{"id":"Butterfly","n":"Voador (Pec Deck)","en":"Pec Deck / Butterfly","pm":["chest"],"sm":["shoulders"],"eq":"machine","lv":"beginner","ins":["Sente na máquina com costas firmes no encosto, pés apoiados.","Posicione antebraços nos pads (cotovelos a 90°) ou segure as pegadas.","Empurre os braços para frente apertando o peito até quase encostar.","Volte controladamente sem deixar os pads baterem nas placas."],"gif":null,"img":"Butterfly"},{"id":"Cable_Crossover_Variations","n":"Crossover Polia Baixa","en":"Low Cable Crossover","pm":["chest"],"sm":["shoulders","biceps"],"eq":"cable","lv":"intermediate","ins":["Polias na posição mais baixa, segure as pegadas.","Tronco levemente inclinado à frente, braços abertos lateralmente.","Traga as mãos para cima e para o centro, em frente ao peito alto.","Foco no peito superior — não suba demais (não vira elevação frontal)."],"gif":"exercicio-029.gif","img":null},{"id":"Cable_Chest_Press","n":"Supino na Polia (em pé)","en":"Cable Chest Press","pm":["chest"],"sm":["shoulders","triceps"],"eq":"cable","lv":"intermediate","ins":["Posicione polias na altura do peito, fique de costas para a máquina.","Segure as pegadas com pegada pronada na altura do peito.","Empurre as mãos à frente até quase estender os braços.","Volte controlado sem perder a tensão dos cabos."],"gif":null,"img":"Cable_Chest_Press"},{"id":"Lying_T-Bar_Row","n":"Remada T-Bar Apoiada","en":"Chest-Supported T-Bar Row","pm":["middle back"],"sm":["lats","biceps"],"eq":"machine","lv":"intermediate","ins":["Deite no banco inclinado da máquina, peito apoiado.","Pegada larga ou neutra na barra.","Puxe a barra em direção ao peito, cotovelos abertos.","Aperte escápulas .","Traga as mãos à frente do peito em arco.","Aperte o peito no centro e volte controlado."],"gif":"exercicio-013.gif","img":null},{"id":"Incline_Cable_Flye","n":"Crucifixo Inclinado na Polia","en":"Incline Cable Fly","pm":["chest"],"sm":["shoulders"],"eq":"cable","lv":"intermediate","ins":["Banco inclinado a 30-45° entre duas polias baixas.","Pegue as polias com palmas voltadas para cima.","Abra os braços ligeiramente flexionados.","Una as mãos à frente do peito superior em arco."],"gif":null,"img":"Incline_Cable_Flye"},{"id":"Pulldown_Behind_The_Neck","n":"Puxada Atrás da Nuca","en":"Behind-the-Neck Pulldown","pm":["lats"],"sm":["middle back","biceps"],"eq":"cable","lv":"intermediate","ins":["Sente na máquina com coxas presas, pegada bem aberta.","Puxe a barra atrás da nuca, encostando levemente.","CUIDADO: movimento exige boa mobilidade de ombro.","Volte controlado. Se sentir desconforto, prefira a frente."],"gif":null,"img":"Wide-Grip_Pulldown_Behind_The_Neck"},{"id":"V-Bar_Pulldown","n":"Puxada Triângulo (Pegada V)","en":"V-Bar Pulldown","pm":["lats"],"sm":["biceps","middle back"],"eq":"cable","lv":"beginner","ins":["Use a barra V (triângulo) na polia alta.","Sente com coxas presas, peito estufado.","Puxe o triângulo até encostar no peito médio.","Aperte as escápulas e volte controlado."],"gif":null,"img":"V-Bar_Pulldown"},{"id":"Single-Arm_Lat_Pulldown","n":"Puxada Unilateral","en":"Single-Arm Lat Pulldown","pm":["lats"],"sm":["biceps"],"eq":"cable","lv":"intermediate","ins":["Polia alta com pegada única, sente ou ajoelhe.","Puxe com um braço de cada vez focando na contração lateral.","Aperte a dorsal no fim do movimento.","Faça todas as repetições e troque o braço."],"gif":"exercicio-045.gif","img":null},{"id":"Assisted_Pullup","n":"Gravitron (Barra Assistida)","en":"Assisted Pull-up Machine / Gravitron","pm":["lats"],"sm":["biceps","middle back"],"eq":"machine","lv":"beginner","ins":["Selecione a carga assistida (quanto mais peso, mais ajuda).","Suba na pla "machine","lv":"beginner","ins":["Sente na máquina com costas no encosto, pad sobre o quadril.","Pés firmes na plataforma, joelhos a ~90°.","Empurre o quadril para cima apertando os glúteos no topo.","Desça controlado focando no glúteo durante toda a fase."],"gif":null,"img":"Barbell_Hip_Thrust"},{"id":"Single_Leg_Glute_Bridge","n":"Ponte de Glúteo Unilateral","en":"Single-Leg Glute Bridge","pm":["glutes"],"sm":["hamstrings"],"eq":"body only","lv":"intermediate","ins":["Deite com joelhos flexionados, uma perna estendida para o alto.","Empurre o quadril para cima usando apenas a perna apoiada.","Aperte o glúteo no topo.","Desça controlado e troque a perna."],"gif":null,"img":"Single_Leg_Glute_Bridge"},{"id":"Frog_Sit-Up","n":"Abdução de Quadril Deitado (no chão)","en":"Side-Lying Hip Abduction","pm":["glutes"],"sm":[],"eq":"body only","lv":"beginner","ins":["Deite de lado com pernas estendidas, uma sobre a outra.","Eleve a perna de cima mantendo-a estendida.","Aperte o glúteo médio no topo.","Desça controlado e troque o lado após as repetições."],"gif":null,"img":null},{"id":"Standing_Hip_Circles","n":"Abdução de Quadril em Pé na Polia","en":"Standing Cable Hip Abduction","pm":["glutes"],"sm":[],"eq":"cable","lv":"beginner","ins":["Tornozelo preso na polia baixa, fique de lado para a máquina.","Apoie-se em algo para estabilidade.","Eleve a perna lateralmente sem inclinar o tronco.","Volte controlada e troque o lado."],"gif":null,"img":"Standing_Hip_Circles"},{"id":"Wide_Stance_Barbell_Squat","n":"Agachamento Sumô com Barra","en":"Sumo Barbell Squat","pm":["quadriceps"],"sm":["glutes","adductors"],"eq":"barbell","lv":"intermediate","ins":["Pés bem afastados, pontas para fora, barra na parte alta das costas.","Desça mantendo joelhos alinhados com pontas dos pés.","Foco extra em glúteos e adutores.","Empurre de volta sem deixar joelhos colapsarem para dentro."],"gif":null,"img":"Wide_Stance_Barbell_Squat"},{"id":"Goblet_Squat_Off_Box","n":"Agachamento na Caixa","en":"Box Squat","pm":["quadriceps"],"sm":["glutes","hamstrings"],"eq":"barbell","lv":"intermediate","ins":["Caixa atrás (altura ~paralelo ao chão), barra na parte alta das costas.","Desça empurrando o quadril para trás até sentar na caixa.","Pause 1s na caixa.","Empurre de volta sem balançar."],"gif":null,"img":"Box_Squat"},{"id":"Leg_Press_-_45_Degrees","n":"Leg Press Horizontal","en":"Horizontal Leg Press","pm":["quadriceps"],"sm":["glutes","hamstrings"],"eq":"machine","lv":"beginner","ins":["Sente com costas no encosto, pés na plataforma na largura dos ombros.","Destrave os suportes laterais.","Desça até ~90° nos joelhos sem perder contato lombar.","Empurre de volta sem travar joelhos no fim."],"gif":"exercicio-018.gif","img":null},{"id":"Reverse_Lunge","n":"Afundo Reverso","en":"Reverse Lunge","pm":["quadriceps"],"sm":["glutes","hamstrings"],"eq":"dumbbell","lv":"beginner","ins":["Em pé com halteres ao lado do corpo.","Dê um passo grande para TRÁS flexionando ambos joelhos.","Empurre de volta com calcanhar da frente.","Variação mais segura para joelhos sensíveis."],"gif":null,"img":"Crossover_Reverse_Lunge"},{"id":"Step_Mill_Stairs","n":"Step Up no Banco","en":"Dumbbell Step-Up","pm":["quadriceps"],"sm":["glutes","hamstrings"],"eq":"dumbbell","lv":"beginner","ins":["Halteres ao lado do corpo, banco/caixa à frente (altura do joelho).","Suba na caixa pisando firme com uma perna.","Empurre o calcanhar para subir totalmente.","Desça controlado e troque a perna ou alterne."],"gif":"exercicio-032.gif","img":null},{"id":"Seated_Bent-Over_Rear_Delt_Raise","n":"Crucifixo Inverso Sentado","en":"Seated Bent-Over Rear Delt Raise","pm":["shoulders"],"sm":["middle back"],"eq":"dumbbell","lv":"intermediate","ins":["Sente na ponta do banco, tronco bem inclinado à frente.","Halteres ao lado dos pés, palmas voltadas para o corpo.","Eleve os halteres lateralmente até altura dos ombros.","Aperte deltoides posteriores e volte controlado."],"gif":null,"img":"Seated_Bent-Over_Rear_Delt_Raise"},{"id":"Cable_Reverse_Flyes","n":"Crucifixo Inverso na Polia","en":"Cable Reverse Fly","pm":["shoulders"],"sm":["middle back"],"eq":"cable","lv":"intermediate","ins":["Polias altas cruzadas, segure cada lado com a mão oposta.","Braços estendidos à frente.","Abra os braços lateralmente apertando deltoides posteriores.","Volte controlado mantendo tensão."],"gif":null,"img":"Reverse_Flyes"},{"id":"Lateral_Raise_-_With_Bands","n":"Elevação Lateral com Faixa","en":"Banded Lateral Raise","pm":["shoulders"],"sm":[],"eq":"bands","lv":"beginner","ins":["Pise na faixa, segure as pontas com cada mão.","Eleve os braços lateralmente até a altura dos ombros.","Cotovelos levemente flexionados.","Desça controlado mantendo tensão."],"gif":null,"img":"Lateral_Raise_-_With_Bands"},{"id":"Drag_Curl","n":"Rosca Drag Curl","en":"Drag Curl","pm":["biceps"],"sm":["forearms"],"eq":"barbell","lv":"intermediate","ins":["Em pé com barra, cotovelos puxando para trás durante a subida.","A barra 'arrasta' próxima ao corpo (não vai à frente).","Foco maior na cabeça longa do bíceps.","Desça controlado."],"gif":null,"img":"Drag_Curl"},{"id":"Concentration_Curl","n":"Rosca Concentrada na Polia","en":"Cable Concentration Curl","pm":["biceps"],"sm":[],"eq":"cable","lv":"intermediate","ins":["Sente em banco baixo ao lado da polia, cotovelo apoiado na coxa.","Pegada supinada na pegada simples da polia.","Flexione cotovelo trazendo ao ombro.","Aperte o bíceps no topo."],"gif":null,"img":"Concentration_Curls"},{"id":"Close-Grip_EZ_Bar_Curl","n":"Supino Fechado para Tríceps","en":"Close-Grip Bench Press","pm":["triceps"],"sm":["chest","shoulders"],"eq":"barbell","lv":"intermediate","ins":["Deite no banco com pegada fechada na barra (largura dos ombros).","Desça a barra ao peito médio mantendo cotovelos rente ao tronco.","Empurre verticalmente focando no tríceps.","Não abra os cotovelos durante o movimento."],"gif":null,"img":"Close-Grip_EZ_Bar_Curl"},{"id":"Two-Arm_Dumbbell_Tricep_Extension","n":"Tríceps Francês com Halter (em pé)","en":"Standing Overhead Triceps Extension","pm":["triceps"],"sm":[],"eq":"dumbbell","lv":"beginner","ins":["Em pé segurando um halter com as duas mãos, atrás da cabeça.","Cotovelos apontando para o teto, fixos.","Estenda os cotovelos elevando o halter.","Desça controlado mantendo cotovelos fixos."],"gif":null,"img":"Standing_Dumbbell_Triceps_Extension"},{"id":"Triceps_Pushdown_-_V-Bar_Attachment","n":"Tríceps na Polia com Pegada V","en":"V-Bar Triceps Pushdown","pm":["triceps"],"sm":[],"eq":"cable","lv":"beginner","ins":["Polia alta com barra V (triângulo).","Cotovelos rente ao corpo, pegada neutra.","Empurre a barra para baixo até estender.","Volte controlado."],"gif":null,"img":"Triceps_Pushdown_-_V-Bar_Attachment"},{"id":"Reverse_Grip_Triceps_Pushdown","n":"Tríceps Pulley Pegada Supinada","en":"Reverse-Grip Pushdown","pm":["triceps"],"sm":[],"eq":"cable","lv":"intermediate","ins":["Polia alta com barra reta, pegada supinada (palmas para cima).","Cotovelos rente ao corpo.","Empurre a barra para baixo até estender.","Foco maior na cabeça lateral do tríceps."],"gif":null,"img":"Reverse_Grip_Triceps_Pushdown"},{"id":"Roman_Chair_Situp","n":"Abdominal Romano (Cadeira)","en":"Roman Chair Sit-Up","pm":["abdominals"],"sm":["lower back"],"eq":"machine","lv":"intermediate","ins":["Sente na cadeira romana com pés presos.","Tronco inicialmente reto, mãos cruzadas no peito.","Desça o tronco para trás controlado e suba.","CUIDADO com lombar — não force amplitude."],"gif":null,"img":"Sit-Up"},{"id":"Cable_Russian_Twists","n":"Russian Twist na Polia","en":"Cable Russian Twist","pm":["abdominals"],"sm":[],"eq":"cable","lv":"intermediate","ins":["Polia na altura do peito, fique de lado para a máquina.","Segure a pegada com as duas mãos, braços estendidos.","Gire o tronco para o lado oposto à máquina.","Foco em obliquos, controle total."],"gif":null,"img":"Cable_Russian_Twists"},{"id":"Hyperextensions_-_With_No_Hyperextension_","n":"Extensão Lombar (Cadeira Romana)","en":"Hyperextension / Back Extension","pm":["lower back"],"sm":["glutes","hamstrings"],"eq":"machine","lv":"beginner","ins":["Posicione-se na cadeira romana 45° (ou banco hiper).","Quadril apoiado no pad, pés presos.","Desça o tronco controlado mantendo coluna neutra.","Suba até linha do corpo (não hiperestenda)."],"gif":"exercicio-011.gif","img":null},{"id":"Reverse_Crunch","n":"Abdominal Reverso","en":"Reverse Crunch","pm":["abdominals"],"sm":[],"eq":"body only","lv":"intermediate","ins":["Deite com mãos ao lado do corpo, joelhos a 90°.","Eleve quadril trazendo joelhos em direção ao peito.","Aperte abdômen inferior no topo.","Desça controlado."],"gif":null,"img":"Reverse_Crunch"},{"id":"Side_Plank","n":"Prancha Lateral","en":"Side Plank","pm":["abdominals"],"sm":["shoulders","glutes"],"eq":"body only","lv":"intermediate","ins":["Apoie um antebraço e a lateral do pé no chão.","Corpo formando linha reta diagonal, quadril alinhado.","Aperte oblíquos durante todo o tempo.","Mantenha 30-60s e troque o lado."],"gif":null,"img":"Push_Up_to_Side_Plank"},{"id":"Dead_Bug","n":"Dead Bug (Inseto Morto)","en":"Dead Bug","pm":["abdominals"],"sm":[],"eq":"body only","lv":"beginner","ins":["Deite de costas com braços estendidos para o teto, joelhos a 90°.","Estenda braço direito atrás da cabeça e perna esquerda à frente.","Volte e alterne (braço esquerdo + perna direita).","Lombar SEMPRE colada no chão."],"gif":null,"img":"Dead_Bug"},{"id":"Bird_Dog","n":"Bird Dog (Cão de Caça)","en":"Bird Dog","pm":["lower back"],"sm":["abdominals","glutes"],"eq":"body only","lv":"beginner","ins":["4 apoios (joelhos e mãos no chão).","Estenda braço direito à frente e perna esquerda atrás simultaneamente.","Mantenha corpo alinhado, 2-3s.","Volte e alterne (braço esquerdo + perna direita)."],"gif":"exercicio-027.gif","img":null},{"id":"Iso-Lateral_Row","n":"Remada Hammer Iso-Lateral","en":"Iso-Lateral Row Machine","pm":["middle back"],"sm":["lats","biceps"],"eq":"machine","lv":"intermediate","ins":["Sente na máquina com peito apoiado no pad.","Pegada independente em cada braço.","Puxe alternadamente ou simultâneo.","Foco em corrigir assimetrias entre os lados."],"gif":null,"img":"Leverage_Iso_Row"},{"id":"Cable_Row_Standing_Two_Arm","n":"Remada Baixa em Pé na Polia","en":"Standing Cable Row","pm":["middle back"],"sm":["lats","biceps"],"eq":"cable","lv":"intermediate","ins":["Em pé na polia baixa com triângulo, costas eretas.","Tronco levemente inclinado à frente.","Puxe o triângulo até o abdômen.","Aperte escápulas no fim do movimento."],"gif":null,"img":null},{"id":"Single-Arm_Cable_Row","n":"Remada Unilateral na Polia","en":"Single-Arm Cable Row","pm":["middle back"],"sm":["lats","biceps"],"eq":"cable","lv":"intermediate","ins":["Polia baixa com pegada única, sente.","Puxe um braço de cada vez até a costela.","Permite maior amplitude que com duas mãos.","Foco em isolar cada lado."],"gif":null,"img":"Seated_One-arm_Cable_Pulley_Rows"},{"id":"Wrist_Roller_Reverse","n":"Rosca de Punho Inversa","en":"Reverse Wrist Curl","pm":["forearms"],"sm":[],"eq":"dumbbell","lv":"beginner","ins":["Sente com antebraços apoiados nas coxas, palmas para BAIXO.","Halteres na mão, deixe punho cair para baixo.","Eleve o punho contraindo extensores.","Repita controladamente."],"gif":null,"img":"Wrist_Roller"},{"id":"Farmers_Walk","n":"Caminhada do Fazendeiro (Farmer's Walk)","en":"Farmer's Walk","pm":["forearms"],"sm":["traps","abdominals"],"eq":"dumbbell","lv":"intermediate","ins":["Halteres pesados ao lado do corpo, postura ereta.","Caminhe em linha reta passos curtos e firmes.","Trapézio ativo, abdômen contraído.","Excelente para grip strength e core."],"gif":null,"img":"Farmers_Walk"},{"id":"Kettlebell_Swing","n":"Swing com Kettlebell","en":"Kettlebell Swing","pm":["glutes"],"sm":["hamstrings","shoulders","abdominals"],"eq":"kettlebells","lv":"intermediate","ins":["Kettlebell entre as pernas, pés na largura dos ombros.","Empurre quadril para trás e balance kb entre as pernas.","Empurre quadril à frente lançando kb à altura do peito.","O movimento vem do QUADRIL, não dos braços."],"gif":null,"img":"One-Arm_Kettlebell_Swings"},{"id":"Battle_Ropes","n":"Battle Rope (Cordas)","en":"Battle Ropes","pm":["shoulders"],"sm":["abdominals","forearms"],"eq":"other","lv":"intermediate","ins":["Em pé com uma ponta da corda em cada mão.","Pés na largura dos ombros, joelhos semi-flexionados.","Faça ondas alternadas ou simultâneas com os braços.","Mantenha intensidade alta por 20-30s."],"gif":null,"img":"Battling_Ropes"},{"id":"Plyo_Box_Jump","n":"Skipping (Joelhos Altos)","en":"High Knees","pm":["quadriceps"],"sm":["calves","abdominals"],"eq":"body only","lv":"beginner","ins":["Em pé, corra no lugar elevando joelhos até altura do quadril.","Braços alternam como na corrida.","Mantenha ritmo intenso por 20-30s.","Excelente aquecimento ou intervalo HIIT."],"gif":null,"img":null},{"id":"World_Greatest_Stretch","n":"Maior Alongamento do Mundo","en":"World's Greatest Stretch","pm":["hamstrings"],"sm":["glutes","shoulders"],"eq":"body only","lv":"beginner","ins":["Avanço (lunge) com perna direita à frente.","Mão esquerda no chão ao lado do pé direito.","Mão direita estendida para o teto, gire o tronco.","Volte e troque o lado — alongamento global."],"gif":null,"img":"Worlds_Greatest_Stretch"},{"id":"Childs_Pose","n":"Postura da Criança","en":"Child's Pose","pm":["lower back"],"sm":["lats"],"eq":"body only","lv":"beginner","ins":["Ajoelhe no chão, sente nos calcanhares.","Estenda os braços à frente, testa no chão.","Relaxe a coluna sentindo o alongamento.","Mantenha 30-60s respirando profundamente."],"gif":null,"img":"Childs_Pose"},{"id":"Reverse_Hack_Squat","n":"Agachamento Hack Reverso","en":"Reverse Hack Squat","pm":["quadriceps","glutes"],"sm":["hamstrings"],"eq":"machine","lv":"intermediate","ins":["Posicione-se na máquina de hack squat com o peito apoiado no encosto (de frente pra máquina, ao contrário do hack tradicional).","Apoie os ombros sob as almofadas, pés na plataforma com afastamento confortável.","Solte as travas de segurança e desça flexionando joelhos e quadris.","Desça até coxas paralelas (ou um pouco abaixo se mobilidade permitir).","Empurre a plataforma com força pelos calcanhares para subir, mantendo controle.","Estende joelhos e quadris sem hiperextensão na subida."],"gif":"exercicio-009.gif","img":null},{"id":"Machine_Shoulder_Press_Neutral_Grip","n":"Desenvolvimento na Máquina (Pegada Neutra)","en":"Machine Shoulder Press (Neutral Grip)","pm":["shoulders"],"sm":["triceps","chest"],"eq":"machine","lv":"beginner","ins":["Sente na máquina de desenvolvimento com pegada neutra (palmas voltadas uma para a outra).","Ajuste o banco para que as pegadas fiquem na altura dos ombros.","Mantenha as costas firmes no encosto e core contraído.","Empurre as pegadas para cima até quase estender os cotovelos.","Não trave os cotovelos no topo.","Desça controladamente até as pegadas alinharem com os ombros."],"gif":"exercicio-015.gif","img":null},{"id":"Hammer_Strength_Bench_Press","n":"Supino Hammer","en":"Hammer Strength Bench Press","pm":["chest"],"sm":["triceps","shoulders"],"eq":"machine","lv":"beginner","ins":["Sente na máquina Hammer Strength com peito apoiado no banco.","Ajuste o banco para que as pegadas fiquem na altura média do peito.","Pegue as alças com pegada pronada e core contraído.","Empurre as alças à frente até quase estender os cotovelos.","Não trave os cotovelos no topo.","Retorne controladamente até a posição inicial."],"gif":"exercicio-023.gif","img":null},{"id":"Standing_Dumbbell_Triceps_Extension","n":"Tríceps Francês com Halter em Pé","en":"Standing Overhead Dumbbell Triceps Extension","pm":["triceps"],"sm":[],"eq":"dumbbell","lv":"beginner","ins":["Em pé, segure um halter com as duas mãos sobre a cabeça.","Pés afastados na largura dos ombros, core contraído.","Mantenha os cotovelos próximos da cabeça e apontados para cima.","Flexione os cotovelos para baixar o halter atrás da cabeça.","Estenda os cotovelos para retornar à posição inicial sem travá-los.","Mantenha os ombros estáveis e cotovelos fixos durante todo o movimento."],"gif":"exercicio-026.gif","img":null},{"id":"Bayesian_Curl","n":"Rosca Bayesian (Polia)","en":"Bayesian Curl","pm":["biceps"],"sm":["forearms"],"eq":"cable","lv":"intermediate","ins":["Polia baixa atrás do corpo, pegada supinada, dê um passo à frente.","Cotovelo levemente para trás, atrás da linha do quadril.","Flexione o cotovelo trazendo o pulso ao ombro.","O posicionamento da polia por trás maximiza o alongamento do bíceps.","Desça controlado sem deixar o cotovelo cair para frente.","Faça todas as reps e troque o braço."],"gif":"exercicio-034.gif","img":null},{"id":"Bicep_Curl_Machine","n":"Rosca Bíceps na Máquina","en":"Machine Bicep Curl","pm":["biceps"],"sm":["forearms"],"eq":"machine","lv":"beginner","ins":["Sente na máquina com os braços apoiados no pad, cotovelos alinhados com o eixo.","Ajuste o assento para que os cotovelos fiquem na borda do pad.","Pegada supinada nas pegadas da máquina.","Flexione os cotovelos trazendo as pegadas até os ombros.","Aperte o bíceps no topo e desça controlado.","Não force a amplitude além do que a máquina permite."],"gif":"exercicio-035.gif","img":null},{"id":"Puxada_Articulada_Supinada","n":"Puxada Articulada Supinada","en":"Articulated Supinated Pulldown","pm":["lats","biceps"],"sm":["rhomboids","rear_deltoids","teres_major"],"eq":"cable","lv":"intermediate","ins":["Sente-se na máquina de puxada com os joelhos bem presos sob o suporte.","Pegue a barra ou puxador com pegada supinada (palmas voltadas para você), na largura dos ombros.","Parta com os braços totalmente estendidos acima da cabeça.","Puxe o puxador em direção ao peito, trazendo os cotovelos para baixo e para trás.","No final do movimento, aperte as escápulas e contraia o latíssimo.","Suba o puxador de forma controlada, voltando à posição inicial sem soltar a tensão."],"gif":"exercicio-036.gif","img":null},{"id":"Good_Morning","n":"Bom Dia (Good Morning)","en":"Good Morning","pm":["hamstrings"],"sm":["glutes","lower back"],"eq":"barbell","lv":"intermediate","ins":["Posicione a barra sobre o trapézio (como num agachamento), pés na largura dos ombros.","Mantenha a coluna neutra e o core firmemente contraído durante todo o movimento.","Com leve flexão de joelhos, faça uma dobradiça de quadril empurrando o glúteo para trás.","Desça o tronco até sentir alongamento dos posteriores (paralelo ao solo é o limite seguro).","Suba estendendo o quadril, contraindo glúteo e posterior.","Não arredonde a coluna em nenhuma fase. Comece com carga LEVE — exercício técnico."],"gif":"exercicio-038.gif","img":null},{"id":"Stiff_Pernas_Retas_Dumbbell","n":"Stiff com Halteres (pernas retas)","en":"Stiff-Legged Deadlift with Dumbbells","pm":["hamstrings"],"sm":["glutes","lower back"],"eq":"dumbbell","lv":"intermediate","ins":["Em pé, um halter em cada mão na frente das coxas, pegada pronada.","Pés afastados na largura do quadril, joelhos TRAVADOS (pernas retas — diferente do RDL).","Faça dobradiça de quadril empurrando o glúteo para trás, mantendo as pernas retas.","Desça os halteres rente às pernas até sentir alongamento intenso dos posteriores.","Suba estendendo o quadril, contraindo glúteo e posterior no topo.","Coluna neutra durante todo o movimento. Exige mobilidade — comece com carga baixa."],"gif":"exercicio-039.gif","img":null},{"id":"Articulated_Row_Neutral_Grip","n":"Remada Articulada Pegada Neutra","en":"Articulated Row (Neutral Grip)","pm":["middle back"],"sm":["lats","biceps","rear_deltoids"],"eq":"machine","lv":"beginner","ins":["Sente na máquina de remada articulada com o peito apoiado no encosto.","Pegue as pegadas neutras (palmas voltadas uma para a outra).","Ajuste o assento para que as pegadas fiquem na altura do meio do peito.","Puxe as pegadas em direção ao tronco, trazendo os cotovelos para trás e juntando as escápulas.","Aperte o meio das costas no final do movimento.","Retorne controladamente até quase estender os braços, mantendo tensão."],"gif":"exercicio-040.gif","img":null},{"id":"Articulated_Row_Pronated_Grip","n":"Remada Articulada Pegada Pronada","en":"Articulated Row (Pronated Grip)","pm":["middle back"],"sm":["rear_deltoids","biceps","lats"],"eq":"machine","lv":"beginner","ins":["Sente na máquina de remada articulada com o peito apoiado no encosto.","Pegue as pegadas com pegada pronada (palmas para baixo) — recruta mais deltoide posterior.","Ajuste o assento para que as pegadas fiquem na altura do meio do peito.","Puxe as pegadas em direção ao tronco, cotovelos abrindo para fora (alto).","Aperte escápulas e posterior do ombro no final.","Retorne controladamente, sem deixar os ombros caírem à frente."],"gif":"exercicio-041.gif","img":null},{"id":"Standing_Cable_Glute_Kickback","n":"Extensão de Glúteo na Polia em Pé","en":"Standing Cable Glute Kickback","pm":["glutes"],"sm":["hamstrings"],"eq":"cable","lv":"beginner","ins":["Polia baixa, fixe a caneleira no tornozelo da perna que vai trabalhar.","Em pé de frente para a polia, segure no aparelho para estabilidade.","Tronco levemente inclinado à frente, core firme.","Estenda o quadril levando a perna para trás, sem arquear a lombar.","Aperte o glúteo no topo do movimento.","Retorne controladamente sem deixar o peso bater no batente. Faça todas as reps e troque."],"gif":"exercicio-042.gif","img":null},{"id":"Cable_Glute_Kickback_Bench","n":"Extensão de Glúteo na Polia com Banco","en":"Cable Glute Kickback on Bench","pm":["glutes"],"sm":["hamstrings"],"eq":"cable","lv":"intermediate","ins":["Polia baixa, caneleira no tornozelo.","Posicione um banco inclinado entre você e a polia. Deite com o tronco apoiado no banco, quadril fora da borda.","Joelho da perna parada apoiado no banco; mãos seguram para estabilizar.","Quadril em flexão na posição inicial (perna abaixada, sob tensão).","Estenda o quadril contraindo o glúteo, levando a perna para cima e para trás.","Pausa breve no topo e d const DBN = 'mgcoach_consultoria', DBV = 1, STORES = ['alunos', 'versoes', 'modelos', 'biblioteca', 'config'];
let _db = null, MEMDB = null;
function openDB() {
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    let req; try { req = indexedDB.open(DBN, DBV); } catch (e) { return rej(e); }
    req.onupgradeneeded = e => { const d = e.target.result; STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
    req.onsuccess = () => { _db = req.result; res(_db); };
    req.onerror = () => rej(req.error);
    req.onblocked = () => rej(new Error('blocked'));
  });
}
function mem(st) { MEMDB = MEMDB || {}; return MEMDB[st] = MEMDB[st] || new Map(); }
async function dbOp(st, mode, fn) {
  try {
    const d = await openDB();
    return await new Promise((res, rej) => { const t = d.transaction(st, mode); const r = fn(t.objectStore(st)); t.oncomplete = () => res(r && 'result' in r ? r.result : undefined); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error); });
  } catch (e) { return null; }
}
async function dbAll(st) { if (!_db && MEMDB) return [...mem(st).values()]; const r = await dbOp(st, 'readonly', s => s.getAll()); if (r === null) return [...mem(st).values()].map(clone); return r || []; }
async function dbPut(st, obj) { const r = await dbOp(st, 'readwrite', s => s.put(obj)); if (r === null) mem(st).set(obj.id, clone(obj)); }
async function dbDel(st, id) { const r = await dbOp(st, 'readwrite', s => s.delete(id)); if (r === null) mem(st).delete(id); }
async function dbClear(st) { const r = await dbOp(st, 'readwrite', s => s.clear()); if (r === null) mem(st).clear(); }

}

let _saveT = null; const _dirty = new Set();
function touch(obj) {
  obj = obj || cur(); if (!obj) return;
  const real = obj._modelo || obj;
  real.atualizadoEm = Date.now();
  _dirty.add(real);
  $('saveSt').textContent = 'Salvando…';
  clearTimeout(_saveT); _saveT = setTimeout(flush, 450);
}
async function flush() {
  const items = [..._dirty]; _dirty.clear();
  for (const o of items) await dbPut(MODELOS.includes(o) ? 'modelos' : 'alunos', o);
  $('saveSt').textContent = 'Salvo';
  setTimeout(() => { if ($('saveSt').textContent === 'Salvo') $('saveSt').textContent = ''; }, 1500);
  pedirPersistencia();
}
window.addEventListener('pagehide', () => { if (_dirty.size) flush(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && _dirty.size) flush(); });
let _persistAsked = false;

function setPath(o, p, v) { const ks = p.split('.'); const last = ks.pop(); const t = ks.reduce((a, k) => (a[k] = a[k] ?? {}), o); t[last] = v; }

let _tt; function toast(t) { const el = $('toast'); el.textContent = t; el.classList.add('on'); clearTimeout(_tt); _tt = setTimeout(() => el.classList.remove('on'), 1800); }
let SHEET = null;
function openSheet({ title, body, foot = '', tall = false, onMount, onClose, nopad = false }) {
  const sh = $('sheet');
  sh.className = 'sheet' + (tall ? ' tall' : '');
  sh.innerHTML = `<div class="sh-h"><h2 id="shTitle">${title}</h2><button class="sh-x" type="button" data-act="closeSheet" aria-label="Fechar">×</button></div><div class="sh-b${nopad ? ' nopad' : ''}" id="shB">${body}</div>${foot ? `<div class="sh-f" id="shF">${foot}</div>` : ''}`;
  const ov = $('ov'); ov.hidden = false;
  SHEET = { onClose, last: document.activeElement };
  requestAnimationFrame(() => requestAnimationFrame(() => ov.classList.add('open')));
  if (onMount) onMount(sh);
  document.body.style.overflow = 'hidden';
}
function closeSheet() {
  const ov = $('ov'); if (ov.hidden) return;
  ov.classList.remove('open'); document.body.style.overflow = '';
  const s = SHEET; SHEET = null;
  setTimeout(() => { if (!SHEET) { ov.hidden = true; $('sheet').innerHTML = ''; } }, 200);
  if (s && s.onClose) s.onClose();
  if (s && s.last && document.contains(s.last)) try { s.last.focus({ preventScroll: true }); } catch (e) {}
}
function swapSheet(fn) { closeSheet(); setTimeout(fn, 210); }
$('ov').addEventListener('click', e => { if (e.target.id === 'ov') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SHEET) closeSheet(); });
function confirmar({ title, text, ok = 'Confirmar', danger = false, onOk }) {

}

/* ---------- busca de alimentos ---------- */
function bibFoods() { return BIB.filter(b => b.tipo === 'food' || b.tipo === 'rec').map(b => b.w ? b : indexFood(b)); }
function buscarAlimento(q) {
  const qt = words(q).filter(t => !FSTOP.has(t)); if (!qt.length) return [];
  const out = [];
  for (const f of bibFoods().concat(FOODS)) {
    let ok = true, sc = 0, first = 99;
    for (const t of qt) {
      let hit = -1; const alts = FSYN[t] || [t];
      for (let i = 0; i < f.w.length && hit < 0; i++) for (const al of alts) { if (f.w[i].startsWith(al)) { hit = i; break; } }
      if (hit < 0 && t.length >= 4 && f.nn.includes(t)) hit = 20;
      if (hit < 0) { ok = false; break; }
      if (f.w[hit] === t) sc += 6; first = Math.min(first, hit);
    }
    if (!ok) continue;
    if (f.w[0] && f.w[0].startsWith(qt[0])) sc += 14;
    sc -= first * 2 + f.w.length * 0.8;
    if (f.s === 'U' || f.s === 'O' || f.s === 'R') sc += 40; else if (f.s === 'N') sc += 10; else if (f.s === 'M') sc += 6; else if (f.s === 'T') sc += 3;
    if (/\b(cozid|grelhad|assad)/.test(f.nn)) sc += 2;
    for (const w of FMODS) if (f.w.includes(w) && !qt.some(t => w.startsWith(t))) sc -= 5;
    out.push([sc, f]);
  }
  out.sort((x, y) => y[0] - x[0]);
  return out.slice(0, 40).map(x => x[1]);
}
function foodRow(f) { return `<button class="res" type="button" data-fid="${esc(f.id)}"><span class="nm"><span class="tag${f.s === 'U' || f.s === 'O' || f.s === 'R' ? ' dat' : ''}">${SRC[f.s] || f.s}</span> ${esc(f.n)}<em>${esc([f.cat, f.u ? `1 ${f.un} = ${fk(f.u)} g` : ''].filter(Boolean).join(' · '))}</em></span><span class="kc">${fk(f.k)}<small>kcal/100 g</small></span></button>`; }
function findFood(id) { return FOODS.find(f => f.id === id) || bibFoods().find(f => f.id === id); }

    onMount: () => {
      const q = $('faQ');
      const draw = () => {
        const v = q.value.trim(); const L = $('faL');
        if (v.length < 2) { L.innerHTML = ''; $('faH').hidden = false; return; }

        $('faRot').onclick = () => swapSheet(() => rotuloSheet({ n: v }, f => onPick(f)));
        $('faOff').onclick = () => swapSheet(() => offSheet(v, f => onPick(f)));
      };
      q.oninput = draw;
      $('faRec').onclick = () => swapSheet(() => receitaSheet(null, f => onPick(f), q.value.trim()));
      $('faProp').onclick = () => swapSheet(() => rotuloSheet({ n: q.value.trim() }, f => onPick(f)));
      $('faMarca').onclick = () => swapSheet(() => offSheet(q.value.trim(), f => onPick(f)));
      $('faL').onclick = e => { const b = e.target.closest('.res'); if (!b) return; const f = findFood(b.dataset.fid); if (f) swapSheet(() => onPick(f)); };

}
ACT.addItem = el => { const a = cur(); const r = planoDe(a, UI.plano).refeicoes[+el.dataset.r]; buscaAlimentoSheet(`Adicionar em ${esc(r.nome)}`, f => itemSheet(a, r, null, f)); };
ACT.editItem = el => { const a = cur(); const r = planoDe(a, UI.plano).refeicoes[+el.dataset.r]; itemSheet(a, r, +el.dataset.j, null); };
function itemDeFood(f, q, modo) { return { n: f.n, k: f.k, p: f.p, c: f.c, g: f.g, fb: f.fb || 0, s: f.s, q, modo, u: f.u || 0, un: f.un || '', subs: [] }; }
function itemSheet(a, r, j, food) {

      <div class="opts" id="iU"><button class="opt${it.modo !== 'u' ? ' on' : ''}" type="button" data-u="g">Gramas</button>${it.u ? `<button class="opt${it.modo === 'u' ? ' on' : ''}" type="button" data-u="u">${esc(it.un || 'unidade')} (${fk(it.u)} g)</button>` : ''}<button class="opt" type="button" data-u="nova">Outra medida</button></div>
      <div class="qty"><button class="step" type="button" data-q="-1">−</button><input id="iQ" type="number" inputmode="decimal" step="any" value="${esc(it.q)}" aria-label="Quantidade"><button class="step" type="button" data-q="1">+</button></div>

      <div class="block" style="margin:0;padding:14px"><h3>Substituições</h3><p class="note" style="margin-bottom:8px">O aluno escolhe entre este alimento e as substituições. A quantidade é calculada para ficar equivalente.</p>
        ${it.subs.map((s, k) => { const sm = macItem(s); return `<div class="fx" style="cursor:default"><span class="a">${esc(s.n)}</span><span class="b">${esc(qtyTxt(s))} <button class="icon-btn" type="button" data-ds="${k}" aria-label="Remover substituição" style="width:26px;height:26px;margin-left:4px">×</button></span><span class="c">${fk(sm.k)} kcal</span><span class="d">P ${fmt(sm.p)} · C ${fmt(sm.c)} · G ${fmt(sm.g)}</span></div>`; }).join('')}
        <span class="lbl" style="margin-top:10px">Equivaler por</span><div class="opts" id="iB">${[['k', 'Calorias'], ['c', 'Carboidrato'], ['p', 'Proteína'], ['g', 'Gordura']].map(([k, t]) => `<button class="opt sm${base === k ? ' on' : ''}" type="button" data-b2="${k}">${t}</button>`).join('')}</div>

  };

    foot: `${edit ? `<button class="btn btn-danger" type="button" id="iDel">Remover</button>` : `<button class="btn btn-line" type="button" data-act="closeSheet">Cancelar</button>`}<button class="btn btn-ink" type="button" id="iOk">${edit ? 'Salvar' : 'Adicionar'}</button>`,
    onMount: () => {
      const B = $('shB');
      const redraw = () => { const st = B.scrollTop; const sv = $('iS') ? $('iS').value : ''; B.innerHTML = body(); B.scrollTop = st; if (sv) { $('iS').value = sv; drawS(); } };
      const drawS = () => { const v = $('iS').value.trim(); $('iSL').innerHTML = v.length < 2 ? '' : `<div class="res-l">${buscarAlimento(v).slice(0, 12).map(foodRow).join('')}</div>`; };
      B.addEventListener('input', e => {
        if (e.target.id === 'iQ') { it.q = num(e.target.value) || 0; const m = macItem(it); B.querySelector('.prev').innerHTML = `<div><small>kcal</small><b>${fk(m.k)}</b></div><div><small>proteína</small><b>${fmt(m.p)} g</b></div><div><small>carbo</small><b>${fmt(m.c)} g</b></div><div><small>gordura</small><b>${fmt(m.g)} g</b></div>`; }

      B.addEventListener('click', e => {
        const t = e.target;

        const u = t.closest('[data-u]');
        if (u) {
          if (u.dataset.u === 'nova') return medidaSheetInline();
          const g = gramasItem(it); it.modo = u.dataset.u; it.q = it.modo === 'u' ? Math.max(0.5, Math.round(g / it.u * 2) / 2) : Math.round(g); return redraw();
        }
        const b2 = t.closest('[data-b2]'); if (b2) { base = b2.dataset.b2; return redraw(); }
        const ds = t.closest('[data-ds]'); if (ds) { it.subs.splice(+ds.dataset.ds, 1); return redraw(); }
        const fr = t.closest('.res'); if (fr) { const f = findFood(fr.dataset.fid); if (f) { it.subs.push(equivalente(it, f, base)); $('iS').value = ''; redraw(); toast('Substituição adicionada'); } }
      });
      function medidaSheetInline() {
        const box = document.createElement('div'); box.className = 'block'; box.style.cssText = 'margin:0;padding:14px';
        box.innerHTML = `<h3>Outra medida</h3><div class="form"><label class="campo">Nome da medida<input id="mdN" placeholder="ex: colher de sopa"></label><label class="campo">Quantos gramas<input id="mdG" inputmode="decimal" placeholder="25"></label></div><button class="btn btn-ink btn-sm" type="button" id="mdOk">Usar esta medida</button>`;
        $('iU').after(box);
        $('mdOk').onclick = () => { const g = num($('mdG').value); if (!(g > 0)) return $('mdG').focus(); const gt = gramasItem(it); it.u = g; it.un = $('mdN').value.trim() || 'porção'; it.modo = 'u'; it.q = Math.max(0.5, Math.round(gt / g * 2) / 2); redraw(); };
      }
      $('iOk').onclick = () => { if (!(num(it.q) > 0)) return toast('Informe a quantidade'); if (edit) op.itens[j] = it; else op.itens.push(it); touch(a); closeSheet(); rerenderKeepMeta(); toast(edit ? 'Alimento atualizado' : 'Alimento adicionado'); };
      const d = $('iDel'); if (d) d.onclick = () => { op.itens.splice(j, 1); touch(a); closeSheet(); rerenderKeepMeta(); toast('Alimento removido'); };
    } });
}
function equivalente(it, f, base) {
  const alvo = macItem(it)[base]; const per = f[base] / 100;
  let g = per > 0 && alvo > 0 ? alvo / per : gramasItem(it);

  const s = itemDeFood(f, g, 'g'); delete s.subs;
  if (f.u) { const un = g / f.u; const r = Math.round(un * 2) / 2; if (r >= 0.5 && Math.abs(un - r) / un < 0.15) { s.modo = 'u'; s.q = r; } }
  return s;
}

function rotuloSheet(pre, onSaved) {
  openSheet({ title: 'Alimento próprio', body: `<p class="note">Copie a tabela nutricional da embalagem, na coluna da porção. Sem rótulo? Use porção de 100 g com os valores que você tem. O alimento fica salvo nos seus alimentos.</p>

    <label class="campo">Porção (g ou ml)<input id="rtPo" inputmode="decimal" placeholder="30"></label><label class="campo">Valor energético (kcal)<input id="rtK" inputmode="decimal" placeholder="120"></label>
    <label class="campo">Carboidratos (g)<input id="rtC" inputmode="decimal"></label><label class="campo">Proteínas (g)<input id="rtP" inputmode="decimal"></label>
    <label class="campo">Gorduras totais (g)<input id="rtG" inputmode="decimal"></label><label class="campo">Fibra alimentar (g)<input id="rtF" inputmode="decimal"></label>
    <label class="campo full">Nome da porção (opcional)<input id="rtU" placeholder="ex: pote, unidade, scoop"></label></div><p class="note" id="rtE" hidden style="color:var(--down)"></p>`,
    foot: `<button class="btn btn-line" type="button" data-act="closeSheet">Cancelar</button><button class="btn btn-ink" type="button" id="rtOk">Salvar</button>`,
    onMount: () => { $('rtOk').onclick = async () => {
      const n = $('rtN').value.trim(), po = num($('rtPo').value), k = num($('rtK').value), E = $('rtE');
      if (!n) { E.textContent = 'Dê um nome ao produto.'; E.hidden = false; return; }
      if (!(po > 0)) { E.textContent = 'Preencha a porção em gramas ou ml, como está no rótulo.'; E.hidden = false; return; }
      if (!(k >= 0)) { E.textContent = 'Preencha o valor energético da porção.'; E.hidden = false; return; }
      const p100 = id => { const v = num($(id).value); return isFinite(v) ? Math.round(v / po * 1000) / 10 : 0; };
      const f = indexFood({ id: 'u_' + uid(), tipo: 'food', n, k: Math.round(k / po * 100), p: p100('rtP'), c: p100('rtC'), g: p100('rtG'), fb: p100('rtF'), s: 'U', cat: 'Meus alimentos', u: po, un: $('rtU').value.trim() || 'porção' });
      await salvarBib(f); toast('Salvo nos seus alimentos'); if (onSaved) swapSheet(() => onSaved(f)); else { closeSheet(); render(); }
    }; } });
}
async function salvarBib(o) { const c = { ...o }; delete c.w; delete c.nn; BIB = BIB.filter(b => b.id !== o.id); BIB.push(o); await dbPut('biblioteca', c); }
function offSheet(q, onSaved) {
  openSheet({ title: 'Produtos de marca', tall: true, body: `<input class="busca paper" type="search" id="ofQ" value="${esc(q || '')}" placeholder="Nome do produto e marca"><p class="note" id="ofS">Busca no Open Food Facts, a base aberta de produtos. Os dados são cadastrados por usuários: confira com a embalagem.</p><div id="ofL"></div>`,
    foot: `<button class="btn btn-ink btn-full" type="button" id="ofGo">Buscar</button>`,
    onMount: () => {
      let ctl = null; let ops = [];
      const go = async () => {
        const v = $('ofQ').value.trim(); if (v.length < 2) return;
        if (ctl) ctl.abort(); ctl = new AbortController();
        $('ofS').innerHTML = '<span>Buscando…</span>'; $('ofL').innerHTML = '';
        const fields = 'product_name,product_name_pt,brands,nutriments,serving_quantity,serving_size';
        const url = h => `https://${h}.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(v)}&search_simple=1&action=process&json=1&page_size=24&fields=${fields}`;
        const parse = d => (d && Array.isArray(d.products) ? d.products : []).map(p => { const n = p.nutriments || {}; let k = num(n['energy-kcal_100g']); if (!isFinite(k) && isFinite(num(n.energy_100g))) k = num(n.energy_100g) / 4.184; const nm = (p.product_name_pt || p.product_name || '').trim(); const br = (p.brands || '').split(',')[0].trim(); if (!nm || !isFinite(k)) return null; return { n: br && !norm(nm).includes(norm(br)) ? nm + ' · ' + br : nm, k: Math.round(k), p: num(n.proteins_100g) || 0, c: num(n.carbohydrates_100g) || 0, g: num(n.fat_100g) || 0, fb: num(n.fiber_100g) || 0, u: num(p.serving_quantity) || 0, un: p.serving_size || '' }; }).filter(Boolean);
        try {
          for (const h of ['br', 'world']) { const r = await fetch(url(h), { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); ops = parse(await r.json()); if (ops.length) break; }
          const seen = new Set(); ops = ops.filter(o => { const k = norm(o.n); if (seen.has(k)) return false; seen.add(k); return true; }).slice(0, 15);
          $('ofS').textContent = ops.length ? 'Toque no produto certo. Ele fica salvo nos seus alimentos.' : 'Nenhum produto com tabela nutricional. Tente o nome com a marca, ou cadastre pelo rótulo.';

        } catch (e) { if (e.name !== 'AbortError') $('ofS').textContent = IN_CLAUDE ? 'A busca de produtos funciona no app instalado. Aqui, cadastre pelo rótulo.' : 'Não deu para buscar agora. Confira a internet ou cadastre pelo rótulo.'; }
      };
      $('ofGo').onclick = go; $('ofQ').onkeydown = e => { if (e.key === 'Enter') go(); };
      $('ofL').onclick = async e => { const b = e.target.closest('.res'); if (!b) return; const o = ops[+b.dataset.i]; const f = indexFood({ id: 'o_' + uid(), tipo: 'food', n: o.n.slice(0, 90), k: o.k, p: Math.round(o.p * 10) / 10, c: Math.round(o.c * 10) / 10, g: Math.round(o.g * 10) / 10, fb: Math.round(o.fb * 10) / 10, s: 'O', cat: 'Open Food Facts', u: o.u > 0 ? o.u : 0, un: o.u > 0 ? 'porção' : '' }); await salvarBib(f); if (onSaved) swapSheet(() => onSaved(f)); else { closeSheet(); render(); } };
      if (q) go();
    } });
}

function receitaSheet(rec, onSaved, nome0) {

  delete R.w; delete R.nn;
  const calc = () => { const t = R.ing.reduce((s, i) => { const g = num(i.q) || 0; s.k += i.k * g / 100; s.p += i.p * g / 100; s.c += i.c * g / 100; s.g += i.g * g / 100; s.fb += (i.fb || 0) * g / 100; s.m += g; return s; }, { k: 0, p: 0, c: 0, g: 0, fb: 0, m: 0 }); const rend = num(R.rend) > 0 ? num(R.rend) : t.m; const f = rend > 0 ? 100 / rend : 0; return { t, rend, k: t.k * f, p: t.p * f, c: t.c * f, g: t.g * f, fb: t.fb * f }; };
  const body = () => { const c = calc(); return `<label class="campo">Nome da receita<input id="rcN" value="${esc(R.n)}" placeholder="ex: Panqueca de banana"></label>
    <div class="block" style="margin:0;padding:14px"><h3>Ingredientes</h3>${R.ing.map((i, k) => `<div class="fx" style="cursor:default"><span class="a">${esc(i.n)}</span><span class="b"><input data-iq="${k}" value="${esc(i.q)}" inputmode="decimal" style="width:64px;text-align:right;font-size:15px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:4px 6px"> g <button class="icon-btn" type="button" data-di="${k}" style="width:26px;height:26px" aria-label="Remover">×</button></span></div>`).join('') || '<p class="note">Busque e adicione os ingredientes.</p>'}
      <input class="busca paper" type="search" id="rcS" placeholder="Adicionar ingrediente" autocomplete="off" style="margin-top:10px"><div id="rcL"></div></div>
    <div class="form"><label class="campo">Peso da receita pronta (g)<input id="rcR" inputmode="decimal" value="${esc(R.rend)}" placeholder="${fk(c.t.m)}"><span class="hint">Em branco: soma dos ingredientes</span></label><label class="campo">Porção (g)<input id="rcU" inputmode="decimal" value="${esc(R.u)}" placeholder="opcional"></label></div>
    <div class="prev"><div><small>kcal/100 g</small><b>${fk(c.k)}</b></div><div><small>proteína</small><b>${fmt(c.p)} g</b></div><div><small>carbo</small><b>${fmt(c.c)} g</b></div><div><small>gordura</small><b>${fmt(c.g)} g</b></div></div>

    <details class="block" style="margin:0;padding:14px"><summary style="font-weight:600;cursor:pointer">Dobras cutâneas (mm)</summary><div class="form" style="margin-top:10px">${DOBRAS.map(([k, l]) => inp('avF_' + k, l, A.dobras[k])).join('')}</div></details>

    foot: `<button class="btn btn-line" type="button" data-act="closeSheet">Cancelar</button><button class="btn btn-ink" type="button" id="avOk">Salvar avaliação</button>`,
    onMount: () => {
      $('avOk').onclick = () => {
        const g = id => { const x = num($(id).value); return isFinite(x) ? x : ''; };

        const ult = [...a.avaliacoes].sort((x, y) => y.data.localeCompare(x.data))[0];

}
